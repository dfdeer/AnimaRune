<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="아니마룬">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); box-sizing:border-box; padding-top:var(--sat); padding-bottom:var(--sab);} html{scroll-padding-top:env(safe-area-inset-top,0px);}</style>
<title>아니마룬</title>
<style>
  :root{
    --fire:#ff6b4a; --water:#4ac8ff; --wood:#5cd65c; --light:#ffe066; --dark:#9b6bff;
    --common:#b8bcc4; --rare:#4a90ff; --epic:#b04aff; --legendary:#ffb92a;
    --bg:#14141c; --panel:#1e1e2a; --panel2:#262636; --text:#eceef2; --sub:#9296a6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; overscroll-behavior:none;}
  #app{max-width:480px; margin:0 auto; min-height:calc(100vh - var(--sat) - var(--sab)); min-height:calc(100dvh - var(--sat) - var(--sab)); display:flex; flex-direction:column; position:relative;}
  header{padding:12px 14px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,#1e1e2e 0%,#2a2340 100%); border-bottom:1px solid #3d3a5a; position:sticky; top:0; z-index:20; box-shadow:0 2px 12px #00000055;} /* (v190) 화면 위쪽 고정 영역(z 8)보다 위 — ☰ 메뉴·재화 설명 팝업이 가려지던 문제. 팝업창(z 50)보다는 아래 */
  header .title{font-weight:700; font-size:16px; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  header > div:last-child{flex-shrink:0;}
  @media (max-width:360px){ header .title .tname{display:none;} } /* (v193) 좁은 폰: 제목은 아이콘만 — 오른쪽 버튼이 화면 밖으로 안 밀리게 */
  @media (max-width:350px){ header{padding:10px 8px; gap:4px;} header .title{font-size:14px;} header .essence{padding:5px 7px; font-size:13px;} }
  header .essence{background:linear-gradient(135deg,#2c2c3e,#1f1f2c); padding:6px 10px; border-radius:20px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; border:1px solid #ffffff14; box-shadow:inset 0 1px 0 #ffffff0d;}
  main{flex:1; min-height:0; padding:12px; padding-bottom:80px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
  /* (v187) 문서 전체가 아니라 헤더 아래 화면 영역만 스크롤 — 헤더는 항상 고정, 화면마다 위쪽(← 홈·제목·탭)은 고정하고 아래만 스크롤 */
  html.lock-scroll #app{height:100%; min-height:0;}
  .scr-top{position:sticky; top:-12px; z-index:8; margin:-12px -12px 8px; padding:12px 12px 8px; background:linear-gradient(180deg, var(--bg) 88%, #14141c00);}
  .scr-top .home-back{margin-bottom:8px;}
  .scr-top > :last-child{margin-bottom:0;}
  main.is-home{padding:0; padding-bottom:0; overflow:hidden;}
  .home{position:relative; height:480px; overflow:hidden; display:flex; flex-direction:column;}
  .home.compact .home-emo{font-size:64px;} .home.compact .home-name{margin-top:6px; font-size:15px;} .home.compact .home-side{top:62px; gap:6px;} .home.compact .home-ic{height:46px;}
  .home-bg{position:absolute; inset:0; width:100%; height:100%; z-index:0; opacity:0; transition:opacity .55s ease;}
  .home-bg.on{opacity:1;}
  .home-car{position:relative; height:var(--car-h, 96px);} /* (v198) 모드 버튼 줄 높이는 fitHome()이 화면 높이에 맞춰 64~96px로 정함 */
  .home-mbtn{position:absolute; top:50%; border-radius:18px; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text);
    transition:left .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1), transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s, background .38s, box-shadow .38s;}
  .home-mbtn.pos-center{left:50%; width:58%; height:calc(var(--car-h, 96px) - 8px); transform:translate(-50%,-50%); background:linear-gradient(180deg,#48f0c8,#1cc49a); color:#0d2a24; box-shadow:0 6px 0 #0e8a6c, 0 10px 20px #0008; z-index:2;}
  .home-mbtn.pos-left{left:1%; width:19%; height:max(46px, calc(var(--car-h, 96px) * .667)); transform:translate(0,-50%); background:#1a1540ee; border:1px solid #8a74e066; opacity:.92; z-index:1;}
  .home-mbtn.pos-right{left:99%; width:19%; height:max(46px, calc(var(--car-h, 96px) * .667)); transform:translate(-100%,-50%); background:#1a1540ee; border:1px solid #8a74e066; opacity:.92; z-index:1;}
  .home-mbtn.jump{transition:none; opacity:0;}
  .home-mbtn .hm-ico{font-size:20px; line-height:1;} .home-mbtn.pos-center .hm-ico{font-size:24px;}
  .home-mbtn .hm-ico .uic{margin:0 0 1px;} .home-mbtn.pos-center .hm-ico .uic{filter:drop-shadow(0 1px 1px #0006);}
  .home-mbtn .hm-name{font-weight:900; font-size:12px;} .home-mbtn.pos-center .hm-name{font-size:max(17px, calc(var(--car-h, 96px) * .23));}
  .home.car-s .home-mbtn.pos-center .hm-ico{font-size:18px;} .home.car-s .home-mbtn.pos-center .hm-sub{font-size:10px;} .home.car-xs .home-mbtn.pos-center .hm-sub{display:none;}
  .home-mbtn .hm-sub{display:none;} .home-mbtn.pos-center .hm-sub{display:block; font-size:11px; font-weight:800; opacity:.8; max-width:94%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .home-mbtn.pos-center[data-hmode="raid"]{background:linear-gradient(180deg,#ff8a7a,#d8404a); color:#2a0508; box-shadow:0 6px 0 #8a1f2a, 0 10px 20px #0008;}
  .home-mbtn.pos-center[data-hmode="expedition"]{background:linear-gradient(180deg,#ffd27a,#e89a3a); color:#2a1805; box-shadow:0 6px 0 #9a5a1a, 0 10px 20px #0008;}
  .home-mbtn.locked.pos-center{filter:saturate(.4) brightness(.85);}
  .home-mbtn.pos-center:active{transform:translate(-50%,-46%);}
  nav button.nav-home .ico{font-size:22px;}
  .home-top{position:relative; z-index:2; padding:12px 12px 0;}
  .home-prof{display:inline-flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; border-radius:14px; background:#0e0b22cc; border:1px solid #8a74e055;}
  .home-ava{width:34px; height:34px; border-radius:10px; background:#2b2360; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .home-side{position:absolute; z-index:3; top:70px; display:flex; flex-direction:column; gap:10px;}
  .home-side.left{left:10px;} .home-side.right{right:10px;}
  .home-ic{position:relative; width:52px; height:56px; border-radius:14px; background:#1a1540dd; border:1px solid #8a74e066; color:var(--text); font-size:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; box-shadow:0 4px 10px #0006;}
  .home-ic small{font-size:10px; font-weight:800; color:#d8ccff;}
  .home-dot{position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:#ff4a4a; box-shadow:0 0 6px #ff4a4a;}
  /* (v196) 대표 정령은 홈 배경의 '받침(소환진)' 위에 섬 — 발끝 높이는 fitHome()이 배경 그림(1024×1536, 받침 중심 세로 74.9%) 기준으로 계산해 --hero-foot에 넣음 */
  .home-hero{position:absolute; z-index:2; left:50%; top:var(--hero-foot, 72%); transform:translateX(-50%); width:72%; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer;}
  .home-hero .home-emo{margin-top:-1em;}
  .home-bottom{margin-top:auto;}
  .home-bg[data-img]{background-color:#6a6a9a; background-size:cover; background-repeat:no-repeat; background-position:50% 50%;}
  .home-hero{transition:top .45s ease;} @media (prefers-reduced-motion: reduce){ .home-hero{transition:none;} }
  .home-emo{font-size:clamp(72px, 26vw, 120px); line-height:1; filter:drop-shadow(0 0 22px #b79cffaa); animation:homeFloat 3.2s ease-in-out infinite;}
  @keyframes homeFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
  .home-name{margin-top:14px; font-size:18px; font-weight:900; text-shadow:0 2px 6px #000a;}
  .home-rar{font-size:12px; font-weight:800; margin-top:2px;}
  .home-name, .home-rar{text-shadow:0 0 3px #000, 0 0 3px #000, 0 1px 2px #000, 0 2px 8px #000c;} /* (v199) 밝은 돌 받침 위에서도 읽히게 */
  .home-bottom{position:relative; z-index:3; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px;}
  .home-modes{display:flex; gap:8px;}
  .home-mode{position:relative; flex:1; padding:9px 4px 8px; border-radius:14px; background:#1a1540ee; border:1px solid #8a74e066; color:var(--text); font-size:22px; display:flex; flex-direction:column; align-items:center; gap:1px;}
  .home-mode b{font-size:13px;} .home-mode small{font-size:10px; color:var(--sub); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .home-mode.locked{opacity:.55;}
  .home-play{position:relative; width:100%; padding:14px 8px; border-radius:18px; border:none; color:#0d2a24; background:linear-gradient(180deg,#48f0c8,#1cc49a); box-shadow:0 6px 0 #0e8a6c, 0 10px 20px #0008; display:flex; flex-direction:column; align-items:center;}
  .home-play span{font-size:22px; font-weight:900;} .home-play small{font-size:12px; font-weight:800; opacity:.8;}
  .home-play:active{transform:translateY(3px); box-shadow:0 3px 0 #0e8a6c, 0 6px 12px #0008;}
  /* ===== (v186) 탐험 지도 ===== */
  .ex-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; padding:10px 8px; border-radius:16px; background:linear-gradient(135deg,#221d38,#15131f); border:1px solid #ffffff22; box-shadow:0 6px 18px #0006;}
  .ex-arrow{position:relative; flex-shrink:0; width:40px; height:40px; border-radius:12px; border:1px solid #ffffff22; background:#ffffff0d; color:var(--text); font-size:15px;}
  .ex-arrow:disabled{opacity:.3;}
  .ex-adot, .ex-rdot{position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:#ff4a4a; border:1.5px solid var(--panel);}
  .ex-title{flex:1; min-width:0; text-align:center;}
  .ex-ch{font-size:10px; font-weight:900; letter-spacing:2px; color:var(--tc);}
  .ex-name{font-size:19px; font-weight:900; margin-top:1px;}
  .ex-bar{height:6px; border-radius:4px; background:#ffffff14; overflow:hidden; margin:6px 12px 3px;}
  .ex-bar i{display:block; height:100%; background:linear-gradient(90deg,#ffffff66,transparent), var(--tc); box-shadow:0 0 8px var(--tc);}
  .ex-sub{font-size:11px; color:var(--sub); font-weight:700;}
  .ex-map{position:relative; width:100%; height:min(64vh, 560px); min-height:380px; border-radius:22px; overflow:hidden; border:1px solid #ffffff1c; box-shadow:0 10px 26px #0008; animation:exIn .35s ease-out;}
  @keyframes exIn{from{opacity:0; transform:scale(.98)} to{opacity:1; transform:none}}
  .ex-shade{position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse 80% 70% at 50% 55%, transparent 55%, #0006 100%);}
  .ex-map .bs-parts{z-index:1;}
  .ex-reward{position:relative; margin-left:6px; padding:3px 9px; border-radius:10px; border:1px solid #ffd24a88; background:#ffd24a1f; color:#ffe7a0; font-size:11px; font-weight:800; vertical-align:middle;}
  .ex-paths{position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none;}
  .ex-road{stroke:#0b0f18; stroke-opacity:.32; stroke-width:11; stroke-linecap:round;}
  .ex-path{stroke:#ffffff; stroke-opacity:.75; stroke-width:4; stroke-dasharray:2 9; stroke-linecap:round;}
  .ex-path.open{stroke-opacity:.95; stroke-dasharray:6 7;}
  .ex-path.done{stroke:var(--tc); stroke-opacity:.95; stroke-width:7; stroke-dasharray:none; filter:drop-shadow(0 0 4px var(--tc));}
  .ex-node{position:absolute; z-index:3; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;}
  .ex-node[data-stage]{cursor:pointer;}
  .ex-disc{position:relative; width:clamp(46px, 14vw, 60px); height:clamp(46px, 14vw, 60px); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;
    background:radial-gradient(circle at 35% 30%, #3a3a52, #1a1a26); border:3px solid #5a5a72; color:#cfd2e0; box-shadow:0 6px 12px #0009, inset 0 -4px 8px #0006;}
  .ex-node.clear .ex-disc{background:radial-gradient(circle at 35% 30%, #ffffffaa, transparent 60%), var(--tc); border-color:#fff; color:#14141c; box-shadow:0 0 14px var(--tc), 0 6px 12px #0008, inset 0 -4px 8px #0003;}
  .ex-node.open .ex-disc{background:radial-gradient(circle at 35% 30%, #34304e, #16142a); border-color:var(--tc); color:#fff; box-shadow:0 0 0 4px #ffffff22, 0 0 18px var(--tc);}
  .ex-node.next .ex-disc{animation:nodepulse 1.4s ease-in-out infinite;}
  .ex-node.lock .ex-disc{filter:grayscale(.6) brightness(.75);}
  .ex-lock{position:absolute; bottom:-4px; right:-4px; font-size:13px;}
  .ex-node.boss .ex-disc{width:clamp(66px, 20vw, 86px); height:clamp(66px, 20vw, 86px); border-color:var(--legendary); border-width:4px; background:radial-gradient(circle at 35% 30%, #5a3a10, #1e1408);}
  .ex-node.boss.clear .ex-disc{background:radial-gradient(circle at 35% 30%, #ffe08a, #e0a020); box-shadow:0 0 20px var(--legendary);}
  .ex-node.boss.open .ex-disc{box-shadow:0 0 0 5px #ffb92a44, 0 0 26px var(--legendary);}
  .ex-bicon{font-size:clamp(32px, 10vw, 44px); line-height:1; filter:drop-shadow(0 2px 3px #0008);}
  .ex-lbl{margin-top:4px; padding:2px 8px; border-radius:9px; background:#0b0f18c8; color:#ffd98a; font-size:10px; font-weight:900; white-space:nowrap;}
  .ex-grade{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); min-width:22px; padding:0 5px; border-radius:9px; font-size:11px; font-weight:900; text-align:center; line-height:17px; background:#b8bcc4; color:#1a1a26; border:1.5px solid #fff; box-shadow:0 2px 4px #0008;}
  .ex-node.boss .ex-grade{bottom:18px;}
  .ex-grade.gS{background:linear-gradient(135deg,#ffe066,#ffb92a);} .ex-grade.gA{background:linear-gradient(135deg,#d6a8ff,#b04aff); color:#fff;} .ex-grade.gB{background:linear-gradient(135deg,#8ec5ff,#4a90ff); color:#fff;}
  .ex-sp{position:absolute; top:-8px; right:-8px; font-size:15px; filter:drop-shadow(0 0 4px #c98aff);}
  .ex-dot{position:absolute; top:-3px; left:-3px; width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 6px #ff4a4a;}
  .ex-hero{position:absolute; bottom:calc(100% + 2px); left:50%; transform:translateX(-50%); font-size:26px; filter:drop-shadow(0 3px 3px #0009); animation:exHop 1.1s ease-in-out infinite; pointer-events:none;}
  @keyframes exHop{0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-7px)}}
  .ex-veil{position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:#0b0f18a8; color:#fff; font-weight:800; font-size:14px; backdrop-filter:blur(1.5px);}
  @media (max-height:640px){ .ex-legend{display:none !important;} .ex-head{padding:6px 8px;} .ex-name{font-size:16px;} }
  .ex-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:8px; font-size:11px; font-weight:700; color:var(--sub);}
  .ex-legend span{display:flex; align-items:center; gap:4px;} .ex-legend .lg{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .ex-legend .lg.clear{background:var(--tc);} .ex-legend .lg.open{border:2px solid var(--tc);}
  /* ===== (v181) 친구 · 결투 화면 ===== */
  .fr{display:flex; flex-direction:column; gap:10px;}
  .fr-title{font-size:18px; font-weight:900; margin:2px 0 0;}
  .fr-me{display:flex; align-items:center; gap:10px; padding:12px; border-radius:16px; background:linear-gradient(135deg,#2a2356,#1b1830); border:1px solid #8a74e055; box-shadow:0 6px 18px #0006;}
  .fr-av{flex-shrink:0; width:34px; height:34px; border-radius:11px; background:#2b2360; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .fr-av.big{width:44px; height:44px; font-size:24px; border-radius:14px;}
  .fr-nm{flex:1; min-width:0; display:flex; flex-direction:column;}
  .fr-nm b{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fr-nm small{font-size:11px; color:var(--sub); margin-top:1px;}
  .fr-code{color:var(--text); letter-spacing:1.5px;}
  .fr-copy{flex-shrink:0; padding:7px 11px; border-radius:10px; border:1px solid #ffffff26; background:#ffffff10; color:var(--text); font-size:12px; font-weight:800;}
  .seg{display:flex; padding:4px; gap:4px; border-radius:14px; background:#15131f; border:1px solid #ffffff12;}
  .seg button{flex:1; padding:9px 0; border:none; border-radius:10px; background:none; color:var(--sub); font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:5px;}
  .seg button.on{background:linear-gradient(135deg,#6a7bff,#9a6bff); color:#fff; box-shadow:0 3px 10px #7a5bff55;}
  .seg i{font-style:normal; font-size:10px; min-width:18px; padding:1px 5px; border-radius:9px; background:#ffffff1a;}
  .seg i.hot{background:#ff4a4a; color:#fff;}
  .fr-cap{font-size:11px; font-weight:800; color:var(--sub); margin:2px 2px -4px;}
  .fr-list{display:flex; flex-direction:column; border-radius:14px; background:#1c1a28; border:1px solid #ffffff10; overflow:hidden;}
  .fr-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid #ffffff0c;}
  .fr-row:first-child{border-top:none;}
  .fr-row.hot{background:#5b6bff1c;}
  .fr-row.dim .fr-nm b{opacity:.7;}
  .fr-row .btn.small{width:auto; padding:7px 12px; flex-shrink:0;}
  .fr-dot{flex-shrink:0; width:10px; height:10px; border-radius:50%; background:#4a4a58; margin:0 4px;}
  .fr-dot.on{background:#5cd65c; box-shadow:0 0 8px #5cd65c;}
  .fr-x{flex-shrink:0; padding:6px 9px; border-radius:9px; border:1px solid #ffffff1a; background:none; color:var(--sub); font-size:11px; font-weight:700;}
  .fr-x.warn{border-color:#ff6a6a; color:#ff8a8a;}
  .fr-empty{padding:28px 12px; text-align:center; color:var(--sub); font-size:13px; line-height:1.6; border-radius:14px; background:#1c1a28; border:1px dashed #ffffff1a;}
  .fr-empty .btn{width:auto; padding:8px 16px;}
  .fr-card{padding:12px; border-radius:14px; background:#1c1a28; border:1px solid #ffffff10; display:flex; flex-direction:column; gap:4px;}
  .fr-card > b{font-size:14px;} .fr-card > .sub{font-size:11px;}
  .fr-inrow{display:flex; gap:6px; margin-top:6px;}
  .fr-inrow .btn{width:auto; padding:0 16px; flex-shrink:0;}
  .fr-in{flex:1; min-width:0; background:#12111a; color:var(--text); border:1px solid #ffffff26; border-radius:10px; padding:10px; font-size:15px;}
  .fr-in.code{letter-spacing:2px; text-transform:uppercase;}
  .fr-in:focus{outline:none; border-color:#9a6bff;}
  .du-hero{display:flex; align-items:center; gap:12px; padding:14px; border-radius:16px; background:linear-gradient(135deg,#3a2350,#1b1830); border:1px solid #c98aff44; box-shadow:0 6px 18px #0006;}
  .du-hero-ic{font-size:34px; filter:drop-shadow(0 0 10px #c98aff88);}
  .du-head{display:flex; justify-content:space-between; align-items:center;}
  .du-cp{font-size:12px; font-weight:900; color:#ffd24a;}
  .du-row{display:flex; align-items:center; gap:6px; margin-top:6px;}
  .du-lbl{flex:0 0 28px; font-size:10px; font-weight:800; color:var(--sub); text-align:center;}
  .du-slot{flex:1; min-width:0; height:64px; border-radius:12px; border:2px solid #ffffff1a; background:#12111a; color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;}

<script>
// ===================== 데이터 =====================
const ELEMENTS = ['fire','water','wood','light','dark'];
const ELEMENT_INFO = {
  fire:{name:'화염', icon:'🔥', color:'var(--fire)'},
  water:{name:'물결', icon:'💧', color:'var(--water)'},
  wood:{name:'숲결', icon:'🌿', color:'var(--wood)'},
  light:{name:'빛', icon:'🌟', color:'var(--light)'},
  dark:{name:'그림자', icon:'🌑', color:'var(--dark)'}
};
const RARITY_ORDER = ['common','rare','epic','legendary','mythic'];
// (v101) 속성 표기는 항상 '아이콘 + 공식 이름'(화염·물결·숲결·빛·그림자)으로 통일 — 문구에서 직접 '불/물/나무' 등을 쓰지 않고 이 함수를 사용
function elLabel(el){ return ELEMENT_INFO[el].icon+' '+ELEMENT_INFO[el].name; }
const RARITY_INFO = {
  common:{name:'일반', mult:1, color:'var(--common)'},
  rare:{name:'레어', mult:2.5, color:'var(--rare)'},
  epic:{name:'에픽', mult:6, color:'var(--epic)'},
  legendary:{name:'레전더리', mult:15, color:'var(--legendary)'},
  mythic:{name:'신화', mult:35, color:'#ff2f57'}
};
const NAMES = {
  // (v157) 짜치는 "속성+등급형용사+종" 반복 조합을 버리고 고유명사·신화 모티프 위주로 재작성
  fire:{common:['잉걸','불티'], rare:['하랑','적작'], epic:['볼칸','주작'], legendary:['펜리르','불사조'], mythic:['스콜','금오']},
  water:{common:['이슬','물뱀'], rare:['나이아','백사'], epic:['로렐라이','이무기'], legendary:['세이렌','청룡'], mythic:['테티스','요르문간드']},
  wood:{common:['이끼','실이'], rare:['등돌','독줄'], epic:['반석','아라크네'], legendary:['지신','그림자여왕'], mythic:['현무','아난시']},
  light:{common:['빛씨','별가루'], rare:['지천사','은사슴'], epic:['대천사','유니콘'], legendary:['치천사','키린'], mythic:['광명','백록']},
  dark:{common:['박쥐','까마귀'], rare:['야행자','흉조'], epic:['흡혈귀','후긴'], legendary:['흡혈백작','무닌'], mythic:['불사귀','칠흑조']}
};
const VARIANTS = ['a','b'];
const SPIRITS = {};
ELEMENTS.forEach(el=>{
  RARITY_ORDER.forEach(r=>{
    VARIANTS.forEach((v, vi)=>{
      const key = el+'_'+r+'_'+v;
      SPIRITS[key] = {key, element:el, rarity:r, variant:v, name:NAMES[el][r][vi]};
    });
  });
});
const BASE_ATK = 12;
const SUMMON_COST = 100;
const CHAPTER_LENGTH = 10;
function seededRand(seed){ const x = Math.sin(seed)*10000; return x - Math.floor(x); }
// 적한테도 정령과 똑같이 등급(일반~신화)·variant를 부여해서 특성(패시브)을 갖게 함.
// 진행도(progress, 0~1)가 높을수록 높은 등급이 더 잘 나오도록 가중치를 선형 보간.
// 신화는 최후반부에도 1%로 아주 희박하게만 등장(대신 걸리면 팀 전체 공격력 +10% 통솔까지 붙는 강적).
// 다만 이 등급은 "패시브가 있는지"를 정하는 역할이지, 정령처럼 등급별 배수(x1~x35)를 곱하진 않음 —
// 그렇게 하면 스테이지 난이도 곡선과 별개로 적 전투력이 등급 뽑기 운에 따라 최대 35배까지 요동쳐서
// 기존에 맞춰둔 난이도 곡선이 무의미해짐. 그래서 적의 전투력은 지금처럼 스테이지/층 진행도로만 스케일하고,
// 등급은 패시브 발동 여부(공격력 +8~35%, 크리티컬 확률 등)만 결정함.
function enemyRarityWeights(progress){
  const p = Math.max(0, Math.min(1, progress));
  return [
    {r:'common', w: Math.max(1, 90-55*p)},
    {r:'rare', w: 9+30*p},
    {r:'epic', w: 1+18*p},
    {r:'legendary', w: 6*p},
    {r:'mythic', w: 1*p}
  ];
}
function weightedPickSeeded(list, r){
  const total = list.reduce((s,x)=>s+x.w,0);
  let x = r*total;
  for(const item of list){ if(x<item.w) return item.r; x -= item.w; }
  return list[list.length-1].r;
}
function enemyRarityComp(seedBase, progress){
  const weights = enemyRarityWeights(progress);
  const arr = [];
  for(let j=0;j<5;j++){
    const rarityRoll = seededRand(seedBase*173.31 + j*29.7 + 3);
    const variantRoll = seededRand(seedBase*211.7 + j*17.9 + 5);
    arr.push({ rarity: weightedPickSeeded(weights, rarityRoll), variant: variantRoll<0.5?'a':'b' });
  }
  return arr;
}
function enemyRarityCompForStage(i){ return enemyRarityComp(i, i/99); }
function enemyRarityCompForTower(floor){ return enemyRarityComp(floor+5000, Math.min(1, floor/50)); }
function baseEnemyComposition(i){
  const arr = [];
  for(let j=0;j<5;j++){
    const r = seededRand(i*97.13 + j*13.37 + 1);
    arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]);
  }
  return arr;
}
// (v115) 특수 스테이지의 적은 규칙 조건을 항상 충족하는 구성으로 나옴 — 슬롯이 3~5개 어느 쪽이든 앞쪽 슬롯부터 충족되게 배치
// (v116) 규칙이 둘인 스테이지도 둘 다 충족하는 구성. 속성 필드가 있으면 적은 유리한 속성 3칸에 불리한 속성은 없음(커버리지와 같이 나오면 필수 속성 때문에 예외)
function stageEnemyComposition(i){
  const arr = baseEnemyComposition(i);
  if(!isSpecialStage(i)) return arr;
  const rules = specialRules(specialStageSpec(i));
  const has = (t)=> rules.find(x=>x.type===t);
  const r = (k)=> seededRand(i*61.7 + k*7.9 + 11);
  const locked = new Set();
  if(has('chain') && has('coverage')){
    const cov = has('coverage');
    for(let k=0; k<4; k++) arr[k] = cov.required[0];
    arr[4] = cov.required[1];
    for(let k=0; k<5; k++) locked.add(k);
  }else{
    rules.forEach(rule=>{
      if(rule.type==='sequence'){
        rule.pattern.forEach((el,k)=>{ arr[k] = el; });
      }else if(rule.type==='coverage'){
        const pos = [0,1,2];
        for(let k=2; k>0; k--){ const j = Math.floor(r(k)*(k+1)); const t = pos[k]; pos[k] = pos[j]; pos[j] = t; }
        arr[pos[0]] = rule.required[0]; arr[pos[1]] = rule.required[1];
        locked.add(pos[0]); locked.add(pos[1]);
      }else if(rule.type==='chain'){
        const el = ELEMENTS[Math.floor(r(1)*ELEMENTS.length)];
        for(let k=0; k<4; k++) arr[k] = el;

function enemyGridForStage(i){

function atkBonus(sf, a, d){

function dmgReduction(sf, d){

function killUnit(sf, u){

  if(poisoned && poisoned.srcG>=1 && Math.random() < [0,.5,.65,.8,1][poisoned.srcG]){
    const nb = gridNeighbors(u.idx, 'row').map(i=>unitAt(sf, u.side, i)).filter(x=>x && x.alive);
    if(nb.length){ const t = nb[Math.floor(Math.random()*nb.length)]; if(!t.st.ward) t.st.poison = {r:3, pct:poisoned.pct, srcG:poisoned.srcG}; else t.st.ward--; }

function dealDamage(sf, a, d, mult, opts){
  opts = opts || {};
  if(!d.alive) return null;
  let v = a.atk * mult * (a.specialMult||1) * typeMult(a.element, d.element) * (1 + atkBonus(sf, a, d)) * runeDmgMult(a, d);
  if(sf.mode==='boss'){
    const adj = bossDefenseAdjust(sf, a, d, v);
    if(adj.blocked) return { total:0, crit:false, blocked:true };
    if(adj.healBoss>0){ d.hp = Math.min(d.maxHp, d.hp + adj.healBoss); groggyHit(sf, a, d, mult, false, 0); return { total:0, crit:false, healed:adj.healBoss }; }
    v = adj.v;

  const s = d.st;
  v *= 1 + (s.curse ? s.curse.v : 0) + (s.web ? s.web.v : 0);
  v *= Math.max(0.1, 1 - dmgReduction(sf, d));
  if(d.groggy) v *= GROGGY_DMG_MULT; // (v179) 그로기: 받는 피해 2배

function makeActCtx(sf, a, tSide, tIdx){
  const C = { sf, a, g:a.g, tSide, t: unitAt(sf, tSide, tIdx), hits: [] };
  C.P = arr=>arr[a.g];
  C.side = s=>aliveUnits(sideUnits(sf, s));
  C.around = shape=>gridNeighbors(C.t.idx, shape, sideWidth(sf, tSide)).map(i=>unitAt(sf, tSide, i)).filter(u=>u && u.alive);
  C.hit = (u, mult)=>{
    if(!u || !u.alive) return null;
    const r = dealDamage(sf, a, u, mult);
    if(!r) return null;
    C.hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:r.total, crit:r.crit, eff:typeMult(a.element, u.element) });
    if(r.groggy) C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:'💫그로기!' });
    if(a.line==='water_b' && a.g>=1 && u.alive){ const v = [0,5,6,8,10][a.g]; u.st.chill = Math.min(v*3, (u.st.chill||0) + v); }
    return r;

  C.neg = (u, fn, label)=>{ if(!u || !u.alive) return false; if(u.st.ward>0){ u.st.ward--; if(!u.st.ward) delete u.st.ward; C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:'🔰막음' }); return false; } fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); return true; };
  C.pos = (u, fn, label)=>{ if(!u || !u.alive) return; fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); };
  C.burn = (u, n)=>{ const cap = (a.line==='fire_b' && a.g>=4) ? 8 : 5; C.neg(u, st=>{ st.burnCap = Math.max(cap, st.burnCap||5); st.burn = Math.min(st.burnCap, (st.burn||0)+n); st.burnDmg = Math.max(st.burnDmg||0, Math.round(a.atk*0.15)); }, '🔥화상'); };
  C.poison = (u, pct)=>{ C.neg(u, st=>{ st.poison = { r:3, pct, srcG:a.g }; }, '☠독'); };
  C.cleanse = (u, n)=>{ let k = 0; ['freeze','bind','poison','burn','curse','web','slow','chill'].forEach(key=>{ if(k<n && u.st[key]){ delete u.st[key]; if(key==='burn'){ delete u.st.burnDmg; delete u.st.burnCap; } k++; } }); };
  C.strip = u=>{ let n = 0; ['shield','haste','buff','regen','reflect','ward','taunt','empower','guard'].forEach(key=>{ if(u.st[key]){ delete u.st[key]; n++; } }); return n; };
  C.actNext = u=>{
    if(!u.alive) return;
    const q = sf.queue;
    for(let p=q.length-1; p>sf.queuePos; p--) if(q[p].side===u.side && q[p].idx===u.idx) q.splice(p, 1);
    q.splice(sf.queuePos+1, 0, { side:u.side, idx:u.idx, speed:effSpeed(u) });
  };
  return C;
}

    out.push(p && typeof p==='object' && typeof p.key==='string' && SPIRITS[p.key] && Number.isFinite(p.atk) ? { key:p.key, atk: Math.max(1, Math.min(1e7, p.atk)), arm: Number.isFinite(p.arm) ? Math.max(1, Math.min(10, p.arm)) : 1, rune: runeValid(p.rune) ? { id:p.rune.id, tier:p.rune.tier } : null } : null);

}
function raidCleanDoc(d){

function raidParseBattle(json){

    if(!sf || (sf.mode!=='raid' && sf.mode!=='duel') || !Array.isArray(sf.myUnits) || !Array.isArray(sf.enemyUnits) || !sf.myUnits.every(uOk) || !sf.enemyUnits.every(uOk) || !Array.isArray(sf.queue) || !Number.isFinite(sf.queuePos)) return null;

// ---------- 전투 구성 ----------
function buildRaidFight(hostPicks, guestPicks, bossId, diffId){
  const myUnits = [];
  const add = (arr, slots, owner)=> raidCleanPicks(arr).forEach((p,i)=>{ if(p){ const u = makeBattleUnit('me', slots[i], p.key, p.atk, ALLY_HP_MULT, 1, p.arm, p.rune||null); u.owner = owner; myUnits.push(u); } });
  add(hostPicks, P1_SLOTS, 'host'); add(guestPicks, P2_SLOTS, 'guest');
  const info = raidBossById(bossId) || raidWeekBoss();
  const diff = raidDiffById(diffId);
  const per = bossWaveNormalPower(RAID_BOSS_STAGE) * BOSS_POWER_MULT * diff.atk;
  const boss = makeBattleUnit('enemy', 1, info.element+'_legendary_a', per*ELEMENT_ATK_MULT[info.element], raidBossHpMult()*diff.hp/diff.atk);
  boss.isBoss = true; boss.dispName = info.name; boss.bossIcon = info.icon; ensureGroggy(boss);
  const sf = { v:168, mode:'raid', stageIdx: RAID_BOSS_STAGE, raidBossId: info.id, raidDiff: diff.id, round:1, phase:'acting', queue:[], queuePos:0, myUnits, enemyUnits:[boss],
    log:['레이드 시작!'], result:null, fxSeq:0, lastFx:null, actSeq:0 };
  startRoundQueue(sf);
  return sf;
}
function applyRaidGimmicks(sf){
  const boss = sf.enemyUnits.find(u=>u.isBoss && u.alive); if(!boss) return;
  const info = raidBossById(sf.raidBossId); if(!info) return;
  const r = sf.round;
  info.gimmicks.forEach(g=>{
    const allies = aliveUnits(sf.myUnits); if(!allies.length) return;
    if(g.id==='blizzard' && r%3===0){ allies.forEach(u=>{ dealDamage(sf, boss, u, 0.5, {noCrit:true}); if(u.alive) u.st.slow = {v:15, r:2}; }); pushLog(sf, info.icon+' 눈보라!'); }
    else if((g.id==='iceShell' || g.id==='bark') && !sf.raidShellUsed && boss.hp/boss.maxHp < 0.5){ sf.raidShellUsed = true; boss.st.shield = (boss.st.shield||0) + Math.round(boss.maxHp*0.2); pushLog(sf, info.icon+' '+g.name+'!'); }
    else if(g.id==='brand'){ const t = allies.reduce((x,y)=> y.hp>x.hp ? y : x); t.st.burnCap = Math.max(t.st.burnCap||5, 5); t.st.burn = Math.min(t.st.burnCap, (t.st.burn||0)+3); t.st.burnDmg = Math.max(t.st.burnDmg||0, Math.round(boss.atk*0.15)); pushLog(sf, info.icon+' 낙인 → '+skillUnitName('me', t)); }
    else if(g.id==='rage' && r%4===0){ boss.atk = Math.round(boss.atk*1.25); pushLog(sf, info.icon+' 격노! 공격력 상승'); }
    else if(g.id==='gaze'){ const t = allies.reduce((x,y)=> y.atk>x.atk ? y : x); t.st.curse = {v:0.25, r:2}; pushLog(sf, info.icon+' 응시 → '+skillUnitName('me', t)); }
    else if(g.id==='pulse' && r%3===0){ allies.forEach(u=>dealDamage(sf, boss, u, 0.6, {noCrit:true})); pushLog(sf, info.icon+' 파동!'); }
    else if(g.id==='regrowth'){ boss.hp = Math.min(boss.maxHp, boss.hp + Math.round(boss.maxHp*0.025)); }
    else if(g.id==='verdict' && r%3===0){ const t = allies.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x); dealDamage(sf, boss, t, 2, {noCrit:true}); pushLog(sf, info.icon+' 판결 → '+skillUnitName('me', t)); }
    else if(g.id==='halo'){ ['burn','burnDmg','burnCap','poison','curse','slow','chill','web','bind','freeze'].forEach(k=>{ delete boss.st[k]; }); }
  });
}
function checkRaidOutcome(sf){
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){ sf.result = { win:true, rounds:sf.round }; raidMarkClear(sf); raidGrantReward(sf); return true; }
  if(!aliveUnits(sf.myUnits).length){ sf.result = { win:false, rounds:sf.round }; raidGrantReward(sf); return true; }
  return false;
}
function raidGrantReward(sf){

  if(!raidUseTicket(raidNet.code)){ raidNet.rewardText = '🎫 입장권이 없어서 이번 판은 보상이 없어요'; save(); return; }

    const dd = raidDiffById(sf.raidDiff), wk = raidWeekKey();

    const gems = RAID_GEMS[dd.id] || 0; state.raidGems = (state.raidGems||0) + gems; // (v172) 룬석 = 레이드 상점 재화

    const itemTxt = it=> Object.keys(it).map(k=>({summon:'🔮 소환권',rare:'🎟️ 레어 확정권',epic:'💜 에픽 확정권',equip:'🛡️ 장비 소환권'}[k]||k)+' +'+it[k]).join(' · ');
    raidNet.rewardText = '<b style="font-size:15px; color:#ff9ab0;">💎 고대 룬석 +'+gems+'</b><br>['+dd.name+'] 🔩 강화석 +'+dd.stone+(first ? '<br>'+itemTxt(dd.weekly)+' (이번 주 '+dd.name+' 첫 승리)' : '');
    raidNet.gotStones = true;
    // (v171) 하드부터 보스 속성 장비 드롭(레전더리 먼저 굴리고, 안 나오면 에픽) — 보스가 두른 속성의 무기·방어구가 떨어진다는 설정
    if(dd.gear){

      }
    }
  }else{
    state.enhanceStone = (state.enhanceStone||0) + 30;
    raidNet.rewardText = '🔩 강화석 +30 (참가 보상)';
  }

}
function raidResultOverlayHtml(sf){

function afterFightMutation(){

function raidHostSync(){

function raidHostApplyRemote(a){

  if(!['me','enemy'].includes(tSide) || !Number.isInteger(tIdx) || !skillTargetable(sf, tSide, tIdx)){ const c = aiChooseAction(sf, u); if(!c) return; tSide = c.side; tIdx = c.idx; }

}
function raidGuestSubmit(act, tSide, tIdx){

    .then(()=>raidNudge())

function raidGuestPump(sf){
  if(sf.result || raidNet.pendingSeq > (sf.actSeq||0)) return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos];
  if(!raidMine(cur.idx) || !state.skillAuto) return;
  const key = (sf.actSeq||0)+1;
  skillPumpTimer = setTimeout(()=>{
    skillPumpTimer = null;
    const s = state.skillFight; if(!s || s.mode!=='raid' || (s.actSeq||0)+1!==key || settleQueue(s)!=='me') return;
    const u = unitAt(s, 'me', s.queue[s.queuePos].idx); if(!u || !raidMine(u.idx)) return;
    const c = aiChooseAction(s, u); if(c) raidGuestSubmit(c.act, c.side, c.idx);

}

function raidOnDoc(snap){
  if(!raidNet.code) return;
  if(!snap || !snap.exists){
    const sf = state.skillFight;
    if(sf && sf.mode==='raid' && sf.result) return; // 결과 화면 보는 중엔 방이 지워져도 그대로 둠
    raidLocalCleanup(); toast('방이 닫혔어요'); render(); return;
  }
  const d = raidCleanDoc(snap.data()); if(!d) return;
  raidNet.doc = d;
  if(raidNet.role==='guest' && d.guest!==raidNet.uid){ raidLocalCleanup(); toast('방에서 나가졌어요'); render(); return; }
  if(d.status==='closed'){ const sf = state.skillFight; if(sf && sf.mode==='raid' && sf.result) return; raidLocalCleanup(); state.skillFight = null; unmountBattleScreen(); save(); toast('레이드가 해산됐어요'); render(); return; }
  raidNameOf(raidPartnerUid());
  if(raidNet.role==='host' && raidNet.lastGuest && !d.guest && (d.status==='lobby')) toast('팀원이 나갔어요');
  raidNet.lastGuest = d.guest;
  if(d.status==='lobby'){ raidNet.picksInit = false; showRaidLobbyModal(); return; }
  if(d.status==='pick'){
    if(raidNet.role==='host' && d.guest && d.ready[d.host] && d.ready[d.guest] && !raidNet.starting) raidHostStartBattle(d);
    else if(!raidNet.starting) showRaidPickModal();
    return;
  }
  if(!d.battleJson) return;
  { // (v169) 포기 투표: 둘 다 동의하면 방장이 패배 처리
    const sig = JSON.stringify(d.surrender||{});
    const both = d.guest && d.surrender[d.host]===true && d.surrender[d.guest]===true;
    if(raidNet.role==='host' && d.kind==='duel' && (d.surrender[d.host]===true || (d.guest && d.surrender[d.guest]===true)) && state.skillFight && state.skillFight.mode==='duel' && !state.skillFight.result){
      const sf = state.skillFight; clearTimeout(skillPumpTimer); skillPumpTimer = null;
      sf.result = { win: d.surrender[d.host]!==true, rounds: sf.round, forfeit:true }; save(); showSkillStageScreen(); afterFightMutation();
    }
    if(raidNet.role==='host' && both && state.skillFight && state.skillFight.mode==='raid' && !state.skillFight.result){
      const sf = state.skillFight; clearTimeout(skillPumpTimer); skillPumpTimer = null;
      sf.result = { win:false, rounds: sf.round, surrender:true }; pushLog(sf, '🏳️ 레이드를 포기했다');
      raidNet.rewardText = '🏳️ 포기 — 보상 없음';
      save(); showSkillStageScreen(); afterFightMutation();
    }
    if(sig!==raidNet.surSig){ raidNet.surSig = sig; if(document.getElementById('battleScreen') && state.skillFight && state.skillFight.mode==='raid') showSkillStageScreen(); }
  }
  if(raidNet.role==='guest'){
    if(d.battleSeq===raidNet.lastBattleSeq) return;
    const sf0 = raidParseBattle(d.battleJson); if(!sf0) return;
    const sf = sf0.mode==='duel' ? duelMirror(sf0, raidNameOf(d.host)) : sf0;
    const first = !state.skillFight || state.skillFight.mode!==sf.mode;
    raidNet.lastBattleSeq = d.battleSeq;
    clearTimeout(skillPumpTimer); skillPumpTimer = null;
    state.skillFight = sf;
    if(raidNet.pendingSeq && (sf.actSeq||0) >= raidNet.pendingSeq) raidNet.pendingSeq = 0;
    if(sf.mode==='duel'){ if(first){ skillSel.key = null; skillIntroPending = true; activeTab = 'home'; closeModal(); render(); } }
    else{
      if(sf.result && sf.result.surrender){ raidNet.rewardText = '🏳️ 포기 — 보상 없음'; state.raidRewarded = (state.raidRewarded||[]).concat(raidNet.code).slice(-30); }
      else if(sf.result){ raidMarkClear(sf); raidGrantReward(sf); }
      if(first){ raidUseTicket(raidNet.code); skillSel.key = null; skillIntroPending = true; activeTab = 'raid'; render(); }
    }
    showSkillStageScreen();
  }else if(!state.skillFight || (state.skillFight.mode!=='raid' && state.skillFight.mode!=='duel')){ // 방장이 새로고침한 뒤 이어하기
    const sf = raidParseBattle(d.battleJson); if(!sf) return;
    raidNet.battleSeq = d.battleSeq;
    state.skillFight = sf; skillSel.key = null; activeTab = 'raid'; render();
    showSkillStageScreen();
  }
}
function raidOnActDoc(snap){ if(raidNet.role==='host' && snap && snap.exists) raidHostApplyRemote(snap.data()); }
async function raidAttach(code, role){
  raidNet.code = code; raidNet.role = role; raidNet.doc = null; raidNet.battleSeq = 0; raidNet.lastBattleSeq = -1;

      const h = await raidNet.room.join('raid-'+code.toLowerCase());

      h.presence({ uid: raidNet.uid, role }).catch(()=>{});
      raidNet.unsubs.push(h.onPeers(ch=>{
        const pid = raidPartnerUid();

        if(m.sameTab) return;
        if(raidNet.role==='host') raidActRef().get().then(raidOnActDoc).catch(()=>{});
        else raidRef().get().then(raidOnDoc).catch(()=>{});
      }, ()=>{}));
    }catch(e){ raidNet.roomH = null; }
  }
  clearInterval(raidNet.tick);
  raidNet.tick = setInterval(()=>{ // 끊김 판정 시간이 지나면 해산 버튼·AI 대행이 켜지도록 화면만 다시 그림(쓰기 없음)
    if(!raidNet.code || raidNet.partnerOnline!==false) return;
    if(Date.now()-raidNet.partnerOffSince >= RAID_OFFLINE_GRACE_MS && !raidNet.graceShown){ raidNet.graceShown = true; raidRefreshScreen(); }
  }, 3000);
}

function raidNewCode(){ let c = ''; for(let i=0;i<6;i++) c += RAID_CODE_CHARS[Math.floor(Math.random()*RAID_CODE_CHARS.length)]; return c; }

    let code = null;
    for(let t=0; t<5 && !code; t++){
      const c = raidNewCode(), ref = raidNet.db.doc('raids/'+c);
      const lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1000 }); // 짧게 — 만들자마자 들어오는 친구를 막지 않도록
      if(!lease.acquired) continue;
      const snap = await ref.get();
      const old = snap.exists ? raidCleanDoc(snap.data()) : null;
      if(old && old.status!=='closed' && Date.now()-old.createdAt < 24*3600000) continue; // 아직 쓰이는 코드
      await ref.set({ code:c, kind, host: raidNet.uid, guest: null, status:'lobby', bossId: raidWeekBoss().id, diff: raidDiffById(state.raidDiff).id, weekKey: raidWeekKey(), duelPicks: kind==='duel' ? { [raidNet.uid]: duelPayload(myDuelDeck()) } : {},
        picks:{}, ready:{}, battleJson:null, battleSeq:0, createdAt: Date.now() });
      code = c;
    }
    if(!code){ toast('방을 만들지 못했어요. 다시 시도해주세요'); return; }
    await raidAttach(code, 'host');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}
async function raidJoinRoom(input){
  if(!raidNet.ready || raidNet.busy) return;
  const code = String(input||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ toast('방 코드는 6자리예요'); return; }
  raidNet.busy = true; render();
  try{
    const ref = raidNet.db.doc('raids/'+code);
    let lease = null;
    for(let t=0; t<6; t++){ // 방장이 방을 막 만든 직후거나 다른 사람이 입장 처리 중이면 잠깐 기다렸다 재시도
      lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1500 });
      if(lease.acquired) break;
      await new Promise(r=>setTimeout(r, 400));
    }
    if(!lease || !lease.acquired){ toast('다른 사람이 입장 중이에요. 잠시 후 다시 시도해주세요'); return; }
    const snap = await ref.get();
    const d = snap.exists ? raidCleanDoc(snap.data()) : null;
    if(!d || d.status==='closed' || d.status==='done'){ toast('존재하지 않는 방이에요'); return; }
    if(d.host===raidNet.uid){ await raidAttach(code, 'host'); return; }
    if(d.guest && d.guest!==raidNet.uid){ toast('방이 꽉 찼어요 (2/2)'); return; }
    if(d.status!=='lobby' && d.guest!==raidNet.uid){ toast('이미 시작된 방이에요'); return; }
    if(d.kind==='duel' && !duelPayload(myDuelDeck()).some(Boolean)){ toast('먼저 내 결투 덱을 정해주세요 (친구 창)'); return; }
    if(d.guest!==raidNet.uid) await ref.update(Object.assign({ guest: raidNet.uid, ready: { [raidNet.uid]: false } }, d.kind==='duel' ? { duelPicks: { [raidNet.uid]: duelPayload(myDuelDeck()) } } : {}));
    await raidAttach(code, 'guest');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}

// ===================== (v168) 친구 — Firebase(깃헙 버전)에서만 동작 =====================
// players/<uid> = {name, code} · friendCodes/<8자리> = uid · friends/<나>/<친구> = true(내 목록은 나만 수정)
// friendReqs/<받는사람>/<보낸사람> = 친구 요청 · invites/<받는사람>/<보낸사람> = 레이드 초대 · 접속 표시는 'online' 방 presence
let friendNet = { on:false, code:null, name:'', friends:{}, reqs:{}, invites:{}, online:new Set(), unsubs:[], roomH:null, busy:false };
function friendsAvailable(){ return raidNet.ready && raidNet.backend==='firebase'; }
function friendCleanCode(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); }
async function friendInit(){
  if(!friendsAvailable() || friendNet.on) return;
  const db = raidNet.db, uid = raidNet.uid;
  const me = await db.doc('players/'+uid).get();
  const d = (me.exists && me.data() && typeof me.data()==='object') ? me.data() : {};
  const name = (typeof d.name==='string' && d.name.trim()) ? d.name.slice(0,12) : '소환사-'+uid.slice(0,4);
  let code = (typeof d.code==='string' && /^[A-Z0-9]{8}$/.test(d.code)) ? d.code : null;
  if(!code){
    for(let t=0; t<6 && !code; t++){
      const c = (raidNewCode()+raidNewCode()).slice(0,8), r = db.doc('friendCodes/'+c);
      const s = await r.get(); if(s.exists) continue;
      try{ await r.set(uid); code = c; }catch(e){}
    }
  }
  await db.doc('players/'+uid).set({ name, code: code||'' });
  friendNet.code = code; friendNet.on = true; friendSetName(name);
  const obj = s=> (s && s.exists && s.data() && typeof s.data()==='object') ? s.data() : {};
  friendNet.unsubs.push(db.doc('friends/'+uid).onSnapshot(s=>{ friendNet.friends = obj(s); friendRefresh(); }, ()=>{}));
  friendNet.unsubs.push(db.doc('friendReqs/'+uid).onSnapshot(s=>{ friendNet.reqs = obj(s); friendRefresh(); }, ()=>{}));
  friendNet.unsubs.push(db.doc('invites/'+uid).onSnapshot(s=>{
    const v = obj(s), prev = friendNet.invites; friendNet.invites = v;
    Object.keys(v).forEach(k=>{ const iv = v[k]; if(iv && (!prev[k] || prev[k].code!==iv.code) && Date.now()-(iv.t||0) < 10*60000) toast((iv.kind==='duel'?'⚔️ ':'📨 ')+String(iv.name||'친구').slice(0,12)+(iv.kind==='duel'?'님이 결투를 신청했어요 · 👥 친구 창':'님이 레이드에 초대했어요 · 👥 친구 창')); });
    friendRefresh();
  }, ()=>{}));
  if(raidNet.room){
    try{
      const h = await raidNet.room.join('online'); friendNet.roomH = h;
      h.presence({ uid }).catch(()=>{});
      friendNet.unsubs.push(h.onPeers(ch=>{ friendNet.online = new Set(ch.peers.map(p=>p.by)); friendRefresh(); }, ()=>{}));
    }catch(e){}
  }
  friendRefresh();
}

function fitHome(){ // 헤더와 하단 탭 사이 남는 높이에 홈을 딱 맞춤(스크롤 없음)
  const el = document.querySelector('.home'); if(!el) return;
  // (v181) 하단 탭의 실제 윗선까지를 기준으로 계산 — 예전엔 window.innerHeight로 계산해서, 앱을 처음 켤 때
  // (iOS 홈 화면 앱은 안전 영역·화면 높이가 켜진 직후에 한 번 더 바뀜) 높이가 어긋나 탐험 버튼이 하단 탭에 가려졌음
  const nav = document.querySelector('nav'), top = el.getBoundingClientRect().top;
  const bottom = (nav && nav.offsetHeight) ? nav.getBoundingClientRect().top : document.body.getBoundingClientRect().bottom;
  const hgt = Math.max(300, Math.floor(bottom - top));
  if(el.style.height !== hgt+'px') el.style.height = hgt+'px';
  el.classList.toggle('compact', hgt < 470);
  // (v198) 아래 모드 버튼 줄은 화면 높이의 14%(64~96px) — 작은 폰에서 버튼이 받침(소환진)을 가리지 않게
  const carH = Math.max(64, Math.min(96, Math.round(hgt*0.14)));
  el.style.setProperty('--car-h', carH+'px');
  el.classList.toggle('car-s', carH < 84); el.classList.toggle('car-xs', carH < 72);
  // (v196) 배경 그림(1024×1536, cover) 속 받침 중심이 이 상자에서 몇 px인지 계산해 정령 발끝을 맞춤.
  // (v198) 받침이 버튼 줄에 가려질 만큼 낮으면, 그림이 위아래로 남는 범위 안에서 배경을 위로 올려 받침이 보이게 함
  // (v199) 모드마다 그림 속 받침 높이가 달라서 배경마다 따로 계산하고, 정령은 지금 모드의 받침에 세움
  const W = el.clientWidth, sc = Math.max(W/1024, hgt/1536), dispH = 1536*sc;
  const barTop = hgt - ((el.querySelector('.home-bottom')||{}).offsetHeight || (carH+12));
  const nameH = hgt < 470 ? 46 : 60, emoH = hgt < 470 ? 64 : Math.min(120, Math.max(72, W*0.26));
  const want = barTop - nameH - 4;
  const place = ratio=>{ let offY = (hgt - dispH)/2, ped = offY + ratio*dispH;
    if(ped > want){ const up = Math.min(ped - want, offY - (hgt - dispH)); offY -= up; ped -= up; }
    return { offY, ped }; };
  el.querySelectorAll('.home-bg[data-img]').forEach(b=>{ const im = HOME_BG_IMAGES[b.dataset.bg]; if(im) b.style.backgroundPosition = '50% '+Math.round(place(im.ped).offY)+'px'; });
  const cur = place((HOME_BG_IMAGES[homeMode]||{}).ped || HOME_BG_PED_DEFAULT);
  const foot = Math.max(70 + emoH, Math.min(want, cur.ped));
  el.style.setProperty('--hero-foot', Math.round(foot)+'px');
}
// (v181) 화면 크기가 바뀌는 모든 경우에 홈·전장 크기를 다시 맞춤: 창 크기, 주소창/안전 영역 변화, 헤더 높이 변화(재화 숫자·이름),
// 앱으로 돌아옴, 글꼴 로딩. 처음 켤 때 잘리던 문제의 근본 대책
let relayoutRaf = 0;
function relayoutScreens(){ cancelAnimationFrame(relayoutRaf); relayoutRaf = requestAnimationFrame(()=>{ if(activeTab==='home') fitHome(); else fitRest(); if(document.getElementById('battleScreen')) fitBattleScreen(); }); }
// (v187) .fit-rest 요소(탐험 지도·탑 층 목록)는 화면 영역에서 남은 높이에 딱 맞춤 — 폰 크기가 달라도 스크롤 없이 한 화면
// data-below: 아래에 남겨 둘 높이(px) · data-min / data-max: 최소·최대 높이
function fitRest(){
  const main = document.getElementById('main'); if(!main) return;
  const els = main.querySelectorAll('.fit-rest'); if(!els.length) return;
  const mr = main.getBoundingClientRect(), padB = parseFloat(getComputedStyle(main).paddingBottom)||0;
  els.forEach(el=>{
    const top = el.getBoundingClientRect().top - mr.top + main.scrollTop;
    let below = parseFloat(el.dataset.below)||0; // 'next' = 뒤따르는 요소들 실제 높이만큼 남김
    if(el.dataset.below==='next'){ below = 0; for(let n = el.nextElementSibling; n; n = n.nextElementSibling){ if(n.offsetParent!==null) below += n.offsetHeight + (parseFloat(getComputedStyle(n).marginTop)||0); } }
    let h = main.clientHeight - top - padB - below;
    h = Math.max(parseFloat(el.dataset.min)||200, Math.min(parseFloat(el.dataset.max)||99999, Math.floor(h)));
    if(el.style.height !== h+'px'){ el.style.height = h+'px'; el.style.maxHeight = 'none'; el.style.minHeight = '0'; }
  });
}

// 레이드 코드는 doc(path).get/set/update/delete/onSnapshot/acquire + room.join(presence/onPeers)만 쓰므로 같은 모양으로 감싸서 넘김
const FIREBASE_CONFIG = { // (v167) 공개돼도 되는 값 — 실제 보호는 Realtime Database 보안 규칙이 담당
  apiKey: "AIzaSyDbsIwsIEsi-hmoT9zWUdOtaXrvhKRiTtk",

const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
async function loadFirebaseKit(cfg){
  const [appM, authM, dbM] = await Promise.all([import(FIREBASE_SDK+'firebase-app.js'), import(FIREBASE_SDK+'firebase-auth.js'), import(FIREBASE_SDK+'firebase-database.js')]);
  const app = appM.initializeApp(cfg);
  const auth = authM.getAuth(app);
  const cred = await authM.signInAnonymously(auth);
  const rtdb = dbM.getDatabase(app);
  return { uid: cred.user.uid, rtdb, ref: dbM.ref, get: dbM.get, set: dbM.set, update: dbM.update, remove: dbM.remove, onValue: dbM.onValue,
    runTransaction: dbM.runTransaction, onDisconnect: dbM.onDisconnect };

function fbFromArrays(v){ // RTDB는 배열의 빈칸(null)을 지우고 숫자 키 객체로 돌려주기도 함 → 숫자 키만 있는 객체는 배열로 되돌림
  if(Array.isArray(v)) return v.map(fbFromArrays);
  if(v && typeof v==='object'){
    const ks = Object.keys(v);
    if(ks.length && ks.every(k=>/^\d+$/.test(k))){ const arr = []; ks.forEach(k=>{ arr[+k] = fbFromArrays(v[k]); }); for(let i=0;i<arr.length;i++) if(arr[i]===undefined) arr[i] = null; return arr; }
    const o = {}; ks.forEach(k=>{ o[k] = fbFromArrays(v[k]); }); return o;
  }
  return v;
}
function fbFlatten(obj, prefix, out){ // 중첩 객체는 경로별로 풀어서 병합(배열·값은 통째로 교체) — 기존 db.update의 병합 방식과 같게
  Object.keys(obj).forEach(k=>{
    const v = obj[k], p = prefix ? prefix+'/'+k : k;
    if(v && typeof v==='object' && !Array.isArray(v) && Object.keys(v).length) fbFlatten(v, p, out);
    else out[p] = (v===undefined) ? null : v;
  });
  return out;
}
function makeFirebaseNet(fb){
  const lockKey = path=> path.replace(/\//g,'__');
  const mkSnap = s=>({ exists: s.exists(), data: ()=> fbFromArrays(s.val()), metadata:{} });
  const doc = path=>{
    const r = fb.ref(fb.rtdb, path);
    return { id: path.split('/').pop(), path,
      get: ()=> fb.get(r).then(mkSnap),
      set: data=> fb.set(r, JSON.parse(JSON.stringify(data))),
      update: async patch=>{
        const s = await fb.get(r);
        if(!s.exists()){ const e = new Error('missing'); e.code = 'invalid_argument'; throw e; }
        return fb.update(r, fbFlatten(JSON.parse(JSON.stringify(patch)), '', {}));
      },
      delete: ()=> fb.remove(r),
      onSnapshot: (next, onErr)=> fb.onValue(r, s=>next(mkSnap(s)), e=>{ if(onErr) onErr(e); }),
      acquire: async ({holder, ttlMs})=>{
        const lr = fb.ref(fb.rtdb, 'locks/'+lockKey(path));
        const res = await fb.runTransaction(lr, cur=>{
          const now = Date.now();
          if(cur && cur.exp > now && cur.holder !== holder) return; // 다른 사람이 잡고 있음 → 중단
          return { holder, exp: now + (ttlMs||30000) };
        });
        return { acquired: !!res.committed, holder };
      } };
  };
  const db = { doc, collection: p=>({ doc: id=>doc(p+'/'+id) }) };
  const user = { id: async()=> fb.uid, can: async()=> true, isOwner: async()=> false,
    profiles: async ids=>{ const o = {}; await Promise.all([].concat(ids).map(async id=>{ try{ const s = await fb.get(fb.ref(fb.rtdb, 'players/'+id+'/name')); o[id] = { name: s.exists() ? String(s.val()).slice(0,20) : '소환사-'+id.slice(0,4) }; }catch(e){ o[id] = { name:'소환사-'+id.slice(0,4) }; } })); return o; } };
  const room = { join: async name=>{
    const base = 'presence/'+name.replace(/[^a-z0-9_-]/gi,'_'), me = fb.ref(fb.rtdb, base+'/'+fb.uid);
    await fb.onDisconnect(me).remove(); // 앱을 닫거나 연결이 끊기면 서버가 알아서 접속 표시를 지움
    let pres = { uid: fb.uid };
    await fb.set(me, pres);
    const unsubs = [];
    // (v173 버그수정) 앱을 잠깐 나갔다 오면 연결이 끊기며 접속 표시가 지워지는데 다시 켜지 않던 문제 — 연결될 때마다 다시 등록
    unsubs.push(fb.onValue(fb.ref(fb.rtdb, '.info/connected'), snap=>{ if(snap.val()===true){ fb.onDisconnect(me).remove().catch(()=>{}); fb.set(me, pres).catch(()=>{}); } }));
    const onVis = ()=>{ if(document.visibilityState==='visible') fb.set(me, pres).catch(()=>{}); };
    document.addEventListener('visibilitychange', onVis); unsubs.push(()=>document.removeEventListener('visibilitychange', onVis));
    return { name,
      presence: async patch=>{ pres = Object.assign({}, pres, patch); await fb.set(me, pres); },
      onPeers: fn=>{ const u = fb.onValue(fb.ref(fb.rtdb, base), s=>{ const v = s.val()||{}; fn({ peers: Object.keys(v).map(id=>({ by:id, peer:id, isMe: id===fb.uid, sameTab: id===fb.uid, presence: v[id]||{}, kind:'viewer', guest:false, updatedAt:0 })), joined:[], left:[], updated:[] }); }); unsubs.push(u); return u; },
      peers: ()=>[], emit: async()=>{}, on: ()=>()=>{}, connected: ()=>true,
      leave: async()=>{ unsubs.forEach(u=>{ try{ u(); }catch(e){} }); try{ await fb.remove(me); await fb.onDisconnect(me).cancel(); }catch(e){} } };
  } };
  return { db, user, room };
}

function checkSkillStageOutcome(sf){
  if(sf.mode==='boss') return checkBossWaveOutcome(sf);
  if(sf.mode==='expedition') return checkExpeditionOutcome(sf);
  if(sf.mode==='raid') return checkRaidOutcome(sf);
  if(sf.mode==='duel'){ if(sf.result) return true; if(!aliveUnits(sf.enemyUnits).length){ sf.result = {win:true, rounds:sf.round}; return true; } if(!aliveUnits(sf.myUnits).length){ sf.result = {win:false, rounds:sf.round}; return true; } return false; }
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){
    const prevBest = state.stageBest[sf.stageIdx] || null;
    sf.result = { win:true, rounds: sf.round, prevBest };
    sf.result.info = resolveSkillStageBattle(sf.stageIdx, sf.round);
    return true;
  }
  if(!aliveUnits(sf.myUnits).length){ sf.result = { win:false, rounds: sf.round }; return true; }
  return false;
}

function buildQueue(sf){
  const e = [];
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.alive) e.push({ side:u.side, idx:u.idx, speed:effSpeed(u), bound:!!u.st.bind }); });
  e.sort((x,y)=>{ if(x.bound!==y.bound) return x.bound?1:-1; if(y.speed!==x.speed) return y.speed-x.speed; if(x.side!==y.side) return x.side==='me'?-1:1; return x.idx-y.idx; });
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.st.bind) delete u.st.bind; });
  return e.map(x=>({ side:x.side, idx:x.idx, speed:x.speed }));
}
function startRoundQueue(sf){ sf.queue = buildQueue(sf); sf.queuePos = 0; sf.phase = 'acting'; }
// 지금 차례: 'me' | 'enemy' | 'end'. 쓰러진 유닛은 건너뛰고, 빙결이면 한 번 쉬게 함
function settleQueue(sf){
  while(sf.queuePos < sf.queue.length){
    const e = sf.queue[sf.queuePos], u = unitAt(sf, e.side, e.idx);
    if(u && u.alive){
      if(u.st.freeze){ delete u.st.freeze; pushLog(sf, skillUnitName(u.side, u)+' 빙결로 쉼'); sf.queuePos++; continue; }
      if(u.groggy){ pushLog(sf, '💫 '+skillUnitName(u.side, u)+' 그로기로 행동 불가'); sf.queuePos++; continue; } // (v179)
      return e.side;
    }
    sf.queuePos++;
  }
  return 'end';
}
// 라운드 시작: 쿨다운 감소 · 지속 효과(화상·독·재생) · 지속 시간 감소 · 패시브(맑은 물·서약)
function roundStartEffects(sf){
  sf.myUnits.concat(sf.enemyUnits).forEach(u=>{ if(u.alive && u.st.shield>0){ u.st.shieldR = (u.st.shieldR||2) - 1; if(u.st.shieldR<=0){ u.st.shield = 0; delete u.st.shieldR; } } }); // (v173) 보호막 지속시간
  groggyRoundStart(sf); // (v179) 그로기 해제·게이지 회복(기믹보다 먼저)
  if(sf.mode==='boss') applyBossGimmick(sf);
  if(sf.mode==='raid') applyRaidGimmicks(sf);
  runeRoundStart(sf);
  const hits = [];
  const all = [...sf.myUnits, ...sf.enemyUnits];
  all.forEach(u=>{
    if(!u.alive) return;
    u.cd1 = Math.max(0, u.cd1-1); u.cd2 = Math.max(0, u.cd2-1);
    const s = u.st;
    let loss = 0;
    if(s.burn){ loss += s.burn * (s.burnDmg||0); }
    if(s.poison){ loss += Math.round(u.maxHp * s.poison.pct); }
    if(loss>0){ u.hp = Math.max(0, u.hp - loss); hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:loss, dot:true }); if(u.hp<=0){ killUnit(sf, u); return; } }
    if(s.regen){ const b = u.hp; u.hp = Math.min(u.maxHp, u.hp + healAmount(u, u.maxHp*s.regen.v)); if(u.hp>b) hits.push({ side:u.side, idx:u.idx, kind:'heal', amount:u.hp-b }); }
    ['slow','haste','curse','web','buff','regen','reflect','guard'].forEach(k=>{ if(s[k]){ s[k].r--; if(s[k].r<=0) delete s[k]; } });
    if(s.poison){ s.poison.r--; if(s.poison.r<=0) delete s.poison; }
    if(s.taunt){ s.taunt--; if(s.taunt<=0) delete s.taunt; }
  });
  ['me','enemy'].forEach(side=>{
    const list = aliveUnits(sideUnits(sf, side));
    list.forEach(p=>{
      if(p.line==='water_a' && p.g>=1 && list.length){
        const low = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
        const b = low.hp; low.hp = Math.min(low.maxHp, low.hp + healAmount(low, low.maxHp*[0,.03,.04,.05,.06][p.g]));
        if(low.hp>b) hits.push({ side, idx:low.idx, kind:'heal', amount:low.hp-b });
      }
      if(p.line==='light_b' && p.g>=1){
        const slow = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> effSpeed(y) < effSpeed(x) ? y : x);
        slow.st.haste = { v: Math.max(slow.st.haste ? slow.st.haste.v : 0, [0,5,6,8,10][p.g]), r: 1 };
      }
    });
  });
  return hits;
}

// ---------- 적 AI ----------
function aiPickFoeTarget(sf, a){
  const foe = foeOf(a.side);
  const pool = frontFirst(sideUnits(sf, foe), sideWidth(sf, foe));
  const taunt = aliveUnits(sideUnits(sf, foe)).filter(u=>u.st.taunt);
  const list = taunt.length ? taunt : pool;
  if(!list.length) return null;
  return list.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
}
function aiChooseAction(sf, a){
  const kit = kitOf(a), own = aliveUnits(sideUnits(sf, a.side));
  for(const act of ['s2','s1','basic']){
    if(!skillAvailable(a, act)) continue;
    const sk = act==='basic' ? null : kit[act];
    const kind = sk ? sk.kind : 'harm';
    if(sk && sk.self){ if(a.st.taunt) continue; return { act, side:a.side, idx:a.idx }; } // (v192) 이미 도발 중이면 아껴 둠
    if(kind==='harm'){
      const t = aiPickFoeTarget(sf, a); if(!t) return null;
      if(a.line==='dark_a' && act==='s2' && t.hp/t.maxHp>0.3) continue; // 처형은 막타용
      if(a.line==='fire_b' && act==='s2' && !(t.st.burn>0)) continue;   // 발화는 화상이 있을 때만
      if(a.line==='dark_b' && act==='s2' && !['shield','haste','buff','regen','reflect','ward','taunt'].some(k=>t.st[k])) continue;
      return { act, side:t.side, idx:t.idx };
    }
    if(kind==='heal'){
      const low = own.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
      if(low.hp/low.maxHp < 0.7) return { act, side:a.side, idx:low.idx };
      continue;
    }
    // 보호막·강화: 전열 우선, 체력 낮은 아군 / 강화는 공격력 높은 아군
    const front = own.filter(u=>isFrontRow(u.idx, sideWidth(sf, a.side)));
    const pool = front.length ? front : own;
    const t = kind==='buff' ? own.reduce((x,y)=> y.atk>x.atk ? y : x) : pool.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
    return { act, side:a.side, idx:t.idx };
  }
  return null;
}

// ---------- 진행 ----------
function recommendEnemyTarget(sf, a){
  let best = null, bestScore = -Infinity;
  validEnemyTargets(sf).forEach(idx=>{
    const d = unitAt(sf, 'enemy', idx), tm = typeMult(a.element, d.element);
    const est = a.atk * tm;
    const score = (est >= d.hp + (d.st.shield||0) ? 1000 : 0) + tm*100 - d.hp/d.maxHp*10;
    if(score > bestScore){ bestScore = score; best = idx; }
  });
  return best;
}
let skillLastAct = {}; // (v175) 붕스타 방식: 정령마다 지난 차례에 쓴 행동을 기억해 다음 차례 기본 선택으로
function lastActKey(sf, a){ return (sf.mode||'')+':'+a.idx+':'+a.key; }
function defaultActFor(sf, a){
  const r = skillLastAct[lastActKey(sf, a)];
  if(r && skillAvailable(a, r)) return r;
  return (isSupportUnit(a) && skillAvailable(a, 's1')) ? 's1' : 'basic';
}
function retargetForAct(sf, a, act){ // 고른 행동의 종류에 맞게 대상 편을 바꿈(지원기 → 아군, 공격기 → 적)
  const sk = unitSkill(a, act), harm = !sk || sk.kind==='harm';
  if(sk && sk.self){ skillSel.side = a.side; skillSel.idx = a.idx; return; } // (v192) 자기 몸에만 거는 스킬
  if(harm && skillSel.side!=='enemy'){ const st = skillSel.sticky; skillSel.side = 'enemy'; skillSel.idx = (st!==undefined && st!==null && skillTargetable(sf,'enemy',st)) ? st : recommendEnemyTarget(sf, a); }
  else if(!harm && skillSel.side!==a.side){ skillSel.side = a.side; skillSel.idx = autoAllyTarget(sf, a); }
}
function isSupportUnit(a){ const k = kitOf(a); return k.s1.kind!=='harm' && k.s2.kind!=='harm'; }
function autoAllyTarget(sf, a){ // 회복·보호는 체력 비율이 가장 낮은 아군(뿌리내리기는 전열 우선), 강화는 공격력이 가장 높은 아군
  const own = aliveUnits(sideUnits(sf, a.side)); if(!own.length) return a.idx;
  const kind = kitOf(a).s1.kind;
  if(kind==='buff') return own.reduce((x,y)=> y.atk>x.atk ? y : x).idx;
  let pool = own;
  if(a.line==='wood_a'){ const f = own.filter(u=>isFrontRow(u.idx, sideWidth(sf, a.side))); if(f.length) pool = f; }
  return pool.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x).idx;
}
function ensureSkillSelection(sf, a){
  const key = sf.stageIdx+':'+sf.round+':'+sf.queuePos;
  if(skillSel.key === key && skillTargetable(sf, skillSel.side, skillSel.idx)) return;
  const sticky = skillSel.sticky;
  const act0 = skillSel.key===key ? skillSel.act : defaultActFor(sf, a);
  const armed0 = skillSel.key===key ? !!skillSel.armed : true; // (v178) 미리 선택된 행동은 한 번 누르면 바로 시전
  const manual0 = skillSel.key===key ? !!skillSel.manual : false;
  if(isSupportUnit(a)) skillSel = { key, side: a.side, idx: autoAllyTarget(sf, a), sticky, act: act0, armed: armed0, manual: manual0 };
  else if(sticky!==undefined && sticky!==null && skillTargetable(sf, 'enemy', sticky)) skillSel = { key, side:'enemy', idx: sticky, sticky, act: act0, armed: armed0, manual: manual0 };
  else skillSel = { key, side:'enemy', idx: recommendEnemyTarget(sf, a), sticky: null, act: act0, armed: armed0, manual: manual0 };
  retargetForAct(sf, a, skillSel.act);
}
function myTurnAction(act){
  if(Date.now() < skillFxBusyUntil) return;
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx); if(!a || !a.alive) return;
  if(!skillAvailable(a, act)) return;
  ensureSkillSelection(sf, a);
  if(!skillTargetable(sf, skillSel.side, skillSel.idx)) return;
  if(sf.mode==='raid' || (sf.mode==='duel' && raidIsNet())){
    if(!raidMine(a.idx)) return; // 팀원 정령은 팀원만 조작
    if(raidNet.role==='guest'){ skillLastAct[lastActKey(sf, a)] = act; raidGuestSubmit(act, skillSel.side, skillSel.idx); return; }
  }
  skillLastAct[lastActKey(sf, a)] = act;
  performAction(sf, a, act, skillSel.side, skillSel.idx);
  skillSel.key = null;
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function stepEnemyTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='enemy'){ showSkillStageScreen(); return; }
  const a = unitAt(sf, 'enemy', sf.queue[sf.queuePos].idx);
  const c = aiChooseAction(sf, a);
  if(c) performAction(sf, a, c.act, c.side, c.idx);
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function nextSkillRound(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  sf.round += 1;
  pushLog(sf, '라운드 '+sf.round);
  const hits = roundStartEffects(sf);
  setFx(sf, { kind:'round', round: sf.round, hits });
  if(!checkSkillStageOutcome(sf)) startRoundQueue(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
// (v147) 자동전투: 내 턴도 AI가 대신 행동. 2배속: 대기 시간 절반
function skillSpeedMult(){ return state.skillSpeed2x ? 0.5 : 1; }
function stepMyAutoTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx);
  if(a && a.alive){ const c = aiChooseAction(sf, a); if(c) performAction(sf, a, c.act, c.side, c.idx); }
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function pumpSkillFight(){
  const sf = state.skillFight;
  if(!sf || sf.result || skillPumpTimer || !document.getElementById('battleScreen')) return;
  if((sf.mode==='raid' || (sf.mode==='duel' && raidIsNet())) && raidNet.role==='guest'){ raidGuestPump(sf); return; } // 팀원 화면은 판정하지 않고 방장 상태만 받아 그림
  const next = settleQueue(sf);
  const wait = Math.max(0, skillIntroUntil - Date.now(), skillFxBusyUntil - Date.now());
  if(next==='me'){
    if(sf.mode==='raid' && !raidMine(sf.queue[sf.queuePos].idx)){ // 팀원 차례: 입력 대기(끊겼으면 AI가 대신)
      if(raidPartnerGone()) skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
      return;
    }
    if(!state.skillAuto) return;
    skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
    return;
  }
  if(next==='enemy'){
    if(sf.mode==='duel' && raidIsNet() && !raidPartnerGone()) return; // 결투 상대 차례: 상대 입력 대기(끊기면 AI)
    skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepEnemyTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult()); return; }
  if(sf.round >= SKILL_ROUND_CAP){ sf.result = { win:false, rounds: sf.round, timeout:true }; if(sf.mode==='raid') raidGrantReward(sf); save(); showSkillStageScreen(); afterFightMutation(); return; }
  sf.phase = 'roundEnd';
  skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; nextSkillRound(); }, wait + SKILL_ROUND_GAP_MS*skillSpeedMult());
}
function endSkillStageFight(){
  clearTimeout(skillPumpTimer); skillPumpTimer = null;
  state.skillFight = null; skillSel.key = null; save();
  unmountBattleScreen();
}
function restartSkillStageFight(){ const sf = state.skillFight; if(!sf) return; const i = sf.stageIdx; endSkillStageFight(); startSkillStageFight(i); }

// (v174) 스킬 범위: 한 번 누르면 범위를 전장에 표시(공격 빨강·약화 보라·지원 초록), 한 번 더 누르면 사용
function skillAreaCells(sf, a, act, tSide, tIdx){
  { const sk = unitSkill(a, act); if(sk && sk.self) return new Set([a.side+':'+a.idx]); }
  const c = JSON.parse(JSON.stringify(sf)), rnd = Math.random; Math.random = ()=>0.999;
  let C; try{ C = performAction(c, unitAt(c, a.side, a.idx), act, tSide, tIdx); } catch(e){ C = {hits:[]}; } finally { Math.random = rnd; }
  const set = new Set();
  C.hits.forEach(h=>{ if(h.side===a.side && h.idx===a.idx && !(tSide===a.side && tIdx===a.idx)) return; set.add(h.side+':'+h.idx); });
  set.add(tSide+':'+tIdx);
  return set;
}
function skillPreview(sf, a, act, tSide, tIdx){
  const c = JSON.parse(JSON.stringify(sf)), rnd = Math.random;
  Math.random = ()=>0.999;
  let C;
  try{ C = performAction(c, unitAt(c, a.side, a.idx), act, tSide, tIdx); } finally { Math.random = rnd; }
  const t0 = unitAt(sf, tSide, tIdx), t1 = unitAt(c, tSide, tIdx);
  const dmg = C.hits.filter(h=>h.kind==='dmg' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const heal = C.hits.filter(h=>h.kind==='heal' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const shield = C.hits.filter(h=>h.kind==='shield' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const others = new Set(C.hits.filter(h=>!(h.side===tSide && h.idx===tIdx) && !(h.side===a.side && h.idx===a.idx)).map(h=>h.side+h.idx)).size;
  const parts = [];
  if(dmg) parts.push(dmg+' 피해');
  if(heal) parts.push('+'+heal+' 회복');
  if(shield) parts.push('🛡'+shield);
  if(!parts.length){ const st = C.hits.find(h=>h.kind==='status' && h.side===tSide && h.idx===tIdx); if(st) parts.push(st.text); }
  if(others) parts.push('+'+others+'명');
  const kill = !!(t0 && t0.alive && t1 && !t1.alive);
  return { text: parts.join(' · ') || '효과 없음', kill, dmg };
}

function kitOf(u){ return LINE_KITS[u.line]; }
function unitSkill(u, act){ return act==='basic' ? null : kitOf(u)[act]; }

// (v179) 스테이지 보상 구조 — 세 가지로 나눔
//  🔁 기본 클리어 보상: 클리어할 때마다 자동 지급(등급 무관, 반복)
//  🎉 첫 클리어 보상: 1번만, 눌러서 수령
//  🏅 등급 달성 보상(C/B/A/S): 등급마다 1번씩, 눌러서 수령. 처음 A로 깨면 C·B·A를 한꺼번에 받을 수 있고, 나중에 S를 따면 S만 추가
const STAGE_GRADE_SHARE = { C:0.10, B:0.12, A:0.15, S:0.23 }; // 첫 클리어 보상 대비 비율(합계 0.6배)
function stageClearReward(i){ return Math.round((5 + i*0.4) * 1.4); }
function stageFirstReward(i){ return Math.round((50 + i*15) * 1.6); }
function stageGradeReward(i, tier){ return Math.round(stageFirstReward(i) * STAGE_GRADE_SHARE[tier]); }
function bossFirstReward(i){ return Math.round(stageFirstReward(i) * 1.5); }
function bossClearReward(i){ return Math.round(20 + i*1.2); }
function addStageGradeRewards(i, fromRank, toRank){ // fromRank 초과 ~ toRank 이하 등급의 보상을 수령 대기로
  for(let r=fromRank+1; r<=toRank; r++){
    const tier = STAGE_GRADE_ORDER[r-1];
    if(isBossStage(i)){ const ch = bossChapter(i); addPendingReward('stage_'+i+'_bossclear_'+tier, '🛡️', '챕터 '+ch+' 보스 '+tier+'등급', 0, 0, 'stage', {equip: ch}); }
    else addPendingReward('stage_'+i+'_grade_'+tier, '🏅', '스테이지 '+(i+1)+' '+tier+'등급 달성', stageGradeReward(i, tier), 0, 'stage');
  }
}
function specialBonusReward(i){ return { essence: 30+i*3, stone: 8 }; }
function grantSpecialStageBonus(i){ // 특수 스테이지를 깼는데 보너스를 아직 안 받았으면 수령 대기로(한 번만)
  if(!isSpecialStage(i) || !state.stageBest[i] || state.specialStageBonusClaimed[i]) return;
  state.specialStageBonusClaimed[i] = true;
  const rw = specialBonusReward(i);
  addPendingReward('stage_'+i+'_special_bonus', '🌀', '스테이지 '+(i+1)+' 특수 규칙 보너스', rw.essence, rw.stone, 'stage');
}
function resolveSkillStageBattle(i, rounds){
  const grade = skillGradeForRounds(rounds);
  const already = state.stageBest[i];
  const gradeRank = {C:1,B:2,A:3,S:4};
  const baseReward = stageClearReward(i);
  state.essence += baseReward;
  let improved = false, reward = 0;
  if(!already){ reward = stageFirstReward(i); addPendingReward('stage_'+i+'_first', '🎉', '스테이지 '+(i+1)+' 첫 클리어', reward, 0, 'stage'); }
  grantSpecialStageBonus(i); // (v185) 첫 클리어 안에만 있어서, 이 보너스가 빠져 있던 버전에서 깬 특수 스테이지는 다시 깨도 영영 안 열렸음
  if(!already || gradeRank[grade] > gradeRank[already]){ improved = true; addStageGradeRewards(i, already ? gradeRank[already] : 0, gradeRank[grade]); state.stageBest[i] = grade; }
  state.dailyStats.stagesCleared += 1;
  checkChapterPctRewards(Math.floor(i/CHAPTER_LENGTH)+1);
  checkAchievements();
  save();
  return { grade, improved, reward, baseReward };
}

// 웨이브 사이 교체는 출정(여러 판 이어지는 모드) 전용으로 남기고, 보스전은 6마리를 한 번만 골라 3웨이브 내내 그대로 감.

function recommendFormation(enemyEls, poolKeys){
  const els = (enemyEls||[]).filter(Boolean);
  const pool = (poolKeys || Object.keys(SPIRITS).filter(k=>ownedCount(k)>0)).filter(k=>SPIRITS[k]);
  const score = k=>{ const el = SPIRITS[k].element; let adv = 0; els.forEach(e=>{ if(beats(el, e)) adv += 1; if(beats(e, el)) adv -= 0.7; }); return spiritCP(k) * (1 + 0.12*adv); };
  const pick = pool.sort((a,b)=>score(b)-score(a)).slice(0, GRID_SLOTS);
  const isFront = k=> ENEMY_FRONT_LINES.includes(SPIRITS[k].element+'_'+SPIRITS[k].variant);
  const hp = k=> spiritMaxHpGrid(k);
  const front = pick.filter(isFront).sort((a,b)=>hp(b)-hp(a)).slice(0,3);
  const rest = pick.filter(k=>!front.includes(k)).sort((a,b)=>hp(b)-hp(a));
  while(front.length<3 && rest.length) front.push(rest.shift());
  const out = [null,null,null,null,null,null];
  [1,0,2].forEach((pos,i)=>{ if(front[i]) out[pos] = front[i]; });
  rest.forEach((k,i)=>{ out[3+i] = k; });
  return out;
}

function startBossWaveRun(stageIdx, roster){
  const formationSnapshot = state.formation.slice();

  roster.forEach(k=>{ if(k) unitHp[k] = { hp: spiritMaxHpGrid(k), maxHp: spiritMaxHpGrid(k) }; });
  state.bossFight = { stageIdx, roster, unitHp, formationSnapshot, totalRounds:0 };
  state.skillFight = buildBossWaveFight(stageIdx, 1, roster, unitHp);
  skillSel.key = null; skillIntroPending = true;
  save();
  showSkillStageScreen();
}
function advanceBossWave(){
  const bf = state.bossFight; if(!bf) return;
  const nextWave = (state.skillFight.wave||1) + 1;
  unmountBattleScreen();
  state.skillFight = buildBossWaveFight(bf.stageIdx, nextWave, bf.roster, bf.unitHp); // (v152) 교체 화면 없이 같은 6마리로 바로 다음 웨이브
  skillSel.key = null; skillIntroPending = true;
  save();
  showSkillStageScreen();
}
function endBossWaveRun(win){
  const bf = state.bossFight; if(!bf) return;
  state.formation = bf.formationSnapshot;
  state.bossFight = null;
  state.skillFight = null;
  unmountBattleScreen();
  save();
}

function lineupThreat(key, lineup){
  const el = SPIRITS[key].element; let weak = 0, strong = 0;
  lineup.forEach(e=>{ if(!e) return; if(beats(e, el)) weak++; if(beats(el, e)) strong++; });
  return { weak, strong };
}

// ---------- 전장 화면 ----------
function updateScrollLock(){ document.documentElement.classList.add('lock-scroll'); } // (v187) 모든 화면에서 문서는 고정, 화면 영역(main)만 스크롤
function mountBattleScreen(){
  let el = document.getElementById('battleScreen');
  if(!el){ el = document.createElement('div'); el.id = 'battleScreen'; document.getElementById('app').appendChild(el); }
  document.body.classList.add('in-battle'); updateScrollLock();
  return el;
}
function fitBattleScreen(){ // 전장 칸 높이에 맞춰 유닛 크기 배율(--k) 계산
  const bs = document.getElementById('battleScreen'); if(!bs) return;
  const f = bs.querySelector('.bs-field'); if(!f) return;
  bs.style.setProperty('--k', '1');
  const ar = f.querySelector('.bs-arena2'); if(!ar) return;
  // (v179) 자유 배치: 한 줄 간격(세로)과 열 간격(가로)에 정령 한 칸(아이콘+이름표+체력바)이 들어가도록 배율 계산
  const W = ar.clientWidth, H = ar.clientHeight, rs = parseFloat(ar.dataset.rs)||0.27, sz = parseFloat(ar.dataset.sz)||44;
  if(!W || !H) return;
  const kw = W*0.21/72, kh = (H*rs - 44)/sz; // 후열~전열 간격(22%)에 한 칸이 들어가도록
  const k = Math.max(0.45, Math.min(1.5, kw, kh));
  bs.style.setProperty('--k', k.toFixed(3));
}
function unmountBattleScreen(){ const el = document.getElementById('battleScreen'); if(el) el.remove(); document.body.classList.remove('in-battle'); updateScrollLock(); }
function upcomingOrder(sf, n){
  const out = [];
  for(let p=sf.queuePos; p<sf.queue.length && out.length<n; p++){ const e = sf.queue[p], u = unitAt(sf, e.side, e.idx); if(u && u.alive) out.push({e, u, next:false}); }
  if(out.length < n) buildQueuePreview(sf).forEach(e=>{ if(out.length<n) out.push({e, u:unitAt(sf, e.side, e.idx), next:true}); });
  return out;
}
function buildQueuePreview(sf){ const c = JSON.parse(JSON.stringify(sf)); return buildQueue(c); }
function effLabel(tm){ return tm>1 ? '▲유리' : (tm<1 ? '▼불리' : ''); }
// (v173) 상태 효과: 이로운 효과는 초록, 해로운 효과는 빨강 배지 · 전투 화면에서 배지를 누르면 설명
function statusList(u){
  const s = u.st, o = [], r = x=> (x && x.r) ? ' · '+x.r+'R' : '';
  if(u.isBoss && u.groggy) o.push({i:'💫', t:'그로기', d:'행동 불가 · 받는 피해 2배 (다음 라운드 시작 때 풀림)', good:false});
  if(s.shield>0) o.push({i:'🛡️', t:'보호막', d:fmtHp(s.shield)+' 피해 흡수'+(s.shieldR?' · '+s.shieldR+'R':''), good:true});
  if(s.taunt) o.push({i:'🎯', t:'도발', d:'적이 이 정령만 공격', good:true});
  if(s.guard) o.push({i:'🌱', t:'굳건함', d:'받는 피해 −'+Math.round(s.guard.v*100)+'%'+r(s.guard), good:true});
  if(s.haste) o.push({i:'⏩', t:'가속', d:'속도 +'+s.haste.v+r(s.haste), good:true});
  if(s.buff || s.empower) o.push({i:'✨', t:'강화', d:'공격력 증가'+r(s.buff), good:true});
  if(s.regen) o.push({i:'💧', t:'재생', d:'라운드마다 체력 회복'+r(s.regen), good:true});
  if(s.reflect) o.push({i:'🌵', t:'반사', d:'받은 피해 일부 되돌림'+r(s.reflect), good:true});
  if(s.ward) o.push({i:'🔰', t:'보호', d:'해로운 효과 1회 막음', good:true});
  if(s.burn) o.push({i:'🔥', n:s.burn, t:'화상 '+s.burn+'중첩', d:'라운드마다 피해', good:false});
  if(s.poison) o.push({i:'☠️', t:'독', d:'라운드마다 최대체력 비례 피해 · 치유 감소'+r(s.poison), good:false});
  if(s.freeze) o.push({i:'❄️', t:'빙결', d:'다음 행동 1회 못 함', good:false});
  if(s.slow || s.chill) o.push({i:'⏬', t:'둔화', d:'속도 −'+((s.slow?s.slow.v:0)+(s.chill||0))+r(s.slow), good:false});
  if(s.bind || s.web) o.push({i:'🕸️', t:'속박', d:'행동 순서 맨 뒤로 · 받는 피해 증가'+r(s.web), good:false});
  if(s.curse) o.push({i:'💀', t:'저주', d:'받는 피해 +'+Math.round((s.curse.v||0)*100)+'%'+r(s.curse), good:false});
  return o;
}

function battleUnitHtml(u, opts){

    + (opts.fx && opts.fx.text ? '<div class="bu-float '+(opts.fx.textCls||'')+'">'+opts.fx.text+'</div>' : '')
    + '</div>'
    + '<div class="bu-plate">'+((u.owner && raidIsNet() && u.owner!==raidNet.role) ? '👥' : '')+(u.dispName || sp.name)+eff+'</div>'
    + '<div class="bu-hp"><div style="width:'+hpPct+'%;"></div>'+(shPct>0?'<i style="width:'+shPct+'%;"></i>':'')+'</div>'
    + '<div class="bu-hpnum">'+fmtHp(u.hp)+'/'+fmtHp(u.maxHp)+'</div>'
    + gg
    + (st ? '<div class="bu-sts" data-stat="'+u.side+':'+u.idx+'">'+st+'</div>' : '')
    + '</div>';
}
// (v173) 스킬 종류: 공격 · 약화(공격+해로운 효과) · 회복 · 보호 · 강화
const DEBUFF_WORDS = ['화상','둔화','빙결','독','속박','저주','제거'];
function skillTypeOf(sk, u){
  if(!sk) return { k:'atk', i:'🗡️', t:'공격' };
  if(sk.kind==='heal') return { k:'sup', i:'✚', t:'회복' };
  if(sk.kind==='shield') return { k:'sup', i:'🛡️', t:'보호' };
  if(sk.kind==='buff') return { k:'sup', i:'⏫', t:'강화' };
  const tag = (typeof sk.tag==='function' ? sk.tag(u ? u.g : 0) : '') || '';
  return DEBUFF_WORDS.some(w=>tag.indexOf(w)>=0) ? { k:'deb', i:'🧪', t:'약화' } : { k:'atk', i:'🗡️', t:'공격' };
}

  let h = '<div class="sub" style="text-align:center; margin-bottom:6px;">'+ELEMENT_INFO[sp.element].icon+' '+RARITY_INFO[sp.rarity].name+' · '+kit.role+'</div>';

  h += row('스킬2 · 쿨 '+kit.s2.cd+(g<2?' · 에픽부터':''), kit.s2.name, kit.s2.icon, kit.s2.desc(Math.max(2,g)), g<2);
  h += row('패시브'+(g<1?' · 레어부터':''), kit.passive.name, '✦', kit.passive.desc(Math.max(1,g)), g<1);

// (v179) 전장 배치: 각 정령의 화면 위치(%) · 크기. 전열은 가운데 쪽, 후열은 바깥쪽, 같은 줄은 위아래로 엇갈리게.
// 아래(가까이)에 있을수록 살짝 크게 그려 원근감. rs = 한 줄 세로 간격(화면 비율), sz = 기본 아이콘 크기
function battleLayout(sf){
  const slots = [], raid = sf.mode==='raid';
  const put = (side, idx, x, y, size)=>{
    if(!unitAt(sf, side, idx)) return;
    slots.push({ side, idx, x: side==='me' ? x : 100-x, y, size, d: 0.9 + Math.max(0, Math.min(1, (y-12)/74))*0.16 });
  };
  const sz = raid ? 38 : 44;
  if(raid){
    const fy = [13,34,55,76], by = [21,42,63,84];
    [0,1,2,3].forEach((idx,r)=>put('me', idx, 34+((r===1||r===2)?2:0), fy[r], sz));
    [4,5,6,7].forEach((idx,r)=>put('me', idx, 12, by[r], sz));
  }else{
    const fy = [20,47,74], by = [29,56,83];
    [0,1,2].forEach((idx,r)=>put('me', idx, 33+(r===1?2:0), fy[r], sz)); // (v180) 전열끼리 너무 붙어 보여서 가운데 간격을 넓힘
    [3,4,5].forEach((idx,r)=>put('me', idx, 11, by[r], sz));
  }
  const ew = sideWidth(sf, 'enemy');
  let enemyRows = false;
  sf.enemyUnits.forEach(u=>{
    if(u.isBoss){ put('enemy', u.idx, raid ? 24 : 18, raid ? 48 : 52, raid ? 90 : 80); return; }
    enemyRows = true;
    const front = isFrontRow(u.idx, ew), r = u.idx % ew;
    if(front) put('enemy', u.idx, 33+(r===1?2:0), [20,47,74][r], 44);
    else put('enemy', u.idx, 11, [29,56,83][r], 44);
  });
  const tags = [{x:11,t:'후열'},{x:raid?35:34,t:'전열'}];
  if(enemyRows) tags.push({x:66,t:'전열'},{x:89,t:'후열'});
  return { slots, tags, rs: raid ? 0.21 : 0.27, sz };
}

function battleThemeOf(sf){
  if(sf.mode==='raid') return 'raid-'+(raidBossById(sf.raidBossId) ? sf.raidBossId : 'frostTyrant');
  if(sf.mode==='expedition') return 'plains';
  if(sf.mode==='duel') return 'arena';

  return BATTLE_THEMES[CHAPTER_MASKS[ch].theme] || 'snow';
}

const BOSS_MAX_COMBO_MULT = 2.2;
function bossComboMult(matched, total){
  if(matched<=0) return 1;
  const step = (BOSS_MAX_COMBO_MULT-1)/total;
  return 1 + step*matched;
}

function beats(a,b){
  const cycle = {fire:'wood', wood:'water', water:'fire'};
  if(cycle[a]===b) return true;
  if(a==='light' && b==='dark') return true;
  return false;
}
function typeMult(a,b){
  if(beats(a,b)) return 1.3;
  if(beats(b,a)) return 0.8;
  return 1.0;
}
// 속성별 밸런스 보정 — 화/수/목은 3원 순환이라 유불리가 정확히 반반(균등 랜덤 상대 기준 평균 배율 1.02)인데,
// 빛은 어둠에게만 이기고 지는 상대가 없어 평균 1.06, 어둠은 빛에게만 지고 이기는 상대가 없어 평균 0.96으로
// 구조적으로 불균형함. 그 격차만큼 기본 공격력에서 보정(빛 -3.8%, 어둠 +6.25%)해서 다섯 속성의 평균 전투력을 맞춤
const ELEMENT_ATK_MULT = { fire:1, water:1, wood:1, light:0.96, dark:1.06 };
function enhanceLevel(key){ return (state.enhanceLevel && state.enhanceLevel[key]) || 0; }
const MAX_ENHANCE = 10;
function maxEnhanceFor(key){
  const passive = passiveFor(key);

// 공격력·팀 체력은 정령력에서 나옴: 전투 공격력 = 정령력 x (상성·특성 등 전투 효과), 체력 = 정령력 x 속성 체력 비율 x 배수.
function unitPower(speciesKey){
  const sp = SPIRITS[speciesKey];
  const base = BASE_ATK * RARITY_INFO[sp.rarity].mult * ELEMENT_ATK_MULT[sp.element];
