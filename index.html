const MYTHIC_PASSIVE = { icon:'👑', name:'통솔', desc:'모든 팀원의 공격력 +10%' };
function passiveForERV(element, rarity, variant){
  if(rarity==='common' || rarity==='rare') return null; // 일반·레어는 아직 variant 간 차이 없음(쌍둥이)
  if(rarity==='mythic'){
    const epicP = ELEMENT_PASSIVE[element].epic[variant];
    return Object.assign({}, epicP, {
      name: epicP.name+' + 통솔',
      desc: epicP.desc+' · '+MYTHIC_PASSIVE.desc
    });
  }
  const byElement = ELEMENT_PASSIVE[element];
  const byRarity = byElement && byElement[rarity];
  return (byRarity && byRarity[variant]) || null;
}
function passiveFor(key){
  const sp = SPIRITS[key];
  return passiveForERV(sp.element, sp.rarity, sp.variant);
}
function enhanceCost(key){
  const sp = SPIRITS[key];
  const lvl = enhanceLevel(key);
  const rarityIdx = RARITY_ORDER.indexOf(sp.rarity);
  let essence = 30 + lvl*20 + rarityIdx*15;
  let stone = 2 + lvl*2 + rarityIdx;
  return { essence, stone };
}
function doEnhance(key){
  const lvl = enhanceLevel(key);
  if(lvl>=maxEnhanceFor(key)){ toast('최대 강화 레벨'); return; }
  const cost = enhanceCost(key);
  if(state.essence<cost.essence || (state.enhanceStone||0)<cost.stone){
    toast('재료 부족 (정수 '+cost.essence+' · 강화석 '+cost.stone+' 필요)'); return;
  }
  state.essence -= cost.essence;
  state.enhanceStone -= cost.stone;
  if(!state.enhanceLevel) state.enhanceLevel = {};
  state.enhanceLevel[key] = lvl+1;
  checkAchievements();
  save();
  sfx('enhance');
  toast('강화 성공! Lv.'+(lvl+1));
  render();
}
const DISMANTLE_GAIN = [1,3,8,20,50]; // 등급 순서(RARITY_ORDER)에 대응
function doDismantle(key, n){
  n = Math.min(n||1, ownedCount(key));
  if(n<=0) return;
  const gain = DISMANTLE_GAIN[RARITY_ORDER.indexOf(SPIRITS[key].rarity)] * n;
  state.owned[key] -= n;
  cleanupFormation();
  state.enhanceStone = (state.enhanceStone||0) + gain;
  const shards = DISMANTLE_SHARDS[RARITY_ORDER.indexOf(SPIRITS[key].rarity)] * n; // (v170) 정령 파편
  state.shards = (state.shards||0) + shards;
  save();
  toastReward({stone:gain}, '♻️ 분해 '+n+'개 · 💠 파편 +'+shards);
  render();
}

function isPlainObj(o){ return !!o && typeof o==='object' && !Array.isArray(o); }
function mergeWithDefaults(def, saved){
  if(!isPlainObj(saved)) return def;

    if(v===undefined){ out[k] = d; return; }
    if(d===null){ out[k] = v; return; }
    if(Array.isArray(d)) out[k] = Array.isArray(v) ? v : d;
    else if(typeof d==='number') out[k] = (typeof v==='number' && isFinite(v)) ? v : d;
    else if(typeof d==='string') out[k] = typeof v==='string' ? v : d;
    else if(typeof d==='boolean') out[k] = typeof v==='boolean' ? v : d;
    else if(isPlainObj(d)) out[k] = isPlainObj(v) ? v : d;
    else out[k] = v;

function resumeAudio(){ try{ const p = audioCtx.resume(); if(p && p.catch) p.catch(()=>{}); }catch(e){} }
function ensureAudioCtx(){
  if(audioCtx && audioCtx.state==='closed'){ audioCtx = null; bgmGain = null; sfxGain = null; } // 닫힌 컨텍스트는 다시 만듦
  // (v106) 예전엔 'suspended'일 때만 resume()을 걸어서, iOS가 앱 전환·화면 잠금 뒤 만드는 'interrupted' 상태에서는

  if(audioCtx){ if(audioCtx.state!=='running') resumeAudio(); return audioCtx; }

function playTone(freq, startOffset, duration, bus, type, peak){

  const g = audioCtx.createGain();

  osc.frequency.value = freq;
  const t0 = audioCtx.currentTime + startOffset;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak||0.4, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0+duration);

const SFX_STALE_MS = 300, SFX_BURST_MS = 120, SFX_BURST_MAX = 3;

let sfxPendingName = null, sfxPendingAt = 0, sfxResumeAt = 0, sfxBurstStart = 0, sfxBurstCount = 0;
function sfx(name){
  if(state.settings.sfxVolume<=0) return;
  if(document.hidden) return;
  const ctx = ensureAudioCtx(); if(!ctx) return;
  if(ctx.state==='running'){ sfxPlay(name); return; }
  sfxPendingName = name; sfxPendingAt = Date.now();
  if(sfxResumeAt && Date.now()-sfxResumeAt < 800) return; // 이미 재개 시도 중 (한 번 멈추면 800ms 뒤엔 다시 시도)
  sfxResumeAt = Date.now();

    sfxResumeAt = 0;
    const n = sfxPendingName; sfxPendingName = null;
    if(n && ctx.state==='running' && Date.now()-sfxPendingAt < SFX_STALE_MS) sfxPlay(n);
  };

function sfxAt(delayMs, fn){

function sfxPlay(name){

  else if(name==='summonRare') { [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.08,0.18,sfxGain,'triangle',0.18)); }
  else if(name==='summonCharge') { [220,277,330,415,523].forEach((f,i)=>playTone(f,i*0.11,0.16,sfxGain,'sine',0.10)); }
  else if(name==='summonEpic') { [523,659,784,1047,1319].forEach((f,i)=>playTone(f,i*0.07,0.22,sfxGain,'triangle',0.2)); playTone(262,0,0.5,sfxGain,'sine',0.14); }
  else if(name==='summonLegend') { [523,659,784,1047,1319,1568].forEach((f,i)=>playTone(f,i*0.07,0.26,sfxGain,'triangle',0.22)); playTone(196,0,0.7,sfxGain,'sine',0.16); playTone(392,0.1,0.6,sfxGain,'sine',0.12); }
  else if(name==='fuse') { playTone(440,0,0.1,sfxGain,'sawtooth',0.14); playTone(660,0.08,0.12,sfxGain,'sawtooth',0.14); playTone(880,0.16,0.2,sfxGain,'sawtooth',0.16); }
  else if(name==='enhance') { playTone(523,0,0.07,sfxGain,'square',0.12); playTone(784,0.06,0.12,sfxGain,'square',0.14); }
  else if(name==='win') { [523,659,784,1047].forEach((f,i)=>playTone(f,i*0.09,0.2,sfxGain,'square',0.16)); }
  else if(name==='lose') { playTone(300,0,0.3,sfxGain,'sawtooth',0.12); playTone(220,0.15,0.35,sfxGain,'sawtooth',0.12); }

function startBgm(){
  if(bgmTimer || !ensureAudioCtx()) return;
  bgmTimer = setInterval(()=>{
    if(state.settings.bgmVolume<=0) return;
    if(document.hidden || !audioCtx || audioCtx.state!=='running') return; // 멈춘 동안 음이 쌓였다가 한꺼번에 터지는 것 방지
    const step = bgmStep % BGM_MELODY.length;
    playTone(BGM_MELODY[step], 0, 0.5, bgmGain, 'sine', 0.09);
    playTone(BGM_BASS[step], 0, 0.6, bgmGain, 'triangle', 0.05);
    // 화음을 5도/3도로 번갈아 살짝 색을 더함(4박마다)
    if(step % 4 === 0){
      const interval = (step % 8 === 0) ? 1.5 : 1.25;
      playTone(BGM_MELODY[step]*interval, 0.02, 0.9, bgmGain, 'sine', 0.035);

function weightedPick(list){
  const total = list.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const item of list){
    if(r < item.w) return item.r;
    r -= item.w;
  }
  return list[list.length-1].r;
}

function weightsForLevel(lvl){
  // (v101) 에픽 1% 고정. 레어는 Lv.1 10% → Lv.16 16%까지, 레전더리는 Lv.17부터 조금씩(최대 0.5%). 나머지는 전부 일반
  const shift = Math.min(lvl-1, 15);

  const legendary = lvl >= LEGENDARY_SUMMON_LEVEL ? Math.min(lvl-(LEGENDARY_SUMMON_LEVEL-1), 20)*0.025 : 0;
  return [
    {r:'common', w:100 - rare - SUMMON_EPIC_RATE - legendary},
    {r:'rare', w:rare},
    {r:'epic', w:SUMMON_EPIC_RATE},
    {r:'legendary', w:legendary}
  ];
}

// 상성 전략(서로 다른 속성 보유)을 바로 체험하게 함. 적 강도는 건드리지 않음. offset = 이번 소환 묶음에서 앞서 뽑은 횟수, batch = 앞서 뽑은 키들
function pickSummonElement(offset, batch){
  if((state.lifetimeSummons||0) + (offset||0) < ELEMENTS.length){
    const have = new Set((batch||[]).map(k=>k.split('_')[0]));
    Object.keys(state.discovered).forEach(k=>{ if(state.discovered[k]) have.add(k.split('_')[0]); });
    const unseen = ELEMENTS.filter(el=>!have.has(el));
    if(unseen.length) return unseen[Math.floor(Math.random()*unseen.length)];
  }
  return ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
}

const MULTI_SUMMON_COUNT = 10;
function multiSummonCost(){ return Math.round(SUMMON_COST * MULTI_SUMMON_COUNT * 0.9); } // 10개 값 대비 10% 할인
function doMultiSummon(){
  const cost = multiSummonCost();
  const byTicket = ticketCount('summon') >= MULTI_SUMMON_COUNT; // 소환권이 10장 이상이면 소환권 10장, 아니면 정수
  if(!byTicket && state.essence < cost){ toast('정수 부족 (' + cost + ' 필요)'); return; }
  if(byTicket) state.tickets.summon -= MULTI_SUMMON_COUNT; else state.essence -= cost;
  const results = [];
  for(let i=0;i<MULTI_SUMMON_COUNT;i++){
    const rarity = weightedPick(summonWeights());
    const element = pickSummonElement(i, results);
    const variant = VARIANTS[Math.floor(Math.random()*VARIANTS.length)];
    results.push(element+'_'+rarity+'_'+variant);
  }
  // 10연 천장: 레어 이상이 하나도 없으면 마지막 한 자리를 레어/에픽 중 하나로 강제 전환(같은 element/variant 유지)
  const hasRarePlus = results.some(k=> SPIRITS[k].rarity!=='common');
  if(!hasRarePlus){
    const weights = summonWeights();
    const rareW = weights.find(w=>w.r==='rare').w;
    const epicW = weights.find(w=>w.r==='epic').w;
    const rarity = Math.random()*(rareW+epicW) < rareW ? 'rare' : 'epic';
    const last = SPIRITS[results[results.length-1]];
    results[results.length-1] = last.element+'_'+rarity+'_'+last.variant;
  }
  const isNewFlags = results.map(key=>{
    const isNew = !state.discovered[key];
    state.owned[key] = (state.owned[key]||0) + 1;
    state.discovered[key] = true;
    pushRecentSummon(key);
    return isNew;
  });
  state.dailyStats.summons += MULTI_SUMMON_COUNT;
  state.lifetimeSummons = (state.lifetimeSummons||0) + MULTI_SUMMON_COUNT;
  checkAchievements();
  save();
  showMultiResultModal(results, isNewFlags, doMultiSummon);
  render();
}

// decimals=1로 소수점 첫째자리까지 유지해서 반올림 오차 자체를 줄인다.
function distributeRounded(values, decimals){
  // (수정) 예전엔 "슬롯별 표시값 합 = 전체 표시값"을 맞추려고 나머지를 아무 슬롯에나 몰아줬는데,
  // 그러다 보니 완전히 똑같은 값을 가진 슬롯들 중 하나만 반올림이 다르게 튀어서(예: 12.7/12.7/12.8)
  // 오히려 계산이 이상하다는 오해를 샀음. 이제는 그냥 슬롯마다 독립적으로 반올림함 —
  // 합계가 전체 표시값이랑 소수점 단위로 살짝 다를 수 있지만(최대 0.1 정도), 이게 더 이해하기 쉬움
  decimals = decimals===undefined ? 1 : decimals;

}

// ===================== 세이브 내보내기/불러오기 =====================
// 이 게임은 브라우저 localStorage에만 저장돼서 기기(폰↔PC) 간 자동 연동이 안 되고,
// 파일을 새로 받을 때마다 브라우저가 다른 출처로 취급해서 저장이 안 이어지는 경우도 있음.
// 그래서 상태 전체를 문자열 코드로 내보내고/불러올 수 있게 해서, 수동으로라도 백업·이전이 가능하게 함.
// LZString으로 압축해서 예전 base64 방식보다 60%가량 짧게 만듦. CDN이 막혀서 LZString이 없으면(오프라인 등)
// base64로 자동 대체 — 코드 앞에 붙는 접두어(LZ:/B64:)로 어떤 방식인지 구분해서 불러오기 때도 맞게 해석함
function encodeSaveString(){
  const json = JSON.stringify(state);
  if(typeof LZString!=='undefined') return 'LZ:'+LZString.compressToEncodedURIComponent(json);
  return 'B64:'+btoa(unescape(encodeURIComponent(json)));
}
// (v130) 붙여넣기 정리: 안 보이는 문자 제거, "LZ:"/"B64:"부터 코드로 인식(앞에 설명글이 붙어도 됨), 줄바꿈·공백 처리
function saveCodeCandidates(raw){
  let t = String(raw==null?'':raw).replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g, '');
  // 앞머리는 대소문자·전각 콜론을 가리지 않고 인식(키보드 자동 변환으로 "lz:"처럼 바뀐 경우) → 항상 "LZ:" / "B64:"로 정규화
  const m = t.match(/(LZ|B64)\s*[:：]/i);
  if(m) t = m[1].toUpperCase() + ':' + t.slice(m.index + m[0].length);
  if(/%[0-9A-Fa-f]{2}/.test(t)){ try{ t = decodeURIComponent(t); }catch(e){} }
  const out = [];
  // 1) 공백은 '+'가 바뀐 것일 수 있음(LZString 방식), 줄바꿈·탭만 제거  2) 공백까지 전부 제거(줄 끝 공백이 끼는 경우)
  out.push(t.replace(/ /g, '+').replace(/[\r\n\t]+/g, ''));
  out.push(t.replace(/\s+/g, ''));
  return out.filter((v,i,a)=>v && a.indexOf(v)===i);
}
function decodeSaveOne(s){
  let json = null;
  if(s.startsWith('LZ:')){
    json = LZString.decompressFromEncodedURIComponent(s.slice(3));
    if(!json){ const e = new Error('truncated'); e.code = 'TRUNCATED'; throw e; }
  }else if(s.startsWith('B64:')){
    json = decodeURIComponent(escape(atob(s.slice(4))));
  }else{
    // 접두어 없는 예전 코드(순수 base64) 호환 — 접두어를 빠뜨린 LZ 코드도 한 번 시도
    try{ json = decodeURIComponent(escape(atob(s))); }
    catch(e){ json = LZString.decompressFromEncodedURIComponent(s); }
    if(!json){ const e = new Error('format'); e.code = 'FORMAT'; throw e; }
  }
  return JSON.parse(json);
}
function decodeSaveString(str){
  const cands = saveCodeCandidates(str);
  if(!cands.length){ const e = new Error('empty'); e.code = 'EMPTY'; throw e; }
  let lastErr = null;
  for(const c of cands){
    try{ return decodeSaveOne(c); }catch(e){ lastErr = e; }
  }
  if(lastErr && !lastErr.code) lastErr.code = 'CORRUPT';
  throw lastErr;
}

// ===================== 챕터 % 클리어 보상 =====================
const CHAPTER_PCT_THRESHOLDS = [0.25, 0.5, 0.75, 1.0];
function chapterClearCount(chapterNum){
  const offset = (chapterNum-1)*CHAPTER_LENGTH;
  let count = 0;
  for(let i=0;i<CHAPTER_LENGTH;i++){ if(state.stageBest[offset+i]) count++; }
  return count;
}
// (v103) 챕터 진행도 보상: 25% 정수 / 50% 정령 소환권 5장 / 75% 정수+강화석 / 100% 레어 정령 확정권+소환권 (챕터가 올라갈수록 정수·강화석 증가)
function chapterPctReward(chapterNum, t){
  const p = Math.round(t*100), sc = 1 + (chapterNum-1)*0.5;
  if(p===25) return { essence: Math.round(100*sc), stone: 0, items: null };
  if(p===50) return { essence: 0, stone: Math.round(10*sc), items: {summon:5} };
  if(p===75) return { essence: Math.round(200*sc), stone: Math.round(15*sc), items: null };
  return { essence: 0, stone: Math.round(20*sc), items: {rare:1, summon:5} };
}
function checkChapterPctRewards(chapterNum){
  const count = chapterClearCount(chapterNum);
  const pct = count/CHAPTER_LENGTH;
  CHAPTER_PCT_THRESHOLDS.forEach(t=>{
    if(pct>=t){
      const id = 'ch'+chapterNum+'_pct'+Math.round(t*100);
      if(!state.chapterRewardsClaimed[id]){
        state.chapterRewardsClaimed[id] = true;
        const rw = chapterPctReward(chapterNum, t);
        addPendingReward(id, '🗺️', '챕터'+chapterNum+' '+Math.round(t*100)+'% 클리어', rw.essence, rw.stone, 'stage', rw.items);
        toast('🗺️ 챕터'+chapterNum+' '+Math.round(t*100)+'% 달성 · 보상 대기', 2800);
      }
    }
  });
}
function chapterRewardLadderHtml(chapterNum){
  // 등급별 보상표(renderGradeLadderHtml)랑 완전히 같은 타일 스타일로 통일 — 이미 받은 것도 ✅로 계속 남아있음
  const count = chapterClearCount(chapterNum);

  let html = '';
  CHAPTER_PCT_THRESHOLDS.forEach(t=>{
    const id = 'ch'+chapterNum+'_pct'+Math.round(t*100);

function dexProgress(){
  const total = Object.keys(SPIRITS).length;
  const found = Object.keys(state.discovered||{}).filter(k=>state.discovered[k]).length;
  return found/total;
}
// ===================== 계정 레벨 (별도 경험치 없이 전체 진행도로 계산 — 컨텐츠 해금용) =====================
const ACCOUNT_LEVEL_THRESHOLDS = [0, 10, 30, 60, 100]; // 이 점수를 넘으면 레벨 1~5
const ACCOUNT_UNLOCK_LEVEL = { reroll: 2, expedition: 2 }; // 계정 점수 10 → Lv.2, 30 → Lv.3 (챕터1 보스 클리어 즈음)
const CHAPTER1_BOSS_STAGE = CHAPTER_LENGTH-1; // 챕터1 보스는 스테이지 10(인덱스 9) — (v148) 챕터 10스테이지로 축소
function chapter1BossCleared(){ return !!state.stageBest[CHAPTER1_BOSS_STAGE]; }
function accountPoints(){
  // 시작 시 스타터 5종(속성별 1개)이 이미 discovered 상태라 dexFound가 5부터 시작함.
  // 그대로 점수에 넣으면 새 게임 시작부터 계정 레벨 경험치 바가 절반(5/10) 차있는 버그가 생기므로
  // 스타터 개수만큼 빼고 "직접 발견한" 종만 점수로 인정한다.
  const dexFound = Math.max(0, Object.keys(state.discovered||{}).filter(k=>state.discovered[k]).length - ELEMENTS.length);
  return totalStagesCleared()*1 + (state.towerBest||0)*2 + Math.min(state.expeditionBestReach||0, EXPEDITION_NODE_COUNT)*3 + dexFound*1;
}
function accountLevel(){
  const pts = accountPoints();
  let lvl = 1;
  for(let i=1;i<ACCOUNT_LEVEL_THRESHOLDS.length;i++){ if(pts>=ACCOUNT_LEVEL_THRESHOLDS[i]) lvl = i+1; }
  return lvl;
}
function nextAccountThreshold(){
  const lvl = accountLevel();
  return ACCOUNT_LEVEL_THRESHOLDS[lvl] !== undefined ? ACCOUNT_LEVEL_THRESHOLDS[lvl] : null; // null이면 최고 레벨
}
function isUnlocked(feature){
  if(feature==='tower') return true; // (v154) 탑은 처음부터 개방
  if(feature==='expedition'){
    return accountLevel()>=ACCOUNT_UNLOCK_LEVEL[feature] && chapter1BossCleared(); // (v168) 진형이 처음부터 6칸이라 슬롯 해금 조건 제거
  }
  const need = ACCOUNT_UNLOCK_LEVEL[feature];
  if(need===undefined) return true;
  return accountLevel() >= need;
}

function hearthSparks(){

  return HEARTH_INTERVAL_MS() - (elapsed % HEARTH_INTERVAL_MS());

function towerFloorReward(f){
  if(f%25===0) return {items:{epic:1}};   // 25, 50, 75… 에픽 확정권
  const m = f%10;
  if(m===0) return {items:{rare:1}};      // 10, 20, 30… 레어 확정권
  if(m===5) return {items:{summon:1}};    // 5, 15, 35… 정령 소환권
  if(m===9) return {items:{equip:1}};     // 9, 19, 29… 정령장비 소환권
  if(m===2 || m===4 || m===7) return {stone: 14+4*f};  // 예전엔 정수 소량 곁들였지만 이제 전부 강화석
  return {stone: 24+6*f};                 // 나머지 층: 강화석이 탑의 기본 보상
}
function resolveTowerBattle(floor, playerPower, grade){
  if(playerPower > (state.towerBestPower||0)) state.towerBestPower = dmgRound(playerPower);
  let reward = 0, stoneReward = 0, firstClear = false;
  let frontierAdvanced = false;
  if(grade){
    if(floor === towerFloor()){ state.towerBest = floor; frontierAdvanced = true; } // 프론티어 층을 처음 통과하면 다음 층으로 진행
    if(!state.towerFloorGrades) state.towerFloorGrades = {};
    const gradeRank = {C:1,B:2,A:3,S:4};
    const prevGrade = state.towerFloorGrades[floor];
    if(!prevGrade || gradeRank[grade] > gradeRank[prevGrade]) state.towerFloorGrades[floor] = grade; // 최고 등급 기록(보상과 무관, 순수 기록용)
    if(!state.towerFloorRewardClaimed) state.towerFloorRewardClaimed = {};
    if(!state.towerFloorRewardClaimed[floor]){
      firstClear = true;
      const rw = towerFloorReward(floor);
      reward = rw.essence || 0;

      state.towerFloorRewardClaimed[floor] = true;
      addPendingReward('tower_'+floor, '🗼', floor+'층 돌파', reward, stoneReward, 'tower', rw.items || null);

const EXP_TICKET_MAX = 2, EXP_TICKET_INTERVAL_MS = 12*60*60*1000;

function expTicketState(){

function expTicketsRefresh(){
  const t = expTicketState(), now = Date.now();
  if(t.lastTick > now) t.lastTick = now;                 // 시계를 미래로 돌렸다 되돌려도 멈추지 않게
  if(t.count >= EXP_TICKET_MAX){ t.count = EXP_TICKET_MAX; t.lastTick = now; } // 가득 차 있는 동안은 타이머 정지
  else{
    const n = Math.floor((now - t.lastTick) / EXP_TICKET_INTERVAL_MS);
    if(n > 0){
      t.count = Math.min(EXP_TICKET_MAX, t.count + n);
      t.lastTick = t.count >= EXP_TICKET_MAX ? now : t.lastTick + n*EXP_TICKET_INTERVAL_MS;
    }
  }
  if(t.buyDate !== todayStr()){ t.buyDate = todayStr(); t.buys = 0; }
  return t;
}

function buildExpeditionFight(run, node, isBoss){
  const nodeIndex = expeditionStepIndex(run);

  state.formation.slice(0, GRID_SLOTS).forEach((key, idx)=>{
    if(!key) return;
    const fm = expFatigueMult((run.consecutive[key]||0)+1);
    const u = makeBattleUnit('me', idx, key, unitAtk(key)*fm*run.powerMult, ALLY_HP_MULT);
    const persisted = run.unitHp[key];
    if(persisted){ u.maxHp = Math.min(persisted.maxHp, u.maxHp) || u.maxHp; u.hp = Math.max(0, Math.min(persisted.hp, u.maxHp)); u.alive = u.hp>0; }
    myUnits.push(u);
  });

    const rv = enemyRarityAt(node, idx), key = el+'_'+rv.rarity+'_'+rv.variant;

function persistExpeditionWaveState(sf){
  const run = state.expedition; if(!run) return;
  const activeKeys = new Set(sf.myUnits.map(u=>u.key));
  sf.myUnits.forEach(u=>{ run.unitHp[u.key] = { hp: u.hp, maxHp: u.maxHp }; });
  run.roster.forEach(key=>{
    if(!key) return;
    if(activeKeys.has(key)){
      run.consecutive[key] = (run.consecutive[key]||0) + 1;
    }else{
      run.consecutive[key] = 0;
      const cur = run.unitHp[key] || { hp: spiritMaxHpGrid(key), maxHp: spiritMaxHpGrid(key) };
      cur.hp = Math.min(cur.maxHp, cur.hp + Math.round(cur.maxHp*BOSS_REST_HEAL));
      run.unitHp[key] = cur;

  });
}
function checkExpeditionOutcome(sf){

  run.pot.stone += Math.round(base.stone*run.rewardMult);
  run.pot.equip = (run.pot.equip||0) + Math.round(base.equip*run.rewardMult);
  run.pendingKeep = true;
  state.lifetimeExpeditionClears = (state.lifetimeExpeditionClears||0) + 1;
  const prevBest = state.expeditionBestReach||0;
  if(run.totalCleared > prevBest){
    state.expeditionBestReach = run.totalCleared;
    const gain = (Math.min(run.totalCleared,EXPEDITION_NODE_COUNT) - Math.min(prevBest,EXPEDITION_NODE_COUNT))*3;

// ===================== 챕터 내 특수 규칙 스테이지 =====================
// 각 챕터마다 스테이지1·보스를 제외한 곳 중 7곳이 무작위로 특수 규칙 스테이지가 됨 — 챕터 안에서 최소 3종 이상의 서로 다른 규칙이 섞이도록 보장
// 규칙은 나(진형)뿐 아니라 적 진형에도 적용되고, 적은 조건을 항상 충족하는 구성으로 나옴(v115). 자원형·정예형은 적에게 적용할 개념이 없어 예외
// (v146) 챕터 10스테이지 기준으로 축소: 특수 스테이지는 챕터당 3~4개(짝수 챕터 4개·홀수 챕터 3개), 이중 규칙·하드코딩 오버라이드는 폐기(6칸 새 전투로 전부 이식)
const SPECIAL_STAGE_TYPES = ['sequence','coverage','chain','resource','squadLimit','diversity','relay','goldenSlot','sealedSlot','field'];
function specialStageCountFor(chapterNum){ return chapterNum%2===0 ? 4 : 3; }
const specialTypeCache = {};
function specialTypeOrder(chapterNum){
  if(specialTypeCache[chapterNum]) return specialTypeCache[chapterNum];
  const arr = SPECIAL_STAGE_TYPES.slice();
  for(let k=arr.length-1; k>0; k--){ const j = Math.floor(seededRand(chapterNum*311.7+k*5.3+2)*(k+1)); const t = arr[k]; arr[k] = arr[j]; arr[j] = t; }
  return (specialTypeCache[chapterNum] = arr.slice(0, specialStageCountFor(chapterNum)));
}
const specialIndicesCache = {};
function specialStageLocalIndices(chapterNum){
  if(specialIndicesCache[chapterNum]) return specialIndicesCache[chapterNum];
  const pool = [];
  for(let li=1; li<CHAPTER_LENGTH-1; li++) pool.push(li); // 로컬 0(스테이지1)과 마지막(보스) 제외
  const seed = chapterNum*211.3 + 1;
  for(let k=pool.length-1; k>0; k--){
    const j = Math.floor(seededRand(seed+k*3.1)*(k+1));
    const tmp=pool[k]; pool[k]=pool[j]; pool[j]=tmp;
  }
  return (specialIndicesCache[chapterNum] = pool.slice(0, specialStageCountFor(chapterNum)).sort((a,b)=>a-b));
}
function isSpecialStage(i){
  if(isBossStage(i)) return false;
  const local = i % CHAPTER_LENGTH;
  if(local===0) return false; // 스테이지1 제외
  const chapterNum = Math.floor(i/CHAPTER_LENGTH)+1;
  return specialStageLocalIndices(chapterNum).includes(local);
}
const SPECIAL_SYM_TYPES = ['sequence','coverage','chain','diversity','relay'];      // 적도 조건을 충족해 배율을 받음
const SPECIAL_AGG_TYPES = SPECIAL_SYM_TYPES.concat(['squadLimit','resource']);       // 진형 전체에 붙는 배율
function specialRules(spec){ return spec.extra ? [spec, spec.extra] : [spec]; } // (v146) extra는 항상 비어있음(이중 규칙 폐기) — 기존 호출부 호환을 위해 함수는 유지
function makeSpecialRule(type, i, chapterNum, salt, slotCount){
  const sd = salt || 0;
  const sc = slotCount || GRID_SLOTS;
  if(type==='sequence'){
    const pattern=[];
    for(let k=0;k<3;k++){ const r=seededRand(i*12.1+k*3.3+1+sd); pattern.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]); }
    return {type, pattern};
  }
  if(type==='coverage'){
    const r1=seededRand(i*19.3+2+sd); const first=ELEMENTS[Math.floor(r1*ELEMENTS.length)];
    let second=first, tries=0;
    while(second===first && tries<10){ const r2=seededRand(i*19.3+2+tries*1.7+1+sd); second=ELEMENTS[Math.floor(r2*ELEMENTS.length)]; tries++; }
    return {type, required:[first,second]};
  }
  if(type==='squadLimit'){
    const k = 2 + Math.floor(seededRand(i*29.1+4+sd)*2); // 2 또는 3
    return {type, k};
  }
  if(type==='goldenSlot'){
    const r = seededRand(i*37.9+6+sd);
    return {type, slot: Math.floor(r*sc)}; // (v154) 슬롯 수를 인자로 받음(6칸 새 전투 / 탑 3~5칸 공용)
  }
  if(type==='sealedSlot'){
    const r = seededRand(i*53.3+8+sd);
    return {type, slot: Math.floor(r*sc)};
  }
  if(type==='field'){
    const up = ELEMENTS[Math.floor(seededRand(i*71.9+3+sd)*ELEMENTS.length)];

      + (boss ? '<div class="ex-lbl">👑 '+bi.name+'</div>' : '')

//  · 하위 창(정령 선택·정보 등)으로 갔다가 돌아오면 원래 창의 위치 복원

let modalScrollStack = [];
function installModalScrollKeeper(){
  const mr = document.getElementById('modalRoot'); if(!mr) return;
  const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  const keyOf = m => m ? (((m.querySelector('h3')||{}).textContent)||'').trim() : '';
  Object.defineProperty(mr, 'innerHTML', { configurable: true, get(){ return desc.get.call(this); }, set(v){
    const old = this.querySelector('.modal'), oldTop = old ? old.scrollTop : 0, oldKey = keyOf(old);
    const reset = !!window.__modalScrollReset; window.__modalScrollReset = false;
    desc.set.call(this, v);
    const nw = this.querySelector('.modal'), newKey = keyOf(nw);
    if(!nw){ modalScrollStack = []; return; }          // 완전히 닫힘
    if(reset){ modalScrollStack = []; return; }
    if(old && oldKey && oldKey===newKey){ if(oldTop>0) nw.scrollTop = oldTop; return; } // 같은 창 재렌더
    const at = newKey ? modalScrollStack.map(e=>e.key).lastIndexOf(newKey) : -1;
    if(at >= 0){ const top = modalScrollStack[at].top; modalScrollStack = modalScrollStack.slice(0, at); if(top>0) nw.scrollTop = top; return; } // 하위 창에서 돌아옴
    if(old && oldKey) modalScrollStack.push({ key: oldKey, top: oldTop });                                                                  // 하위 창으로 이동
  }});
}

function buildClashSequence(pairs){
  const stagger = 0.64, dur = 1.1; // 0.5배속 (기존 대비 2배 느리게)

  let html = '';
  pairs.forEach((pair, idx)=>{
    const delay = idx*stagger;
    const dmgDelay = delay+dur*0.42;
    html += '<div class="clash-row">'
      + '<div class="clash-p" style="animation: clashLeft '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+(pair.p||'·')+'</div>'
      + '<div class="clash-impact" style="animation: impactFlash 0.6s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">💥</div>'
      + '<div class="clash-e" style="animation: clashRight '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+pair.e+'</div>'
      + '</div>';
    if(typeof pair.dmg==='number'){
      if(typeof pair.edmg==='number'){
        const color = pair.dmg>pair.edmg ? advColor.up : (pair.dmg<pair.edmg ? advColor.down : advColor.even);
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'
          + (pair.crit?'⚡':'') + '아군 '+fmtDmg(pair.dmg)+' <span class="sub" style="font-size:10px;">vs</span> 적 '+fmtDmg(pair.edmg) + '</div>';
      }else{
        const color = advColor[pair.adv] || advColor.none;
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'+(pair.crit?'⚡':'')+fmtDmg(pair.dmg)+'</div>';
      }
    }
  });
  const totalMs = Math.round((Math.max(pairs.length-1,0))*stagger*1000 + dur*1000 + 150);
  return {html, totalMs};
}

function showSlotPicker(slotIdx, returnFn, enemyEl, rosterFilter, lineup){
  returnFn = returnFn || (()=>{ closeModal(); render(); });
  let options = Object.keys(SPIRITS).filter(k=>ownedCount(k)>0);
  if(rosterFilter) options = options.filter(k=>rosterFilter.includes(k));
  let html = '';
  if(enemyEl){
    html += '<div class="sub" style="text-align:center; margin-bottom:8px;">슬롯 '+(slotIdx+1)+' 상대: <span style="font-size:18px;">'+ELEMENT_INFO[enemyEl].icon+'</span> '+ELEMENT_INFO[enemyEl].name+' · 🟢유리 🔴불리</div>';
  }else if(lineup){
    html += '<div class="sub" style="text-align:center; margin-bottom:8px;">상대 '+lineup.filter(Boolean).map(e=>ELEMENT_INFO[e].icon).join('')+'</div>'; // (v169 버그수정) 적 수가 3~6으로 바뀌며 빈 칸(null)이 섞여 선택창이 안 열리던 문제
  }
  if(state.formation[slotIdx]){
    html += '<button class="btn secondary" id="clearSlot" style="margin-bottom:10px;">슬롯 비우기</button>';
  }
  // (v128) 가용 정령은 초록 테두리·"가용 N/보유"로 눈에 띄게 위에, 전부 다른 슬롯에서 쓰는 정령은 흐리게 아래에 ("사용 중 · 슬롯 N")
  const entries = options.map(key=>({ key, owned: ownedCount(key), free: ownedCount(key) - usedCountExcluding(key, slotIdx),
    users: state.formation.map((k,i)=> (k===key && i!==slotIdx) ? i+1 : null).filter(Boolean), isCur: state.formation[slotIdx]===key }));
  // (v173) 정렬(전투력·등급·속성·역할) + 한 줄 카드로 정리 + ⓘ로 스킬 보기
  const sortBy = state.pickSort || 'cp';
  const roleOf = k=> LINE_KITS[SPIRITS[k].element+'_'+SPIRITS[k].variant].role;
  const cmp = { cp:(a,b)=>spiritCP(b.key)-spiritCP(a.key), rarity:(a,b)=>RARITY_ORDER.indexOf(SPIRITS[b.key].rarity)-RARITY_ORDER.indexOf(SPIRITS[a.key].rarity) || spiritCP(b.key)-spiritCP(a.key),
    element:(a,b)=>ELEMENTS.indexOf(SPIRITS[a.key].element)-ELEMENTS.indexOf(SPIRITS[b.key].element) || spiritCP(b.key)-spiritCP(a.key),
    role:(a,b)=> (ENEMY_FRONT_LINES.includes(SPIRITS[b.key].element+'_'+SPIRITS[b.key].variant)?1:0)-(ENEMY_FRONT_LINES.includes(SPIRITS[a.key].element+'_'+SPIRITS[a.key].variant)?1:0) || roleOf(a.key).localeCompare(roleOf(b.key)) || spiritCP(b.key)-spiritCP(a.key) }[sortBy] || ((a,b)=>0);
  entries.sort((a,b)=> (b.isCur - a.isCur) || ((b.free>0) - (a.free>0)) || cmp(a,b));
  html += '<div class="pk-sort">'+[['cp','💪 전투력'],['rarity','⭐ 등급'],['element','🔥 속성'],['role','🛡️ 역할']].map(([k,t])=>'<button data-pk-sort="'+k+'" class="'+(sortBy===k?'on':'')+'">'+t+'</button>').join('')+'</div>';
  let busyDivider = false;
  entries.forEach(e=>{
    const key = e.key, free = e.free, sp = SPIRITS[key], info = RARITY_INFO[sp.rarity];
    const kit = LINE_KITS[sp.element+'_'+sp.variant], front = ENEMY_FRONT_LINES.includes(sp.element+'_'+sp.variant);
    if(free<=0 && !busyDivider){ busyDivider = true; html += '<div class="pk-div">🔒 다른 칸에서 쓰는 중 — 누르면 이 칸으로 옮겨요</div>'; }
    let adv = '';
    if(enemyEl){ const m = typeMult(sp.element, enemyEl); adv = m>1 ? '<span class="pk-adv up">유리</span>' : (m<1 ? '<span class="pk-adv down">불리</span>' : ''); }
    else if(lineup){ const t = lineupThreat(key, lineup); adv = t.weak>=2 ? '<span class="pk-adv down">약점 '+t.weak+'</span>' : (t.strong>=2 ? '<span class="pk-adv up">강점 '+t.strong+'</span>' : ''); }
    const rn = spiritRune(key);
    html += '<div class="pk-card '+(e.isCur?'cur':(free>0?'avail':'busy'))+'" data-pick="'+key+'">'
      + '<div class="pk-ico" style="border-color:'+ELEMENT_INFO[sp.element].color+';">'+ELEMENT_INFO[sp.element].icon+'</div>'
      + '<div class="pk-main"><div class="pk-name">'+sp.name+' <span style="color:'+info.color+'; font-size:10px; font-weight:800;">'+info.name+'</span></div>'
      + '<div class="pk-sub"><span class="pk-role '+(front?'f':'b')+'">'+kit.icon+' '+kit.role+' · '+(front?'전열':'후열')+'</span>'+(rn?' '+runeIcon(rn):'')+(e.isCur?' <b style="color:#ffd24a;">📍이 칸</b>':(free<=0?' <span style="color:#ff8a8a;">칸 '+e.users.join('·')+'</span>':''))+'</div></div>'
      + '<div class="pk-right">'+adv+'<div class="pk-cp">💪 '+fmtCP(spiritCP(key))+'</div></div>'
      + '<button class="pk-info" data-pk-info="'+key+'">ⓘ</button>'
      + '</div>';
  });
  if(options.length===0) html = rosterFilter ? '<div class="sub">출전 명단에 남은 정령 없음 — 다른 슬롯에서 이동</div>' : '<div class="sub" style="text-align:center;">보유 정령 없음 — 소환 먼저</div>';
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" id="modalBg"><div class="modal" style="position:relative;">'
    + '<button class="close-x" id="modalClose">✕</button><h3>정령 배치 · '+(slotIdx<3?'전열':'후열')+'</h3>' + html + '</div></div>';
  bindModalClose(returnFn);
  document.querySelectorAll('[data-pk-sort]').forEach(el=>el.addEventListener('click', ()=>{ state.pickSort = el.dataset.pkSort; save(); showSlotPicker(slotIdx, returnFn, enemyEl, rosterFilter, lineup); }));
  document.querySelectorAll('[data-pk-info]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); const k = el.dataset.pkInfo; showUnitKitInfo(makeBattleUnit('me', 0, k, unitAtk(k), ALLY_HP_MULT)); }));
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.pick;
      const free = ownedCount(key) - usedCountExcluding(key, slotIdx);
      if(free>0){
        state.formation[slotIdx] = key;
        save(); returnFn();
        return;
      }
      const sourceSlots = [];
      state.formation.forEach((k,idx)=>{ if(idx!==slotIdx && k===key) sourceSlots.push(idx); });
      if(sourceSlots.length<=1){
        if(sourceSlots.length===1) state.formation[sourceSlots[0]] = null;
        state.formation[slotIdx] = key;
        save(); returnFn();
      }else{
        showMoveSourcePicker(key, slotIdx, sourceSlots, returnFn);
      }
    });
  });
  const clearBtn = document.getElementById('clearSlot');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.formation[slotIdx] = null; save(); returnFn();
  });
}

// 모달을 새로 통째로 갈아끼우지 않고 기존 화면 위에 그냥 얹기 때문에, 닫으면 원래 있던 화면(스테이지 준비창, 챕터맵 등)이 그대로 남아있음.
// refreshBody를 주면, 안에서 보상을 받아도 팝업이 닫히지 않고 그 함수로 내용만 다시 그려서 계속 열어둠(뒤쪽 화면 갱신은 onClaim이 담당).
function openInfoOverlay(title, bodyHtml, onClaim, refreshBody){
  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  overlay.style.zIndex = '200';
  overlay.innerHTML = '<div class="modal" style="position:relative; max-width:280px;">'
    + '<button class="close-x" id="infoOverlayClose">✕</button>'
    + '<h3 style="text-align:center; margin-top:0;">'+title+'</h3>'
    + '<div id="infoOverlayBody">' + bodyHtml + '</div></div>';
  document.body.appendChild(overlay);
  const closeOverlay = ()=> overlay.remove();
  overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay) closeOverlay(); });
  overlay.querySelector('#infoOverlayClose').addEventListener('click', closeOverlay);
  function bindOverlayClaims(){
    overlay.querySelectorAll('[data-claim-reward]').forEach(btn=>{
      if(btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', ()=>{
        if(btn.dataset.claimGroup){
          // (v191) 등급 보상은 어느 칸을 누르든 받을 수 있는 등급을 한 번에 — 알림도 합산해서 1번
          const ids = pendingRewardsFor(btn.dataset.claimGroup).map(r=>r.id);
          const r = claimManyPending(ids);
          if(r.n>0) toastReward({essence:r.essence, stone:r.stone, items:r.items}, '🏅 등급 보상 '+r.n+'개 획득');
        }else{
          claimPendingReward(btn.dataset.claimReward);
        }
        sfx('claim');
        if(onClaim) onClaim();
        if(refreshBody){
          document.getElementById('infoOverlayBody').innerHTML = refreshBody();
          bindOverlayClaims();
        }else{
          closeOverlay();
        }
      });
    });
  }
  bindOverlayClaims();
}

    else addStageGradeRewards(i, 0, gradeRank[g]);
  });
  state.stageRewardsV179 = true;
}
function sanitizeState(){
  const s = state, fin = v => typeof v==='number' && isFinite(v);
  ['essence','enhanceStone','towerBest','towerBestPower','expeditionBestReach'].forEach(k=>{ s[k] = fin(s[k]) ? Math.max(0, s[k]) : 0; });
  ['lifetimeSummons','lifetimeFusions','lifetimeExpeditionClears','lifetimeRerolls','lifetimeEquipSummons','lifetimeEquipFusions'].forEach(k=>{ s[k] = fin(s[k]) ? Math.max(0, Math.floor(s[k])) : 0; });
  ['summon','rare','epic','equip'].forEach(k=>{ s.tickets[k] = fin(s.tickets[k]) ? Math.max(0, Math.floor(s.tickets[k])) : 0; });
  // 정령
  Object.keys(s.owned).forEach(k=>{ const v = s.owned[k]; if(!SPIRITS[k] || !fin(v) || v<0) delete s.owned[k]; else s.owned[k] = Math.floor(v); });
  Object.keys(s.discovered).forEach(k=>{ if(!SPIRITS[k] || !s.discovered[k]) delete s.discovered[k]; else s.discovered[k] = true; });
  Object.keys(s.owned).forEach(k=>{ if(s.owned[k]>0) s.discovered[k] = true; });
  Object.keys(s.enhanceLevel).forEach(k=>{ const v = s.enhanceLevel[k]; if(!SPIRITS[k] || !fin(v) || v<=0) delete s.enhanceLevel[k]; else s.enhanceLevel[k] = Math.min(Math.floor(v), maxEnhanceFor(k)); });
  s.recentSummons = s.recentSummons.filter(k=>typeof k==='string' && SPIRITS[k]).slice(0,8);
  // 정령장비
  const eks = new Set(allEquipKeys());
  Object.keys(s.equipOwned).forEach(k=>{ const v = s.equipOwned[k]; if(!eks.has(k) || !fin(v) || v<0) delete s.equipOwned[k]; else s.equipOwned[k] = Math.floor(v); });
  Object.keys(s.equipSeen).forEach(k=>{ if(!eks.has(k) || !s.equipSeen[k]) delete s.equipSeen[k]; else s.equipSeen[k] = true; });
  Object.keys(s.equipOwned).forEach(k=>{ if(s.equipOwned[k]>0) s.equipSeen[k] = true; });
  Object.keys(s.equipped).forEach(sp=>{
    const e = s.equipped[sp];
    if(!SPIRITS[sp] || !isPlainObj(e)){ delete s.equipped[sp]; return; }
    EQUIP_SLOTS.forEach(sl=>{ const k = e[sl]; if(k && (!eks.has(k) || equipInfo(k).slot!==sl)) e[sl] = null; });
  });
  // 진형(5칸), 스테이지 기록
  s.formation = Array.from({length: (Array.isArray(s.formation) && s.formation.length===GRID_SLOTS) ? GRID_SLOTS : 5}, (_,i)=> (typeof s.formation[i]==='string' && SPIRITS[s.formation[i]]) ? s.formation[i] : null);
  cleanupFormation();
  if(!TAB_IDS.includes(s.lastTab)) s.lastTab = 'summon';
  { const ov = s.openView;
    const okView = isPlainObj(ov) && ((ov.t==='stage' && Number.isInteger(ov.idx) && ov.idx>=0 && ov.idx<CHAPTER_LENGTH*MAX_CHAPTERS)
      || (ov.t==='tower' && (ov.floor===null || (Number.isInteger(ov.floor) && ov.floor>0))));
    if(!okView) s.openView = null; }
  if(s.bossFight){
    // (v158 버그수정) 보스전을 6칸 새 전투로 바꾸면서 bossFight 모양이 완전히 달라졌는데, 정제 로직은 구버전(턴제 체력소모전) 모양을 검사하고 있었음 —
    // 그래서 새로고침·재접속마다 진행 중인 보스전이 통째로 사라지고 있었음(세이브에는 있는데 로드하면서 버려짐)
    const bf = s.bossFight;
    const okBase = isPlainObj(bf) && Array.isArray(bf.roster) && Number.isInteger(bf.stageIdx) && bf.stageIdx>=0 && bf.stageIdx<CHAPTER_LENGTH*MAX_CHAPTERS && isBossStage(bf.stageIdx);
    if(okBase) bf.roster = bf.roster.map(k=> (k===null || (typeof k==='string' && SPIRITS[k])) ? k : null).slice(0,GRID_SLOTS);
    if(!okBase || !bf.roster.some(Boolean)) s.bossFight = null;
    else{
      if(!isPlainObj(bf.unitHp)) bf.unitHp = {};
      Object.keys(bf.unitHp).forEach(k=>{
        const h = bf.unitHp[k];
        if(!SPIRITS[k] || !isPlainObj(h) || !fin(h.maxHp) || h.maxHp<=0 || !fin(h.hp)) delete bf.unitHp[k];
        else{ h.maxHp = Math.max(1, Math.round(h.maxHp)); h.hp = Math.max(0, Math.min(h.maxHp, Math.round(h.hp))); }
      });
      bf.formationSnapshot = Array.from({length:GRID_SLOTS}, (_,k)=> (Array.isArray(bf.formationSnapshot) && typeof bf.formationSnapshot[k]==='string' && SPIRITS[bf.formationSnapshot[k]]) ? bf.formationSnapshot[k] : null);
      bf.totalRounds = (fin(bf.totalRounds) && bf.totalRounds>=0) ? Math.floor(bf.totalRounds) : 0;
      bf.formationInit = !!bf.formationInit;
    }
  }
  { const t = s.expTickets;
    if(!isPlainObj(t)) s.expTickets = { count: EXP_TICKET_MAX, lastTick: Date.now(), buyDate: todayStr(), buys: 0 };
    else{
      t.count = (fin(t.count) ? Math.min(EXP_TICKET_MAX, Math.max(0, Math.floor(t.count))) : EXP_TICKET_MAX);
      t.lastTick = (fin(t.lastTick) && t.lastTick<=Date.now()) ? t.lastTick : Date.now();
      if(typeof t.buyDate!=='string') t.buyDate = todayStr();
      t.buys = fin(t.buys) ? Math.min(EXP_TICKET_BUY_PRICES.length, Math.max(0, Math.floor(t.buys))) : 0;
    } }
  if(!(fin(s.saveRev) && s.saveRev>=0)) s.saveRev = 0;
  { // (v170) 룬 관련 필드 정리
    const fin2 = v=> typeof v==='number' && isFinite(v);
    s.shards = (fin2(s.shards) && s.shards>=0) ? Math.floor(s.shards) : 0;
    s.runePity = (fin2(s.runePity) && s.runePity>=0) ? Math.min(0.5, s.runePity) : 0;
    s.lifetimeEngraves = (fin2(s.lifetimeEngraves) && s.lifetimeEngraves>=0) ? Math.floor(s.lifetimeEngraves) : 0;
    const R = {}; if(s.runes && typeof s.runes==='object' && !Array.isArray(s.runes)) Object.keys(s.runes).forEach(k=>{ if(SPIRITS[k] && runeValid(s.runes[k])) R[k] = { id:s.runes[k].id, tier:s.runes[k].tier }; }); s.runes = R;
    s.runeInv = Array.isArray(s.runeInv) ? s.runeInv.filter(runeValid).map(r=>({id:r.id, tier:r.tier})).slice(0, RUNE_INV_MAX) : [];
    s.raidGems = (fin2(s.raidGems) && s.raidGems>=0) ? Math.floor(s.raidGems) : 0;
    if(Array.isArray(s.runeStones) && s.runeStones.length) s.raidGems += s.runeStones.length*6; // (v172) 예전 룬석(개봉형)은 재화로 바꿔줌
    s.runeStones = [];
    s.runeUpStones = (fin2(s.runeUpStones) && s.runeUpStones>=0) ? Math.floor(s.runeUpStones) : 0;
    if(!(s.raidTickets && typeof s.raidTickets==='object' && fin2(s.raidTickets.count) && fin2(s.raidTickets.lastTick))) s.raidTickets = null;
    else s.raidTickets.count = Math.max(0, Math.min(RAID_TICKET_MAX, Math.floor(s.raidTickets.count)));
    if(!(s.raidShopBuys && typeof s.raidShopBuys==='object' && typeof s.raidShopBuys.week==='string' && s.raidShopBuys.n && typeof s.raidShopBuys.n==='object')) s.raidShopBuys = null;
    if(typeof s.homeSpirit!=='string' || !SPIRITS[s.homeSpirit]) s.homeSpirit = null;
    if(Array.isArray(s.duelDeck)) s.duelDeck = s.duelDeck.slice(0,6).map(k=> (typeof k==='string' && SPIRITS[k]) ? k : null); else s.duelDeck = null;
    { const P = {}; if(s.raidProgress && typeof s.raidProgress==='object') Object.keys(s.raidProgress).forEach(k=>{ if(raidBossById(k) && Array.isArray(s.raidProgress[k])) P[k] = s.raidProgress[k].filter(d=>RAID_DIFFS.some(x=>x.id===d)); }); s.raidProgress = P; }
    if(!raidBossById(s.raidBossSel)) s.raidBossSel = null;
  }
  if(s.skillFight && (s.skillFight.mode==='raid' || s.skillFight.mode==='duel')) s.skillFight = null; // (v165) 레이드는 방 문서가 원본 — 재접속 시 거기서 다시 받음
  if(s.skillFight){
    // (v158 버그수정) v145 시절(스테이지 3 전용) 검사만 있어서 그 뒤로 생긴 일반 스테이지 전체·보스·출정 전투가
    // 새로고침할 때마다 전부 사라지고 있었음. 각 모드 모양을 각각 검사하도록 다시 작성 (v163: 레이드 8칸도 포함)
    const sf = s.skillFight;
    const maxIdx = (sf && sf.mode==='raid') ? RAID_ALLY_SLOTS : GRID_SLOTS;
    const uOk = u => isPlainObj(u) && ['me','enemy'].includes(u.side) && Number.isInteger(u.idx) && u.idx>=0 && u.idx<(u.side==='me'?maxIdx:GRID_SLOTS)
      && typeof u.key==='string' && SPIRITS[u.key] && typeof u.line==='string' && LINE_KITS[u.line] && Number.isInteger(u.g) && u.g>=0 && u.g<=4
      && fin(u.hp) && fin(u.maxHp) && u.maxHp>0 && fin(u.atk) && fin(u.cd1) && fin(u.cd2) && typeof u.alive==='boolean' && isPlainObj(u.st);

    let modeOk = false;
    if(sf && sf.mode==='boss'){
      modeOk = Number.isInteger(sf.stageIdx) && sf.stageIdx>=0 && sf.stageIdx<CHAPTER_LENGTH*MAX_CHAPTERS && isBossStage(sf.stageIdx) && Number.isInteger(sf.wave) && sf.wave>=1 && sf.wave<=BOSS_WAVE_COUNT;

    }else if(sf){

    }
    const ok = isPlainObj(sf) && modeOk && fin(sf.round) && sf.round>=1
      && Array.isArray(sf.myUnits) && sf.myUnits.length>0 && sf.myUnits.every(u=>uOk(u) && u.side==='me')
      && Array.isArray(sf.enemyUnits) && sf.enemyUnits.length>0 && sf.enemyUnits.every(u=>uOk(u) && u.side==='enemy')
      && ['acting','roundEnd'].includes(sf.phase) && fin(sf.queuePos) && Array.isArray(sf.queue) && sf.queue.every(qOk);
    if(!ok) s.skillFight = null;
    else{ if(!isPlainObj(sf.lastFx)) sf.lastFx = null; if(!fin(sf.fxSeq)) sf.fxSeq = 0; if(!Array.isArray(sf.log)) sf.log = []; }
  }
  if(!isPlainObj(s.towerFormations)) s.towerFormations = {};
  Object.keys(s.towerFormations).forEach(f=>{
    const n = Number(f), a = s.towerFormations[f];
    if(!Number.isInteger(n) || n<1 || !Array.isArray(a)){ delete s.towerFormations[f]; return; }
    s.towerFormations[f] = Array.from({length:5}, (_,k)=> (typeof a[k]==='string' && SPIRITS[a[k]]) ? a[k] : null);
  });
  if(!isPlainObj(s.stageFormations)) s.stageFormations = {};
  Object.keys(s.stageFormations).forEach(i=>{
    const n = Number(i), f = s.stageFormations[i];
    if(!Number.isInteger(n) || n<0 || n>=CHAPTER_LENGTH*MAX_CHAPTERS || !Array.isArray(f)){ delete s.stageFormations[i]; return; }
    s.stageFormations[i] = Array.from({length:5}, (_,k)=> (typeof f[k]==='string' && SPIRITS[f[k]]) ? f[k] : null);
  });
  Object.keys(s.stageBest).forEach(i=>{ const n = Number(i); if(!Number.isInteger(n) || n<0 || n>=CHAPTER_LENGTH*MAX_CHAPTERS || !['C','B','A','S'].includes(s.stageBest[i])) delete s.stageBest[i]; });
  // 대기 보상: 깨진 항목·중복 제거
  const seen = new Set();
  s.pendingRewards = s.pendingRewards.filter(r=>{
    if(!isPlainObj(r) || typeof r.id!=='string' || seen.has(r.id)) return false;
    seen.add(r.id);
    r.essence = fin(r.essence) ? Math.max(0, r.essence) : 0; r.stone = fin(r.stone) ? Math.max(0, r.stone) : 0;
    if(typeof r.tab!=='string') r.tab = 'stage'; if(typeof r.icon!=='string') r.icon = '🎁'; if(typeof r.label!=='string') r.label = r.id;
    // (v184) 보상 종류(id)에 맞는 탭으로 바로잡음 — 예전 세이브의 업적 보상은 'summon' 탭으로 저장돼 소환 탭에 받을 것 없는 빨간 점이 떴음
    { const id = r.id; r.tab = id.indexOf('achieve_')===0 ? 'achieve' : id.indexOf('tower_')===0 ? 'tower' : id.indexOf('expedition_')===0 ? 'expedition' : (/^(stage_|boss_|ch\d+_pct)/.test(id) ? 'stage' : r.tab); }
    if(r.items && !isPlainObj(r.items)) r.items = null;
    else if(r.items){ Object.keys(r.items).forEach(k=>{ if(!TICKET_INFO[k] || !fin(r.items[k]) || r.items[k]<=0) delete r.items[k]; else r.items[k] = Math.floor(r.items[k]); }); if(!Object.keys(r.items).length) r.items = null; }
    else r.items = null;
    return true;
  });
  // 설정·일일 기록·화로·출정
  s.settings.bgmVolume = fin(s.settings.bgmVolume) ? Math.min(1, Math.max(0, s.settings.bgmVolume)) : 0.3;
  s.settings.sfxVolume = fin(s.settings.sfxVolume) ? Math.min(1, Math.max(0, s.settings.sfxVolume)) : 0.35;
  ['summons','fusions','stagesCleared','equipSummons'].forEach(k=>{ s.dailyStats[k] = fin(s.dailyStats[k]) ? Math.max(0, Math.floor(s.dailyStats[k])) : 0; });
  if(typeof s.dailyStats.date!=='string') s.dailyStats.date = todayStr();
  if(typeof s.questsClaimed.date!=='string') s.questsClaimed.date = todayStr();
  if(!fin(s.hearth.lastCollect) || s.hearth.lastCollect>Date.now()) s.hearth.lastCollect = Date.now(); // 시계를 미래로 돌렸다 되돌려도 화로가 멈추지 않게
  Object.keys(HEARTH_UPGRADES).forEach(k=>{ const v = s.hearthUpgrades[k]; s.hearthUpgrades[k] = fin(v) ? Math.min(HEARTH_UPGRADES[k].maxLv, Math.max(0, Math.floor(v))) : 0; });
  { const ex = s.expedition;
    const roomOk = n=> isPlainObj(n) && ['battle','event','boss','?'].includes(n.type)
      && (n.type!=='battle' && n.type!=='boss' || (Array.isArray(n.enemyComp) && n.enemyComp.length===GRID_SLOTS && n.enemyComp.every(e=>ELEMENTS.includes(e))))
      && (!n.resolvedType || ['event','puzzle'].includes(n.resolvedType));
    if(ex!==null && !(isPlainObj(ex) && fin(ex.currentIndex) && ex.currentIndex>=0 && ex.currentIndex<=EXPEDITION_NODE_COUNT
        && (ex.currentRoom===null || ex.currentRoom===undefined || roomOk(ex.currentRoom))
        && (ex.roomChoices===null || ex.roomChoices===undefined || (Array.isArray(ex.roomChoices) && ex.roomChoices.every(roomOk))))) s.expedition = null; }
  if(s.expedition){ // (v124) 예전 런에는 사이클·킵 정보가 없음 / (v127) 값 형식 전부 검증 / (v164) 방 선택형 구조로 변경
    const e = s.expedition;
    const cleanRoom = n=>{
      if(!n) return n;
      if(n.enemyRarity && !(Array.isArray(n.enemyRarity) && n.enemyRarity.length>=GRID_SLOTS && n.enemyRarity.every(x=> isPlainObj(x) && RARITY_ORDER.includes(x.rarity) && VARIANTS.includes(x.variant)))) delete n.enemyRarity;
      if(n.eventId && !EXPEDITION_EVENTS.some(ev=>ev.id===n.eventId)) delete n.eventId;
      if(n.resolvedType==='puzzle' && !(Array.isArray(n.cardOrder) && n.cardOrder.length===3 && n.cardOrder.every(i=>Number.isInteger(i) && i>=0 && i<PUZZLE_CARD_OUTCOMES.length))) n.cardOrder = [0,1,2];
      return n;
    };
    e.currentRoom = cleanRoom(e.currentRoom||null);
    if(Array.isArray(e.roomChoices)) e.roomChoices = e.roomChoices.map(cleanRoom); else e.roomChoices = null;
    e.currentIndex = Math.floor(e.currentIndex);
    e.cycle = (fin(e.cycle) && e.cycle>=1) ? Math.floor(e.cycle) : 1;
    e.keeps = (fin(e.keeps) && e.keeps>=0) ? Math.min(Math.floor(e.keeps), e.cycle-1) : 0;
    e.totalCleared = (fin(e.totalCleared) && e.totalCleared>=0) ? Math.floor(e.totalCleared) : e.currentIndex;
    if(!(fin(e.powerMult) && e.powerMult>=1)) e.powerMult = 1;
    if(!(fin(e.rewardMult) && e.rewardMult>0)) e.rewardMult = 1;
    e.pendingKeep = e.currentIndex >= EXPEDITION_NODE_COUNT; // 사이클을 끝낸 상태 = 수령/킵 선택 대기
    if(!isPlainObj(e.pot)) e.pot = {essence:0, stone:0, equip:0};
    e.pot.essence = fin(e.pot.essence) ? Math.max(0, Math.round(e.pot.essence)) : 0;
    e.pot.stone = fin(e.pot.stone) ? Math.max(0, Math.round(e.pot.stone)) : 0;
    e.pot.equip = fin(e.pot.equip) ? Math.max(0, Math.round(e.pot.equip)) : 0;
    const buffOk = Array.isArray(e.pendingBuffChoice) && e.pendingBuffChoice.length>0 && e.pendingBuffChoice.every(id=> EXPEDITION_BUFFS.some(b=>b.id===id));
    if(!buffOk || e.pendingKeep) e.pendingBuffChoice = null;
  }
  migrateStageRewardsV179();
  Object.keys(state.stageBest||{}).forEach(k=>grantSpecialStageBonus(Number(k))); // (v185) 예전에 깨고 못 받은 특수 규칙 보너스 보충
}

sanitizeState();
// (v122) 앱을 껐다 켜도 하던 화면으로: 마지막 탭 → 진행 중인 보스전(결과 화면 포함) → 열어둔 탑/스테이지 준비창
function resumeLastView(){
  if(!state.skillFight) unmountBattleScreen(); // 세이브가 바뀌어(클라우드 복원 등) 전투가 없으면 전장 화면을 걷어냄
  activeTab = 'home'; // (v170) 앱을 켜면 항상 홈(탐험 모드)부터
  if(state.bossFight) activeTab = 'stage';
  render();
  if(state.skillFight){ activeTab = 'stage'; render(); skillSel.key = null; showSkillStageScreen(); return; } // (v158 버그수정) 보스전도 skillFight로 통일 관리되므로 이 한 줄이 보스 재개까지 다 처리 — 아래 구버전 bossFight 분기는 도달 불가라 제거
  const v = state.openView;
  if(!v) return;
  if(v.t==='stage'){ if(isBossStage(v.idx)) showBossPrepModal(v.idx); else { applyStageFormation(v.idx); showSkillStagePrepModal(v.idx); } }
  else if(v.t==='tower'){ viewingTowerFloor = v.floor || null; showTowerPrepModal(); }
}
installModalScrollKeeper();
resumeLastView();
raidInitNet();
</script>
