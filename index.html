function checkSkillStageOutcome(sf){
  if(sf.mode==='boss') return checkBossWaveOutcome(sf);
  if(sf.mode==='expedition') return checkExpeditionOutcome(sf);
  if(sf.mode==='raid') return checkRaidOutcome(sf);
  if(sf.mode==='duel'){ if(sf.result) return true; if(!aliveUnits(sf.enemyUnits).length){ sf.result = {win:true, rounds:sf.round}; return true; } if(!aliveUnits(sf.myUnits).length){ sf.result = {win:false, rounds:sf.round}; return true; } return false; }
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){
    const prevBest = state.stageBest[sf.stageIdx] || null;
    sf.result = { win:true, rounds: sf.round, prevBest };
    sf.result.info = resolveSkillStageBattle(sf.stageIdx, sf.round, !!sf.specialMet);
    return true;
  }
  if(!aliveUnits(sf.myUnits).length){ sf.result = { win:false, rounds: sf.round }; return true; }
  return false;
}

// ---------- 행동 순서 ----------
function buildQueue(sf){
  const e = [];
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.alive) e.push({ side:u.side, idx:u.idx, speed:effSpeed(u), bound:!!u.st.bind }); });
  e.sort((x,y)=>{ if(x.bound!==y.bound) return x.bound?1:-1; if(y.speed!==x.speed) return y.speed-x.speed; if(x.side!==y.side) return x.side==='me'?-1:1; return x.idx-y.idx; });
  [...sf.myUnits, ...sf.enemyUnits].forEach(u=>{ if(u.st.bind) delete u.st.bind; });
  return e.map(x=>({ side:x.side, idx:x.idx, speed:x.speed }));
}
function startRoundQueue(sf){ sf.queue = buildQueue(sf); sf.queuePos = 0; sf.phase = 'acting'; }
// 지금 차례: 'me' | 'enemy' | 'end'. 쓰러진 유닛은 건너뛰고, 빙결이면 한 번 쉬게 함
function settleQueue(sf){
  while(sf.queuePos < sf.queue.length){
    const e = sf.queue[sf.queuePos], u = unitAt(sf, e.side, e.idx);
    if(u && u.alive){
      if(u.st.freeze){ delete u.st.freeze; pushLog(sf, skillUnitName(u.side, u)+' 빙결로 쉼'); sf.queuePos++; continue; }
      if(u.groggy){ pushLog(sf, '<img class="uic" src="assets/ui/ic_groggy.webp" alt=""> '+skillUnitName(u.side, u)+' 그로기로 행동 불가'); sf.queuePos++; continue; } // (v179)
      return e.side;
    }
    sf.queuePos++;
  }
  return 'end';
}
// 라운드 시작: 쿨다운 감소 · 지속 효과(화상·독·재생) · 지속 시간 감소 · 패시브(맑은 물·서약)
function roundStartEffects(sf){
  sf.myUnits.concat(sf.enemyUnits).forEach(u=>{ if(u.alive && u.st.shield>0){ u.st.shieldR = (u.st.shieldR||2) - 1; if(u.st.shieldR<=0){ u.st.shield = 0; delete u.st.shieldR; } } }); // (v173) 보호막 지속시간
  groggyRoundStart(sf); // (v179) 그로기 해제·게이지 회복(기믹보다 먼저)
  if(sf.mode==='boss') applyBossGimmick(sf);
  if(sf.mode==='raid') applyRaidGimmicks(sf);
  runeRoundStart(sf);
  const hits = [];
  const all = [...sf.myUnits, ...sf.enemyUnits];
  all.forEach(u=>{
    if(!u.alive) return;
    u.cd1 = Math.max(0, u.cd1-1); u.cd2 = Math.max(0, u.cd2-1);
    const s = u.st;
    let loss = 0;
    if(s.burn){ loss += s.burn * (s.burnDmg||0); }
    if(s.poison){ loss += Math.round(u.maxHp * s.poison.pct); }
    if(loss>0){ u.hp = Math.max(0, u.hp - loss); hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:loss, dot:true }); if(u.hp<=0){ killUnit(sf, u); return; } }
    if(s.regen){ const b = u.hp; u.hp = Math.min(u.maxHp, u.hp + healAmount(u, u.maxHp*s.regen.v)); if(u.hp>b) hits.push({ side:u.side, idx:u.idx, kind:'heal', amount:u.hp-b }); }
    ['slow','haste','curse','web','buff','regen','reflect','guard'].forEach(k=>{ if(s[k]){ s[k].r--; if(s[k].r<=0) delete s[k]; } });
    if(s.poison){ s.poison.r--; if(s.poison.r<=0) delete s.poison; }
    if(s.taunt){ s.taunt--; if(s.taunt<=0) delete s.taunt; }
  });
  ['me','enemy'].forEach(side=>{
    const list = aliveUnits(sideUnits(sf, side));
    list.forEach(p=>{
      if(p.line==='water_a' && unitPG(p)>=1 && list.length){
        const low = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
        const b = low.hp; low.hp = Math.min(low.maxHp, low.hp + healAmount(low, low.maxHp*[0,.03,.04,.05,.06][unitPG(p)]));
        if(low.hp>b) hits.push({ side, idx:low.idx, kind:'heal', amount:low.hp-b });
      }
      if(p.line==='light_b' && unitPG(p)>=1){
        const slow = aliveUnits(sideUnits(sf, side)).reduce((x,y)=> effSpeed(y) < effSpeed(x) ? y : x);
        slow.st.haste = { v: Math.max(slow.st.haste ? slow.st.haste.v : 0, [0,5,6,8,10][unitPG(p)]), r: 1 };
      }
    });
  });
  return hits;
}

// ---------- 적 AI ----------
function aiPickFoeTarget(sf, a){
  const foe = foeOf(a.side);
  const pool = frontFirst(sideUnits(sf, foe), sideWidth(sf, foe));
  const taunt = aliveUnits(sideUnits(sf, foe)).filter(u=>u.st.taunt);
  const list = taunt.length ? taunt : pool;
  if(!list.length) return null;
  return list.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
}
function aiChooseAction(sf, a){
  const kit = kitOf(a), own = aliveUnits(sideUnits(sf, a.side));
  for(const act of (a.isWard ? ['basic'] : ['s2','s1','basic'])){ // (v259) 결계석은 기본 공격만
    if(!skillAvailable(a, act)) continue;
    const sk = act==='basic' ? null : kit[act];
    const kind = sk ? sk.kind : 'harm';
    if(sk && sk.self){ if(a.st.taunt) continue; return { act, side:a.side, idx:a.idx }; } // (v192) 이미 도발 중이면 아껴 둠
    if(kind==='harm'){
      const t = aiPickFoeTarget(sf, a); if(!t) return null;
      if(a.line==='dark_a' && act==='s2' && t.hp/t.maxHp>0.3) continue; // 처형은 막타용
      if(a.line==='fire_b' && act==='s2' && !(t.st.burn>0)) continue;   // 발화는 화상이 있을 때만
      if(a.line==='dark_b' && act==='s2' && !['shield','haste','buff','regen','reflect','ward','taunt'].some(k=>t.st[k])) continue;
      return { act, side:t.side, idx:t.idx };
    }
    if(kind==='heal'){
      const low = own.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
      if(low.hp/low.maxHp < 0.7) return { act, side:a.side, idx:low.idx };
      continue;
    }
    // 보호막·강화: 전열 우선, 체력 낮은 아군 / 강화는 공격력 높은 아군
    const front = own.filter(u=>isFrontRow(u.idx, sideWidth(sf, a.side)));
    const pool = front.length ? front : own;
    const t = kind==='buff' ? own.reduce((x,y)=> y.atk>x.atk ? y : x) : pool.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x);
    return { act, side:a.side, idx:t.idx };
  }
  return null;
}

// ---------- 진행 ----------
function recommendEnemyTarget(sf, a){
  let best = null, bestScore = -Infinity;
  validEnemyTargets(sf).forEach(idx=>{
    const d = unitAt(sf, 'enemy', idx), tm = typeMult(a.element, d.element);
    const est = a.atk * tm;
    const score = (est >= d.hp + (d.st.shield||0) ? 1000 : 0) + tm*100 - d.hp/d.maxHp*10;
    if(score > bestScore){ bestScore = score; best = idx; }
  });
  return best;
}
let skillLastAct = {}; // (v175) 붕스타 방식: 정령마다 지난 차례에 쓴 행동을 기억해 다음 차례 기본 선택으로
function lastActKey(sf, a){ return (sf.mode||'')+':'+a.idx+':'+a.key; }
function defaultActFor(sf, a){
  const r = skillLastAct[lastActKey(sf, a)];
  if(r && skillAvailable(a, r)) return r;
  return (isSupportUnit(a) && skillAvailable(a, 's1')) ? 's1' : 'basic';
}
function retargetForAct(sf, a, act){ // 고른 행동의 종류에 맞게 대상 편을 바꿈(지원기 → 아군, 공격기 → 적)
  const sk = unitSkill(a, act), harm = !sk || sk.kind==='harm';
  if(sk && sk.self){ skillSel.side = a.side; skillSel.idx = a.idx; return; } // (v192) 자기 몸에만 거는 스킬
  if(harm && skillSel.side!=='enemy'){ const st = skillSel.sticky; skillSel.side = 'enemy'; skillSel.idx = (st!==undefined && st!==null && skillTargetable(sf,'enemy',st)) ? st : recommendEnemyTarget(sf, a); }
  else if(!harm && skillSel.side!==a.side){ skillSel.side = a.side; skillSel.idx = autoAllyTarget(sf, a); }
}
function isSupportUnit(a){ const k = kitOf(a); return k.s1.kind!=='harm' && k.s2.kind!=='harm'; }
function autoAllyTarget(sf, a){ // 회복·보호는 체력 비율이 가장 낮은 아군(뿌리내리기는 전열 우선), 강화는 공격력이 가장 높은 아군
  const own = aliveUnits(sideUnits(sf, a.side)); if(!own.length) return a.idx;
  const kind = kitOf(a).s1.kind;
  if(kind==='buff') return own.reduce((x,y)=> y.atk>x.atk ? y : x).idx;
  let pool = own;
  if(a.line==='wood_a'){ const f = own.filter(u=>isFrontRow(u.idx, sideWidth(sf, a.side))); if(f.length) pool = f; }
  return pool.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x).idx;
}
function ensureSkillSelection(sf, a){
  const key = sf.stageIdx+':'+sf.round+':'+sf.queuePos;
  if(skillSel.key === key && skillTargetable(sf, skillSel.side, skillSel.idx)) return;
  const sticky = skillSel.sticky;
  const act0 = skillSel.key===key ? skillSel.act : defaultActFor(sf, a);
  const armed0 = skillSel.key===key ? !!skillSel.armed : true; // (v178) 미리 선택된 행동은 한 번 누르면 바로 시전
  const manual0 = skillSel.key===key ? !!skillSel.manual : false;
  if(isSupportUnit(a)) skillSel = { key, side: a.side, idx: autoAllyTarget(sf, a), sticky, act: act0, armed: armed0, manual: manual0 };
  else if(sticky!==undefined && sticky!==null && skillTargetable(sf, 'enemy', sticky)) skillSel = { key, side:'enemy', idx: sticky, sticky, act: act0, armed: armed0, manual: manual0 };
  else skillSel = { key, side:'enemy', idx: recommendEnemyTarget(sf, a), sticky: null, act: act0, armed: armed0, manual: manual0 };
  retargetForAct(sf, a, skillSel.act);
}
function myTurnAction(act){
  if(Date.now() < skillFxBusyUntil) return;
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx); if(!a || !a.alive) return;
  if(!skillAvailable(a, act)) return;
  ensureSkillSelection(sf, a);
  if(!skillTargetable(sf, skillSel.side, skillSel.idx)) return;
  if(sf.mode==='raid' || (sf.mode==='duel' && raidIsNet())){
    if(!raidMine(a.idx)) return; // 팀원 정령은 팀원만 조작
    if(raidNet.role==='guest'){ skillLastAct[lastActKey(sf, a)] = act; raidGuestSubmit(act, skillSel.side, skillSel.idx); return; }
  }
  skillLastAct[lastActKey(sf, a)] = act;
  performAction(sf, a, act, skillSel.side, skillSel.idx);
  skillSel.key = null;
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function stepEnemyTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='enemy'){ showSkillStageScreen(); return; }
  const a = unitAt(sf, 'enemy', sf.queue[sf.queuePos].idx);
  const c = aiChooseAction(sf, a);
  if(c) performAction(sf, a, c.act, c.side, c.idx);
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function nextSkillRound(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  sf.round += 1;
  pushLog(sf, '라운드 '+sf.round);
  const hits = roundStartEffects(sf);
  setFx(sf, { kind:'round', round: sf.round, hits });
  if(!checkSkillStageOutcome(sf)) startRoundQueue(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
// (v147) 자동전투: 내 턴도 AI가 대신 행동. 2배속: 대기 시간 절반
function skillSpeedMult(){ return state.skillSpeed2x ? 0.5 : 1; }
function stepMyAutoTurn(){
  const sf = state.skillFight; if(!sf || sf.result) return;
  if(settleQueue(sf)!=='me') return;
  const a = unitAt(sf, 'me', sf.queue[sf.queuePos].idx);
  if(a && a.alive){ const c = aiChooseAction(sf, a); if(c) performAction(sf, a, c.act, c.side, c.idx); }
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function pumpSkillFight(){
  const sf = state.skillFight;
  if(!sf || sf.result || skillPumpTimer || !document.getElementById('battleScreen')) return;
  if((sf.mode==='raid' || (sf.mode==='duel' && raidIsNet())) && raidNet.role==='guest'){ raidGuestPump(sf); return; } // 팀원 화면은 판정하지 않고 방장 상태만 받아 그림
  const next = settleQueue(sf);
  const wait = Math.max(0, skillIntroUntil - Date.now(), skillFxBusyUntil - Date.now());
  if(next==='me'){
    if(sf.mode==='raid' && !raidMine(sf.queue[sf.queuePos].idx)){ // 팀원 차례: 입력 대기(끊겼으면 AI가 대신)
      if(raidPartnerGone()) skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
      return;
    }
    if(!state.skillAuto) return;
    skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepMyAutoTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult());
    return;
  }
  if(next==='enemy'){
    if(sf.mode==='duel' && raidIsNet() && !raidPartnerGone()) return; // 결투 상대 차례: 상대 입력 대기(끊기면 AI)
    skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; stepEnemyTurn(); }, wait + SKILL_ENEMY_STEP_MS*skillSpeedMult()); return; }
  if(sf.round >= SKILL_ROUND_CAP){ sf.result = { win:false, rounds: sf.round, timeout:true }; if(sf.mode==='raid') raidGrantReward(sf); save(); showSkillStageScreen(); afterFightMutation(); return; }
  sf.phase = 'roundEnd';
  skillPumpTimer = setTimeout(()=>{ skillPumpTimer = null; nextSkillRound(); }, wait + SKILL_ROUND_GAP_MS*skillSpeedMult());
}
function endSkillStageFight(){
  clearTimeout(skillPumpTimer); skillPumpTimer = null;
  state.skillFight = null; skillSel.key = null; save();
  unmountBattleScreen();
}

// (v174) 스킬 범위: 한 번 누르면 범위를 전장에 표시(공격 빨강·약화 보라·지원 초록), 한 번 더 누르면 사용
function skillAreaCells(sf, a, act, tSide, tIdx){
  { const sk = unitSkill(a, act); if(sk && sk.self) return new Set([a.side+':'+a.idx]); }
  const c = JSON.parse(JSON.stringify(sf)), rnd = Math.random; Math.random = ()=>0.999;
  let C; try{ C = performAction(c, unitAt(c, a.side, a.idx), act, tSide, tIdx); } catch(e){ C = {hits:[]}; } finally { Math.random = rnd; }
  const set = new Set();
  C.hits.forEach(h=>{ if(h.side===a.side && h.idx===a.idx && !(tSide===a.side && tIdx===a.idx)) return; set.add(h.side+':'+h.idx); });
  set.add(tSide+':'+tIdx);
  return set;
}
function skillPreview(sf, a, act, tSide, tIdx){
  const c = JSON.parse(JSON.stringify(sf)), rnd = Math.random;
  Math.random = ()=>0.999;
  let C;
  try{ C = performAction(c, unitAt(c, a.side, a.idx), act, tSide, tIdx); } finally { Math.random = rnd; }
  const t0 = unitAt(sf, tSide, tIdx), t1 = unitAt(c, tSide, tIdx);
  const dmg = C.hits.filter(h=>h.kind==='dmg' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const heal = C.hits.filter(h=>h.kind==='heal' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const shield = C.hits.filter(h=>h.kind==='shield' && h.side===tSide && h.idx===tIdx).reduce((x,h)=>x+h.amount, 0);
  const others = new Set(C.hits.filter(h=>!(h.side===tSide && h.idx===tIdx) && !(h.side===a.side && h.idx===a.idx)).map(h=>h.side+h.idx)).size;
  const parts = [];
  if(dmg) parts.push(dmg+' 피해');
  if(heal) parts.push('+'+heal+' 회복');
  if(shield) parts.push('<img class="uic" src="assets/ui/ic_shield.webp" alt="">'+shield);
  if(!parts.length){ const st = C.hits.find(h=>h.kind==='status' && h.side===tSide && h.idx===tIdx); if(st) parts.push(st.text); }
  if(others) parts.push('+'+others+'명');
  const kill = !!(t0 && t0.alive && t1 && !t1.alive);
  return { text: parts.join(' · ') || '효과 없음', kill, dmg };
}

function groggyRuleOf(sf, b){ if(!b || !b.isBoss) return null; return GROGGY_RULES[b.gimmick || (sf.mode==='raid' ? sf.raidBossId : '')] || null; }

function groggyAdd(sf, b, delta){

function spiritMaxHpGrid(key){ const r = spiritRune(key); return Math.max(1, Math.round(unitAtk(key)*ALLY_HP_MULT*armorMult(key)*((r && r.id==='hp' && r.tier!=='boss') ? 1+runeVal(r) : 1))); } // 새 전투 체력 스케일 기준(그리드 전투 전용, 기존 spiritMaxHp와 별개)
// (v152) 이정민님 피드백: 3웨이브짜리 보스전에서 매 웨이브 교체까지 있으면 과함 —
// 웨이브 사이 교체는 출정(여러 판 이어지는 모드) 전용으로 남기고, 보스전은 6마리를 한 번만 골라 3웨이브 내내 그대로 감.
// 쓰러지면 그 웨이브부터는 그 자리 빈 채로 진행(이탈), 체력은 웨이브 사이 계속 이어짐(회복 없음).
// (v173) 추천 배치: 상대 속성에 강한 정령을 우대해 6마리를 고르고, 돌격·탱커·흡혈처형 계열을 전열에 세움
function recommendFormation(enemyEls, poolKeys){
  const els = (enemyEls||[]).filter(Boolean);
  const pool = (poolKeys || Object.keys(SPIRITS).filter(k=>ownedCount(k)>0)).filter(k=>SPIRITS[k]);
  const score = k=>{ const el = SPIRITS[k].element; let adv = 0; els.forEach(e=>{ if(beats(el, e)) adv += 1; if(beats(e, el)) adv -= 0.7; }); return spiritCP(k) * (1 + 0.12*adv); };
  const pick = pool.sort((a,b)=>score(b)-score(a)).slice(0, GRID_SLOTS);
  const isFront = k=> ENEMY_FRONT_LINES.includes(SPIRITS[k].element+'_'+SPIRITS[k].variant);
  const hp = k=> spiritMaxHpGrid(k);
  const front = pick.filter(isFront).sort((a,b)=>hp(b)-hp(a)).slice(0,3);
  const rest = pick.filter(k=>!front.includes(k)).sort((a,b)=>hp(b)-hp(a));
  while(front.length<3 && rest.length) front.push(rest.shift());
  const out = [null,null,null,null,null,null];
  [1,0,2].forEach((pos,i)=>{ if(front[i]) out[pos] = front[i]; });
  rest.forEach((k,i)=>{ out[3+i] = k; });
  return out;
}

function updateScrollLock(){ document.documentElement.classList.add('lock-scroll'); } // (v187) 모든 화면에서 문서는 고정, 화면 영역(main)만 스크롤
function mountBattleScreen(){
  let el = document.getElementById('battleScreen');
  if(!el){ el = document.createElement('div'); el.id = 'battleScreen'; document.getElementById('app').appendChild(el); }
  document.body.classList.add('in-battle'); updateScrollLock();
  return el;
}
function fitBattleScreen(){ // 전장 칸 높이에 맞춰 유닛 크기 배율(--k) 계산
  const bs = document.getElementById('battleScreen'); if(!bs) return;
  const f = bs.querySelector('.bs-field'); if(!f) return;
  const ar = f.querySelector('.bs-arena2'); if(!ar) return; // (v220) 예전엔 --k를 1로 되돌렸다 다시 재서 레이아웃을 두 번씩 했음(전장 크기는 --k와 무관)
  // (v179) 자유 배치: 한 줄 간격(세로)과 열 간격(가로)에 정령 한 칸(아이콘+이름표+체력바)이 들어가도록 배율 계산
  const W = ar.clientWidth, H = ar.clientHeight, rs = parseFloat(ar.dataset.rs)||0.27, sz = parseFloat(ar.dataset.sz)||44;
  if(!W || !H) return;
  const T0 = 40, PAD = rs < 0.22 ? 0 : 9; // 이름표·체력 막대·숫자 높이(px, 글자 배율 1일 때) · 범위 테두리 여유(줄이지 않음)
  let kw = W*0.21/72, kh = (H*rs - T0 - PAD)/(sz*1.25); // 후열~전열 간격(22%)에 한 칸이 들어가도록 · (v212) 그림 높이(아이콘의 1.2배+여백)까지 계산해서 같은 열 위아래 정령이 겹치지 않게 · (v214) 범위 테두리끼리도 안 닿게 여유 6px(레이드는 8마리라 정령이 너무 작아지지 않게 예전 그대로)
  let k = Math.max(0.45, Math.min(1.5, kw, kh));
  // (v220) 좁은 화면에선 글자 칸(이름표·체력)도 같은 비율로 줄임(최소 72%) — 예전엔 그림만 줄고 글자는 고정 크기라 320px 레이드에서 겹쳤음
  const ts = Math.max(0.72, Math.min(1, k));
  if(ts < 1){ kh = (H*rs - T0*ts - PAD)/(sz*1.25); k = Math.max(0.45, Math.min(1.5, kw, kh)); }
  const ks = k.toFixed(3), tss = ts.toFixed(3);
  if(bs.style.getPropertyValue('--k')!==ks) bs.style.setProperty('--k', ks);
  if(bs.style.getPropertyValue('--ts')!==tss) bs.style.setProperty('--ts', tss);
}
function unmountBattleScreen(){ const el = document.getElementById('battleScreen'); if(el) el.remove(); document.body.classList.remove('in-battle'); updateScrollLock(); }
function upcomingOrder(sf, n){
  const out = [];
  for(let p=sf.queuePos; p<sf.queue.length && out.length<n; p++){ const e = sf.queue[p], u = unitAt(sf, e.side, e.idx); if(u && u.alive) out.push({e, u, next:false}); }
  if(out.length < n) buildQueuePreview(sf).forEach(e=>{ if(out.length<n) out.push({e, u:unitAt(sf, e.side, e.idx), next:true}); });
  return out;
}

function battleLayout(sf){

    if(!unitAt(sf, side, idx)) return;

    [0,1].forEach((idx,r)=>put('me', idx, 34, [37,62][r], sz));
    [4,5].forEach((idx,r)=>put('me', idx, 12, [31,56][r], sz));

    [0,1,2,3].forEach((idx,r)=>put('me', idx, 34+((r===1||r===2)?2:0), fy[r], sz));
    [4,5,6,7].forEach((idx,r)=>put('me', idx, 12, by[r], sz));
  }else{
    const fy = [26,51,76], by = [18,43,68]; // (v225) 전열이 후열보다 아래로 엇갈리게(앞줄이 화면 앞쪽=아래) // (v212) 맨 아래 후열이 배경 모서리 바위·'아군' 표시에 걸려서 세로 간격을 좁히고 위로 올림
    [0,1,2].forEach((idx,r)=>put('me', idx, 33+(r===1?2:0), fy[r], sz)); // (v180) 전열끼리 너무 붙어 보여서 가운데 간격을 넓힘

    // (v257) 챕터 보스: 적 쪽 절반 가운데에 조금 작게(80→64) — 예전엔 후열 칸에 커다랗게 있어서 전열까지 넘어옴. 결계석은 보스 앞쪽 위·아래

    if(withBoss && !raid){ put('enemy', u.idx, 36, u.idx===0 ? 84 : 16, 40); return; } // 결계석은 가운데 선에서 떨어뜨려 보스 앞쪽 위·아래 대칭으로

// (v98) 출전 명단 초안 — 창을 닫았다 열어도(새로고침 포함) 남도록 세이브 상태에 보스별로 저장
const RARITY_HEX = {common:'#b8bcc4', rare:'#5798ff', epic:'#b657ff', legendary:'#ffc857', mythic:'#ff5777'}; // 상단 CSS 변수(--common 등)와 같은 색
const BOSS_MAX_COMBO_MULT = 2.2;
function bossComboMult(matched, total){
  if(matched<=0) return 1;
  const step = (BOSS_MAX_COMBO_MULT-1)/total;
  return 1 + step*matched;
}

function beats(a,b){
  const cycle = {fire:'wood', wood:'water', water:'fire'};
  if(cycle[a]===b) return true;
  if(a==='light' && b==='dark') return true;
  return false;
}
function typeMult(a,b){
  if(beats(a,b)) return 1.3;
  if(beats(b,a)) return 0.8;
  return 1.0;
}

function passiveForERV(element, rarity, variant){
  if(rarity==='common' || rarity==='rare') return null; // 일반·레어는 아직 variant 간 차이 없음(쌍둥이)
  if(rarity==='mythic'){

      name: epicP.name+' + 통솔',
      desc: epicP.desc+' · '+MYTHIC_PASSIVE.desc

  }
  const byElement = ELEMENT_PASSIVE[element];

function doDismantle(key, n){

function playTone(freq, startOffset, duration, bus, type, peak){

function startBgm(){

function weightedPick(list){
  const total = list.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const item of list){

    r -= item.w;
  }
  return list[list.length-1].r;
}

// ===================== 소환 레벨 =====================
function summonLevel(){ return Math.floor((state.lifetimeSummons||0)/20)+1; }
const SUMMON_EPIC_RATE = 1;   // 에픽 확률(%) 고정
const SUMMON_RARE_BASE = 10;  // 레어 확률(%) 시작값 (소환 Lv.1)
const SUMMON_RARE_STEP = 0.4; // 레어 확률 레벨당 증가(%p), Lv.16에서 상한 16%
const LEGENDARY_SUMMON_LEVEL = 17; // 이 레벨부터 소환 확률표에 레전더리가 등장
function weightsForLevel(lvl){
  // (v101) 에픽 1% 고정. 레어는 Lv.1 10% → Lv.16 16%까지, 레전더리는 Lv.17부터 조금씩(최대 0.5%). 나머지는 전부 일반
  const shift = Math.min(lvl-1, 15);
  const rare = SUMMON_RARE_BASE + shift*SUMMON_RARE_STEP;
  const legendary = lvl >= LEGENDARY_SUMMON_LEVEL ? Math.min(lvl-(LEGENDARY_SUMMON_LEVEL-1), 20)*0.025 : 0;
  return [
    {r:'common', w:100 - rare - SUMMON_EPIC_RATE - legendary},
    {r:'rare', w:rare},
    {r:'epic', w:SUMMON_EPIC_RATE},
    {r:'legendary', w:legendary}
  ];
}
function summonWeights(){ return weightsForLevel(summonLevel()); }

// ===================== 소환 / 합성 =====================
// ===================== 정령장비 (v104) =====================
// 무기 = 공격에만, 방어구 = 체력에만 정령력 %를 더함. 장비 속성이 정령 속성과 같으면 효과 x1.5. 종(種) 단위 장착(강화와 같은 원칙).
const EQUIP_SLOTS = ['weapon','armor'];
const EQUIP_SLOT_INFO = { weapon:{icon:'<img class="uic" src="assets/ui/ic_atk.webp" alt="">', name:'무기', stat:'공격'}, armor:{icon:'<img class="uic" src="assets/ui/ic_shield.webp" alt="">', name:'방어구', stat:'체력'} };
const EQUIP_BONUS = { common:0.04, rare:0.08, epic:0.15, legendary:0.25, mythic:0.40 };
const EQUIP_MATCH_MULT = 1.5;
const EQUIP_NAMES = {
  weapon:{fire:'화염 검', water:'물결 창', wood:'숲결 활', light:'빛 지팡이', dark:'그림자 낫'},
  armor:{fire:'화염 갑옷', water:'물결 갑옷', wood:'숲결 갑옷', light:'빛 갑옷', dark:'그림자 갑옷'}
};
const EQUIP_SUMMON_COST = 200;
function isEquipUnlocked(){ return !!state.adminUnlockAll || chapter1BossCleared(); } // (v106) 정령장비는 챕터 1 보스 격파 시 해금
function equipKey(slot, element, rarity){ return slot+'_'+element+'_'+rarity; }
function equipInfo(key){ const p = key.split('_'); return { key, slot:p[0], element:p[1], rarity:p[2], name:EQUIP_NAMES[p[0]][p[1]], icon:EQUIP_SLOT_INFO[p[0]].icon+ELEMENT_INFO[p[1]].emo, img:'<img class="eqimg" src="assets/ui/eq_'+p[0]+'_'+p[1]+'.webp" alt="" draggable="false">' }; } // (v205) img = 화면용 그림, icon = 글(알림)용 이모지
function allEquipKeys(){ const out = []; RARITY_ORDER.forEach(r=>EQUIP_SLOTS.forEach(sl=>ELEMENTS.forEach(e=>out.push(equipKey(sl,e,r))))); return out; }
function equipOwnedCount(key){ return (state.equipOwned && state.equipOwned[key]) || 0; }
function equipUsedCount(key){
  let n = 0; const eq = state.equipped || {};
  Object.keys(eq).forEach(sp=>{ if(ownedCount(sp)>0) EQUIP_SLOTS.forEach(sl=>{ if(eq[sp] && eq[sp][sl]===key) n++; }); });
  return n;
}
function equipFreeCount(key){ return equipOwnedCount(key) - equipUsedCount(key); }
function equippedKey(spKey, slot){ return (state.equipped && state.equipped[spKey] && state.equipped[spKey][slot]) || null; }
// (v241) 장비 강화: 종류별 기록 · 1단계마다 기본 효과 +10% · 등급별 최대 단계
const EQ_ENH_STEP = 0.10, EQ_ENH_MAX = { common:3, rare:5, epic:7, legendary:9, mythic:10 };
function equipEnhLevel(k){ return (state.equipEnh && state.equipEnh[k]) || 0; }
function equipEnhMax(k){ return EQ_ENH_MAX[equipInfo(k).rarity] || 0; }
function equipEnhMult(k){ return 1 + EQ_ENH_STEP*equipEnhLevel(k); }
function equipEnhCost(k){ const lv = equipEnhLevel(k), r = RARITY_ORDER.indexOf(equipInfo(k).rarity); return { essence: 40 + lv*25 + r*20, stone: 3 + lv*3 + r*2 }; }
function eqEnhTag(k){ const n = equipEnhLevel(k); return n>0 ? '<span class="enh-tag">+'+n+'</span>' : ''; }
function doEquipEnhance(k){
  const lv = equipEnhLevel(k); if(lv>=equipEnhMax(k)) return false;
  const c = equipEnhCost(k); if(state.essence<c.essence || (state.enhanceStone||0)<c.stone) return false;
  state.essence -= c.essence; state.enhanceStone -= c.stone;
  if(!state.equipEnh) state.equipEnh = {}; state.equipEnh[k] = lv+1;

}
function equipEffect(eqKey, spKey){ if(!eqKey || !isEquipUnlocked()) return 0; const i = equipInfo(eqKey); return EQUIP_BONUS[i.rarity] * equipEnhMult(eqKey) * (SPIRITS[spKey].element===i.element ? EQUIP_MATCH_MULT : 1); }
function weaponMult(spKey){ return 1 + equipEffect(equippedKey(spKey,'weapon'), spKey); }
function armorMult(spKey){ return 1 + equipEffect(equippedKey(spKey,'armor'), spKey); }
function eqPct(v){ const x = Math.round(v*1000)/10; return (x%1===0 ? x.toFixed(0) : x.toFixed(1)); } // 0.225 → '22.5'
function equipEffectText(key){ const i = equipInfo(key), b = EQUIP_BONUS[i.rarity]*equipEnhMult(key); return EQUIP_SLOT_INFO[i.slot].stat+' +'+eqPct(b)+'% (속성 일치 +'+eqPct(b*EQUIP_MATCH_MULT)+'%)'; }
function equipItem(spKey, slot, key){ if(!state.equipped[spKey]) state.equipped[spKey] = {}; state.equipped[spKey][slot] = key; save(); render(); }
function unequipItem(spKey, slot){ if(state.equipped[spKey]){ state.equipped[spKey][slot] = null; } save(); render(); }
function cleanupEquipment(){ // 보유하지 않게 된 정령의 장착 정보 정리, 장착 수가 보유 수를 넘으면 초과분 해제
  const eq = state.equipped || {};
  Object.keys(eq).forEach(sp=>{ if(ownedCount(sp)<=0) delete eq[sp]; });
  allEquipKeys().forEach(k=>{ let over = equipUsedCount(k) - equipOwnedCount(k);
    if(over>0) Object.keys(eq).forEach(sp=>EQUIP_SLOTS.forEach(sl=>{ if(over>0 && eq[sp] && eq[sp][sl]===k){ eq[sp][sl] = null; over--; } })); });
}
// 추천 장착: 정령력이 높은 정령부터, 부위별로 남은 장비 중 효과가 가장 큰 것(속성 일치 우선)을 끼움
function autoEquipAll(){
  if(!isEquipUnlocked()) return;
  state.equipped = {};
  const spirits = Object.keys(SPIRITS).filter(k=>ownedCount(k)>0);
  const free = {}; allEquipKeys().forEach(k=>{ free[k] = equipOwnedCount(k); });
  EQUIP_SLOTS.forEach(slot=>{
    const items = allEquipKeys().filter(k=>equipInfo(k).slot===slot && free[k]>0);
    const pairs = [];
    spirits.forEach(sp=>items.forEach(k=>pairs.push({sp, k, v:unitPower(sp)*equipEffect(k,sp)}))); // 정령이 강할수록, 속성이 맞을수록 이득이 큼
    pairs.sort((x,y)=>y.v-x.v);
    const done = {};
    pairs.forEach(pr=>{ if(done[pr.sp] || free[pr.k]<=0) return; done[pr.sp] = true; free[pr.k]--; (state.equipped[pr.sp] = state.equipped[pr.sp] || {})[slot] = pr.k; });
  });
  save();
}
// 장비 소환 (정령 소환과 같은 방식: 소환권이 있으면 소환권, 없으면 정수)

function equipCostLabel(){ return ticketCount('equip')>0 ? TICKET_INFO.equip.icon+' 1' : '<img class="uic" src="assets/ui/ic_essence.webp" alt="정수"> '+EQUIP_SUMMON_COST; }

function rollEquipKey(rarity){ return equipKey(EQUIP_SLOTS[Math.floor(Math.random()*EQUIP_SLOTS.length)], ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)], rarity); }
function addEquip(key){ const isNew = !state.equipSeen[key]; state.equipOwned[key] = (state.equipOwned[key]||0) + 1; state.equipSeen[key] = true; return isNew; }
function equipResultView(key){

const EQUIP_RESULT_OPTS = { canAgain:()=>canEquipOnce(), againLabel:()=>'<img class="uic" src="assets/ui/ic_shield.webp" alt=""> 한 번 더 '+equipCostLabel(), ticketKey:'equip' };
function performEquipSummon(againFn){

function doEquipMultiSummon(){

  const rars = [];

// (v112) 초보자 보정: 처음 5번의 소환은 아직 얻지 못한 속성에서 나옴. 같은 속성만 몰려 뽑혀서 첫 스테이지를 못 깨는 일을 막고,
// 상성 전략(서로 다른 속성 보유)을 바로 체험하게 함. 적 강도는 건드리지 않음. offset = 이번 소환 묶음에서 앞서 뽑은 횟수, batch = 앞서 뽑은 키들
function pickSummonElement(offset, batch){
  if((state.lifetimeSummons||0) + (offset||0) < ELEMENTS.length){
    const have = new Set((batch||[]).map(k=>k.split('_')[0]));
    Object.keys(state.discovered).forEach(k=>{ if(state.discovered[k]) have.add(k.split('_')[0]); });
    const unseen = ELEMENTS.filter(el=>!have.has(el));
    if(unseen.length) return unseen[Math.floor(Math.random()*unseen.length)];
  }
  return ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)];
}
function performSummon(againFn){

  const key = element+'_'+rarity+'_'+variant;

const MULTI_SUMMON_COUNT = 10;
function multiSummonCost(){ return Math.round(SUMMON_COST * MULTI_SUMMON_COUNT * 0.9); } // 10개 값 대비 10% 할인
function doMultiSummon(){
  const cost = multiSummonCost();
  const byTicket = ticketCount('summon') >= MULTI_SUMMON_COUNT; // 소환권이 10장 이상이면 소환권 10장, 아니면 정수
  if(!byTicket && state.essence < cost){ toast('정수 부족 (' + cost + ' 필요)'); return; }
  if(byTicket) state.tickets.summon -= MULTI_SUMMON_COUNT; else state.essence -= cost;
  const results = [];
  for(let i=0;i<MULTI_SUMMON_COUNT;i++){
    const rarity = weightedPick(summonWeights());
    const element = pickSummonElement(i, results);
    const variant = VARIANTS[Math.floor(Math.random()*VARIANTS.length)];
    results.push(element+'_'+rarity+'_'+variant);
  }
  // 10연 천장: 레어 이상이 하나도 없으면 마지막 한 자리를 레어/에픽 중 하나로 강제 전환(같은 element/variant 유지)
  const hasRarePlus = results.some(k=> SPIRITS[k].rarity!=='common');
  if(!hasRarePlus){
    const weights = summonWeights();
    const rareW = weights.find(w=>w.r==='rare').w;
    const epicW = weights.find(w=>w.r==='epic').w;
    const rarity = Math.random()*(rareW+epicW) < rareW ? 'rare' : 'epic';
    const last = SPIRITS[results[results.length-1]];
    results[results.length-1] = last.element+'_'+rarity+'_'+last.variant;
  }
  const isNewFlags = results.map(key=>{
    const isNew = !state.discovered[key];
    state.owned[key] = (state.owned[key]||0) + 1;
    state.discovered[key] = true;
    pushRecentSummon(key);
    return isNew;
  });
  state.dailyStats.summons += MULTI_SUMMON_COUNT;
  state.lifetimeSummons = (state.lifetimeSummons||0) + MULTI_SUMMON_COUNT;
  checkAchievements();
  save();
  showMultiResultModal(results, isNewFlags, doMultiSummon);
  render();
}
function canFuse(key){
  const sp = SPIRITS[key];

  return ownedCount(key) >= 3 && !isSpLocked(key);
}

// 슬롯별로 각각 반올림하면 합계가 전체 반올림값과 어긋날 수 있어서(±1 오차),
// "최대 나머지법"으로 슬롯 표시값들의 합이 항상 전체 표시값과 정확히 같도록 분배한다.
// decimals=1로 소수점 첫째자리까지 유지해서 반올림 오차 자체를 줄인다.
function distributeRounded(values, decimals){
  // (수정) 예전엔 "슬롯별 표시값 합 = 전체 표시값"을 맞추려고 나머지를 아무 슬롯에나 몰아줬는데,
  // 그러다 보니 완전히 똑같은 값을 가진 슬롯들 중 하나만 반올림이 다르게 튀어서(예: 12.7/12.7/12.8)
  // 오히려 계산이 이상하다는 오해를 샀음. 이제는 그냥 슬롯마다 독립적으로 반올림함 —
  // 합계가 전체 표시값이랑 소수점 단위로 살짝 다를 수 있지만(최대 0.1 정도), 이게 더 이해하기 쉬움
  decimals = decimals===undefined ? 1 : decimals;
  const scale = Math.pow(10, decimals);
  return values.map(v => Math.round(v*scale)/scale);
}
function dmgRound(v){ return Math.round(v*10)/10; } // 전투력/대미지 수치 계산용(1자리 반올림)
function fmtDmg(v){ return v.toFixed(1); } // 화면 표시용 — toFixed로 부동소수점 표시 오차(예: 120.89999999999999) 원천 차단
function gradeFor(ratio){
  if(ratio < 1.0) return null; // 실패 — 상대보다 전투력이 낮으면 통과 자체가 안 됨
  if(ratio < 1.3) return 'C'; // 1이라도 높으면 C 시작
  if(ratio < 1.6) return 'B';
  if(ratio < 2.0) return 'A';
  return 'S'; // 상대 전투력의 200% 이상
}

// ===================== 세이브 내보내기/불러오기 =====================
// 이 게임은 브라우저 localStorage에만 저장돼서 기기(폰↔PC) 간 자동 연동이 안 되고,
// 파일을 새로 받을 때마다 브라우저가 다른 출처로 취급해서 저장이 안 이어지는 경우도 있음.
// 그래서 상태 전체를 문자열 코드로 내보내고/불러올 수 있게 해서, 수동으로라도 백업·이전이 가능하게 함.
// LZString으로 압축해서 예전 base64 방식보다 60%가량 짧게 만듦. CDN이 막혀서 LZString이 없으면(오프라인 등)
// base64로 자동 대체 — 코드 앞에 붙는 접두어(LZ:/B64:)로 어떤 방식인지 구분해서 불러오기 때도 맞게 해석함
function encodeSaveString(){
  const json = JSON.stringify(state);
  if(typeof LZString!=='undefined') return 'LZ:'+LZString.compressToEncodedURIComponent(json);
  return 'B64:'+btoa(unescape(encodeURIComponent(json)));
}
// (v130) 붙여넣기 정리: 안 보이는 문자 제거, "LZ:"/"B64:"부터 코드로 인식(앞에 설명글이 붙어도 됨), 줄바꿈·공백 처리
function saveCodeCandidates(raw){
  let t = String(raw==null?'':raw).replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g, '');
  // 앞머리는 대소문자·전각 콜론을 가리지 않고 인식(키보드 자동 변환으로 "lz:"처럼 바뀐 경우) → 항상 "LZ:" / "B64:"로 정규화
  const m = t.match(/(LZ|B64)\s*[:：]/i);
  if(m) t = m[1].toUpperCase() + ':' + t.slice(m.index + m[0].length);
  if(/%[0-9A-Fa-f]{2}/.test(t)){ try{ t = decodeURIComponent(t); }catch(e){} }
  const out = [];
  // 1) 공백은 '+'가 바뀐 것일 수 있음(LZString 방식), 줄바꿈·탭만 제거  2) 공백까지 전부 제거(줄 끝 공백이 끼는 경우)
  out.push(t.replace(/ /g, '+').replace(/[\r\n\t]+/g, ''));
  out.push(t.replace(/\s+/g, ''));
  return out.filter((v,i,a)=>v && a.indexOf(v)===i);
}
function decodeSaveOne(s){
  let json = null;
  if(s.startsWith('LZ:')){
    json = LZString.decompressFromEncodedURIComponent(s.slice(3));
    if(!json){ const e = new Error('truncated'); e.code = 'TRUNCATED'; throw e; }
  }else if(s.startsWith('B64:')){
    json = decodeURIComponent(escape(atob(s.slice(4))));
  }else{
    // 접두어 없는 예전 코드(순수 base64) 호환 — 접두어를 빠뜨린 LZ 코드도 한 번 시도
    try{ json = decodeURIComponent(escape(atob(s))); }
    catch(e){ json = LZString.decompressFromEncodedURIComponent(s); }
    if(!json){ const e = new Error('format'); e.code = 'FORMAT'; throw e; }
  }
  return JSON.parse(json);
}
function decodeSaveString(str){
  const cands = saveCodeCandidates(str);
  if(!cands.length){ const e = new Error('empty'); e.code = 'EMPTY'; throw e; }
  let lastErr = null;
  for(const c of cands){
    try{ return decodeSaveOne(c); }catch(e){ lastErr = e; }
  }
  if(lastErr && !lastErr.code) lastErr.code = 'CORRUPT';
  throw lastErr;
}

function chapterPctReward(chapterNum, t){
  const p = Math.round(t*100), sc = 1 + (chapterEff(chapterNum)-1)*0.5;
  if(p===25) return { essence: Math.round(100*sc), stone: 0, items: null };
  if(p===50) return { essence: 0, stone: Math.round(10*sc), items: {summon:5} };
  if(p===75) return { essence: Math.round(200*sc), stone: Math.round(15*sc), items: null };
  return { essence: 0, stone: Math.round(20*sc), items: isHardChapter(chapterNum) ? {legendary:1, summon:5} : {rare:1, summon:5} }; // (v253) 하드 100%는 레전더리 확정권
}

  CHAPTER_PCT_THRESHOLDS.forEach(t=>{
    if(pct>=t){
      const id = 'ch'+chapterNum+'_pct'+Math.round(t*100);
      if(!state.chapterRewardsClaimed[id]){
        state.chapterRewardsClaimed[id] = true;

function hearthUpgradeCost(key){
  const u = HEARTH_UPGRADES[key];

function doHearthUpgrade(key){
  const u = HEARTH_UPGRADES[key];

  state.essence -= cost.essence;

function HEARTH_STONE_PER_SPARK(){ return Math.round(3*(1+hearthUpgradeLevel('output')*0.15)); }
function hearthSparks(){
  const elapsed = Date.now() - (state.hearth ? state.hearth.lastCollect : Date.now());
  return Math.max(0, Math.min(HEARTH_MAX(), Math.floor(elapsed/HEARTH_INTERVAL_MS())));
}
function hearthNextSparkMs(){
  const elapsed = Date.now() - (state.hearth ? state.hearth.lastCollect : Date.now());
  const sparks = hearthSparks();
  if(sparks>=HEARTH_MAX()) return 0;
  return HEARTH_INTERVAL_MS() - (elapsed % HEARTH_INTERVAL_MS());
}
function collectHearth(){
  const sparks = hearthSparks();
  if(sparks<=0){ toast('모인 불씨 없음'); return; }
  const stoneGain = sparks*HEARTH_STONE_PER_SPARK();
  const essenceGain = sparks*HEARTH_ESSENCE_PER_SPARK();
  state.enhanceStone = (state.enhanceStone||0) + stoneGain;
  state.essence += essenceGain;
  // (v118) 거둬도 다음 불씨까지 진행 중이던 시간은 유지 — 거둔 개수만큼만 시각을 앞으로 당김.
  // 가득 차 있었다면 그동안은 쌓이지 않았으니 지금부터 새로 시작
  const wasFull = sparks >= HEARTH_MAX();
  state.hearth.lastCollect = wasFull ? Date.now() : state.hearth.lastCollect + sparks*HEARTH_INTERVAL_MS();
  save();
  sfx('claim');
  toastReward({essence:essenceGain, stone:stoneGain}, uiIc('hearth')+' 화로 수확');
  render();
}
function renderHearthTab(){
  const sparks = hearthSparks();
  const max = HEARTH_MAX();
  let html = '';
  html += '<div style="position:relative; border-radius:20px; padding:24px 16px; text-align:center; background:radial-gradient(circle at 50% 20%, #6a3a1a 0%, #221f4d 78%); border:2px solid var(--line); box-shadow:inset 0 2px 0 #ffffff14, 0 4px 0 #0000004d; overflow:hidden;">';
  html += '<img class="scr-hero" src="assets/ui/ic_hearth.webp" alt="" draggable="false">';
  html += '<div style="font-size:24px; font-weight:900; margin-top:4px;">'+sparks+'/'+max+'</div>';
  html += '<div class="sub" style="margin-top:2px;">'+(sparks<max?('다음 불씨까지 '+Math.ceil(hearthNextSparkMs()/60000)+'분'):'가득 참')+'</div>';
  html += '<div style="height:8px; border-radius:4px; background:#2d2a62; overflow:hidden; margin-top:10px;"><div style="height:100%; width:'+(sparks/max*100)+'%; background:linear-gradient(90deg,#ff7557,#ffc857);"></div></div>';
  html += '<button class="btn" id="collectHearthBtn" style="margin-top:14px;" '+(sparks<=0?'disabled':'')+'>거두기</button>';
  html += '<div style="display:flex; justify-content:center; gap:14px; margin-top:8px; font-size:13px; font-weight:700;"><span><img class="uic" src="assets/ui/ic_essence.webp" alt="정수"> +'+(sparks*HEARTH_ESSENCE_PER_SPARK())+'</span><span><img class="uic" src="assets/ui/ic_stone.webp" alt="강화석"> +'+(sparks*HEARTH_STONE_PER_SPARK())+'</span></div>';
  html += '</div>';
  html += '<div style="display:flex; justify-content:center; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--sub);">'+uiIc('hearth')+' 1 = <img class="uic" src="assets/ui/ic_essence.webp" alt="정수">'+HEARTH_ESSENCE_PER_SPARK()+' + <img class="uic" src="assets/ui/ic_stone.webp" alt="강화석">'+HEARTH_STONE_PER_SPARK()+'</div>';

  html += '<h2 style="margin-top:16px;">업그레이드</h2>';
  Object.keys(HEARTH_UPGRADES).forEach(key=>{
    const u = HEARTH_UPGRADES[key];
    const lvl = hearthUpgradeLevel(key);
    const maxed = lvl>=u.maxLv;
    const cost = hearthUpgradeCost(key);
    const canAfford = !maxed && state.essence>=cost.essence && (state.enhanceStone||0)>=cost.stone;
    let effectText;
    if(key==='output') effectText = '현재 +'+Math.round(lvl*15)+'% → 다음 +'+Math.round((lvl+1)*15)+'%';
    else if(key==='capacity') effectText = '현재 '+(12+lvl*2)+' → 다음 '+(12+(lvl+1)*2);
    else effectText = '현재 '+(20-lvl)+'분 → 다음 '+(20-(lvl+1))+'분';
    html += '<div class="card">';
    html += '<div style="display:flex; align-items:center; justify-content:space-between;">';
    html += '<div><div style="font-weight:700;">'+u.icon+' '+u.name+' Lv.'+lvl+(maxed?' (최고)':'')+'</div><div class="sub">'+u.desc+'</div>'+(!maxed?('<div class="sub" style="margin-top:2px; color:#ffd557;">'+effectText+'</div>'):'')+'</div>';
    if(!maxed) html += '<button class="btn small" data-hearth-upgrade="'+key+'" '+(canAfford?'':'disabled')+'>업그레이드</button>';
    html += '</div>';
    if(!maxed){
      const eOk = state.essence>=cost.essence;
      const sOk = (state.enhanceStone||0)>=cost.stone;
      html += '<div style="display:flex; gap:12px; margin-top:8px; padding-top:8px; border-top:1px solid #ffffff10;">';
      html += '<div style="font-size:12px; font-weight:700; color:'+(eOk?'var(--sub)':'#ff6b6b')+';"><img class="uic" src="assets/ui/ic_essence.webp" alt="정수"> '+cost.essence+'</div>';
      html += '<div style="font-size:12px; font-weight:700; color:'+(sOk?'var(--sub)':'#ff6b6b')+';"><img class="uic" src="assets/ui/ic_stone.webp" alt="강화석"> '+cost.stone+'</div>';
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}
// ===================== 무한의 탑 =====================
// 챕터와 별개로 끝없이 올라가는 도전 — 반복 클리어가 아니라 매번 처음 보는 난이도를 마주치게 됨. 최고 층수/최고 전투력을 기록
function towerFloor(){ return (state.towerBest||0)+1; }
function towerSlotCount(floor){ return floor<=10 ? 3 : (floor<=20 ? 4 : 5); } // (v154) 1~10층 3칸·11~20층 4칸·21층~ 5칸
// (v154) 층마다 특수 규칙 하나씩(1층은 완만한 도입부라 제외). 기존 스테이지 특수 규칙 10종을 그대로 재사용
function isTowerSpecialFloor(floor){ return floor>=2; }
function towerFloorSpec(floor){
  if(!isTowerSpecialFloor(floor)) return null;
  const type = SPECIAL_STAGE_TYPES[Math.floor(seededRand(floor*997.3+13)*SPECIAL_STAGE_TYPES.length)];
  return makeSpecialRule(type, floor, 0, 500, towerSlotCount(floor)); // salt 500으로 스테이지 시드와 겹치지 않게
}
function towerSlotPower(floor){ return Math.round(20*Math.pow(1.055, floor-1)); }
function towerEnemyComposition(floor){
  const arr=[];
  for(let j=0;j<5;j++){ const r=seededRand(floor*61.9+j*7.3+11); arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]); }
  return arr;
}
// 탑은 등급 없이 순수 통과/실패(C 이상=통과, 즉 전투력이 상대보다 1이라도 높으면 됨) — 층당 첫 클리어에만 고정 보상 1회 지급
let viewingTowerFloor = null;
function challengeTower(floor){
  const filled = state.formation.filter(x=>x).length;
  if(filled===0){ toast('진형에 정령 먼저 배치'); return; }
  saveTowerFormation(floor); // (v124) 층마다 마지막으로 쓴 진형을 기억
  sfx('battleStart');
  const enemyComp = towerEnemyComposition(floor);
  const slots = towerSlotCount(floor);
  const special = towerFloorSpec(floor);
  let playerPower = 0;
  let hasMythicLeader = false;
  const slotDetails = [];
  state.formation.forEach((key,idx)=>{
    if(idx>=slots) return;
    if(!key){ slotDetails.push(null); return; }
    const sp = SPIRITS[key];
    const passive = passiveFor(key);
    if(sp.rarity==='mythic') hasMythicLeader = true;
    let atk = baseSlotAtk(key, idx, enemyComp, special);
    let crit = false;
    if(passive && passive.crit && Math.random()<passive.crit.chance){ atk *= passive.crit.mult; crit = true; }
    playerPower += atk;
    slotDetails.push({ atk, adv: slotAdvantage(key, enemyComp[idx]), crit });
  });
  const rawPlayerSum = playerPower;
  if(hasMythicLeader) playerPower *= 1.1;
  if(special) playerPower *= specialAggregateMultForFormation(special, slots);
  let playerPowerDisplay = playerPower;
  if(rawPlayerSum>0){
    const displayFactor = playerPower/rawPlayerSum;
    const dist = distributeRounded(slotDetails.map(d=> d ? d.atk*displayFactor : 0));
    slotDetails.forEach((d,idx)=>{ if(d) d.atk = dist[idx]; });
    playerPowerDisplay = dist.reduce((a,b)=>a+b,0);
  }
  const enemyRarity = enemyRarityCompForTower(floor);
  let enemyHasMythicLeader = false;
  const enemyRawAtks = enemyComp.slice(0,slots).map((el,idx)=>{
    const rv = enemyRarity[idx];
    if(rv.rarity==='mythic') enemyHasMythicLeader = true;
    const passive = passiveForERV(el, rv.rarity, rv.variant);
    let v = baseEnemySlotAtk(idx, towerSlotPower(floor), special, el, passive);
    if(passive && passive.crit && Math.random()<passive.crit.chance) v *= passive.crit.mult;
    return v;
  });
  const rawEnemySum = enemyRawAtks.reduce((a,b)=>a+b,0);
  let enemyPower = rawEnemySum * (enemyHasMythicLeader?1.1:1);
  if(special) enemyPower *= specialAggregateMultForEnemy(special, enemyComp, slots);
  const enemySlotAtks = rawEnemySum>0 ? distributeRounded(enemyRawAtks.map(v=>v*(enemyPower/rawEnemySum))) : distributeRounded(enemyRawAtks);
  const enemyPowerDisplay = enemySlotAtks.reduce((a,b)=>a+b,0);
  const ratio = playerPower/enemyPower;
  const grade = gradeFor(ratio); // 통과 조건: C 이상(=전투력이 상대보다 높기만 하면 됨). 등급 자체는 기록용일 뿐 보상과는 무관
  playTowerBattleAnimation(floor, playerPowerDisplay, enemyPowerDisplay, grade, slotDetails, enemySlotAtks, enemyComp);
}
// (v155) 경제 구조: 스테이지=정수, 탑=강화석+층 소환권, 보스=장비권, 출정=장비·재료(강화석) — 층 보상은 정수 대신 강화석이 기본
function towerFloorReward(f){
  // (v245) 선택권 층: 100층마다 레전더리 · 50층마다 에픽 · 30층마다 레어 (그 층의 확정권 대신)
  if(f%100===0) return {items:{pick_legendary:1}};  // 100, 200…
  if(f%50===0) return {items:{pick_epic:1}};        // 50, 150…
  if(f%75===0) return {items:{legendary:1}};        // (v253) 75, 225… 레전더리 확정권
  if(f%25===0) return {items:{epic:1}};   // 25, 75, 125… 에픽 확정권
  const m = f%10;
  if(f%30===0) return {items:{pick_rare:1}};        // 30, 60, 90, 120…
  if(m===0) return {items:{rare:1}};      // 10, 20, 40… 레어 확정권
  if(m===5) return {items:{summon:1}};    // 5, 15, 35… 정령 소환권
  if(m===9) return {items:{equip:1}};     // 9, 19, 29… 정령장비 소환권
  if(m===2 || m===4 || m===7) return {stone: 14+4*f};  // 예전엔 정수 소량 곁들였지만 이제 전부 강화석
  return {stone: 24+6*f};                 // 나머지 층: 강화석이 탑의 기본 보상
}
function resolveTowerBattle(floor, playerPower, grade){
  if(playerPower > (state.towerBestPower||0)) state.towerBestPower = dmgRound(playerPower);
  let reward = 0, stoneReward = 0, firstClear = false;
  let frontierAdvanced = false;
  if(grade){
    if(floor === towerFloor()){ state.towerBest = floor; frontierAdvanced = true; } // 프론티어 층을 처음 통과하면 다음 층으로 진행
    if(!state.towerFloorGrades) state.towerFloorGrades = {};
    const gradeRank = {C:1,B:2,A:3,S:4};
    const prevGrade = state.towerFloorGrades[floor];
    if(!prevGrade || gradeRank[grade] > gradeRank[prevGrade]) state.towerFloorGrades[floor] = grade; // 최고 등급 기록(보상과 무관, 순수 기록용)
    if(!state.towerFloorRewardClaimed) state.towerFloorRewardClaimed = {};
    if(!state.towerFloorRewardClaimed[floor]){
      firstClear = true;
      const rw = towerFloorReward(floor);
      reward = rw.essence || 0;
      stoneReward = rw.stone || 0;
      state.towerFloorRewardClaimed[floor] = true;
      addPendingReward('tower_'+floor, uiIc('tower'), floor+'층 돌파', reward, stoneReward, 'tower', rw.items || null);
      checkAchievements();
    }
  }
  save();
  return { reward, stoneReward, firstClear, frontierAdvanced };
}
function playTowerBattleAnimation(floor, playerPower, enemyPower, grade, slotDetails, enemySlotAtks, enemyComp){
  const pRatio = playerPower/(playerPower+enemyPower);
  const slots = towerSlotCount(floor); // (v168 버그수정) 층별 칸 수와 연출 칸 수가 어긋나던 문제
  const pairs = [];
  for(let idx=0; idx<slots; idx++){
    const key = state.formation[idx];
    const pIcon = key ? ELEMENT_INFO[SPIRITS[key].element].icon : null;
    const d = slotDetails[idx];
    pairs.push({p:pIcon, e:ELEMENT_INFO[enemyComp[idx]].icon, dmg: d?d.atk:0, edmg: enemySlotAtks[idx]||0, adv: d?d.adv:'none', crit: d?d.crit:false});
  }
  const clash = buildClashSequence(pairs);
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg wide" id="modalBg"><div class="modal battle-modal wide" style="text-align:center; position:relative;">'
    + '<h3>'+uiIc('tower')+' 무한의 탑 - '+floor+'층</h3>'
    + clash.html
    + '<div class="row" style="margin:8px 4px 4px; font-size:13px; font-weight:800;"><div style="flex:1; text-align:left; color:#8a9bff;">아군</div><div style="flex:1; text-align:right; color:#ff8a8a;">탑</div></div>'
    + '<div style="display:flex; height:28px; border-radius:14px; overflow:hidden; background:#333;">'
    + '<div id="pBar" style="height:100%; background:linear-gradient(135deg,#5b6bff,#8a5bff); width:50%; transition:width 1.1s cubic-bezier(.2,.8,.3,1);"></div>'
    + '<div id="eBar" style="height:100%; background:#ff5757; width:50%; transition:width 1.1s cubic-bezier(.2,.8,.3,1);"></div>'
    + '</div>'
    + '<div id="powerCompare" class="sub" style="margin-top:6px; opacity:0; transition:opacity .4s;"><img class="uic" src="assets/ui/ic_atk.webp" alt=""> '+fmtDmg(playerPower)+' vs '+fmtDmg(enemyPower)+' '+uiIc('tower')+'</div>'
    + '<div id="battleResult" style="margin-top:14px; min-height:'+(grade ? 166 + ((state.towerFloorRewardClaimed && state.towerFloorRewardClaimed[floor]) ? 0 : 25) + (floor===towerFloor() ? 14 : 0) : 162)+'px;">'+'<div data-placeholder style="min-height:inherit; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); animation:pulseDim 1.6s ease-in-out infinite;"><img class="uic" src="assets/ui/ic_atk.webp" alt=""> 결과 계산 중…</div>'+'</div>'
    + '</div></div>';
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      { const pb = document.getElementById('pBar'); if(pb) pb.style.width = (pRatio*100)+'%'; }
      { const eb = document.getElementById('eBar'); if(eb) eb.style.width = ((1-pRatio)*100)+'%'; }
      setTimeout(()=>{ const pc=document.getElementById('powerCompare'); if(pc) pc.style.opacity=1; }, 1100);
    }, clash.totalMs);
  });
  setTimeout(()=>{
    const outcome = resolveTowerBattle(floor, playerPower, grade);
    const box = document.getElementById('battleResult');
    if(!box) return; // 결과 화면이 이미 사라졌으면 화면 갱신만 건너뜀 (승패·보상 처리는 위에서 끝남)
    sfx(grade ? 'win' : 'lose');
    if(!grade){
      box.innerHTML = '<div style="font-size:36px;">💥</div><h3>'+floor+'층에서 막힘</h3><div class="sub">전투력이 탑보다 높아야 돌파. 진형 강화 후 재도전</div>'
        + '<button class="btn sticky-ok" id="modalClose" style="margin-top:10px;">확인</button>';
    }else{
      const rewardLine = outcome.firstClear ? '' : '<div class="sub">이미 첫 돌파 보상을 받은 층 (기록 갱신용 재도전)</div>';
      const xpLine = outcome.frontierAdvanced ? '<div class="sub" style="color:#c9a8ff;">+2xp</div>' : '';
      box.innerHTML = '<div style="font-size:36px;"><img class="uic" src="assets/ui/ic_trophy.webp" alt=""></div><h3>'+floor+'층 돌파! ('+grade+'등급)</h3>'
        + rewardLine
        + xpLine
        + '<div class="sub" style="margin-top:4px;">다음: '+(floor+1)+'층</div>'
        + '<button class="btn sticky-ok" id="modalClose" style="margin-top:10px;">확인</button>';
    }
    document.getElementById('modalClose').addEventListener('click', ()=>{
      closeModal(); render();
    });
  }, clash.totalMs + 1300);
}
// ===================== 출정 (로그라이크 런) =====================
// 매번 새로 생성되는 경로 — 전투/사건/보스 노드가 섞여 있고, 한 번 지면 그 런은 끝. 정령 소유권은 그대로 두고 "이번 런 한정" 버프만 초기화됨
const EXPEDITION_NODE_COUNT = 7; // 한 사이클 = 7단계, 마지막 1개는 항상 보스
const EXPEDITION_EVENT_CHANCE = 0.35;
const EXPEDITION_GROWTH = 1.08;    // (v124) 첫 사이클(1~7단계): 단계마다 적 강도 배율 — 챕터1 보스급에서 완만하게 시작
const EXPEDITION_GROWTH_LATE = 1.15; // (v124) 킵해서 넘어간 사이클부터: 단계마다 더 가파르게 (버프가 쌓여도 끝없이 가지 못하게)
const EXPEDITION_KEEP_STEP = 0.25; // (v124) 킵할 때마다 완주 보상 수령 배율 +
function expeditionCycleReward(){ return { essence: 0, stone: 40 + EXPEDITION_NODE_COUNT*8, equip: 2 }; } // (v155) 출정 완주 보상 = 강화석(재료) + 장비 소환권
function expeditionBaseSlotPower(){ return bossTurnBasePower(CHAPTER1_BOSS_STAGE, 1) * EXPEDITION_BASE_SCALE; } // 시작 난이도 = 챕터1 보스 슬롯값 × 보정
const EXPEDITION_BASE_SCALE = 0.7; // (v168) 6칸 전투 기준 완화 — +5강 에픽 팀이 첫 사이클을 가끔 완주하는 정도
function expeditionSlotPower(stepIndex){
  const early = Math.min(stepIndex, EXPEDITION_NODE_COUNT), late = Math.max(0, stepIndex-EXPEDITION_NODE_COUNT);
  return Math.round(expeditionBaseSlotPower()*Math.pow(EXPEDITION_GROWTH, early)*Math.pow(EXPEDITION_GROWTH_LATE, late));
}
function expeditionStepIndex(run){ return ((run.cycle||1)-1)*EXPEDITION_NODE_COUNT + run.currentIndex; } // 런 전체에서 몇 번째 단계인지(0부터)
function expeditionKeepMult(run){ return 1 + EXPEDITION_KEEP_STEP*(run.keeps||0); }
function expeditionEnemyComposition(){
  return Array.from({length:GRID_SLOTS}, ()=>ELEMENTS[Math.floor(Math.random()*ELEMENTS.length)]); // (v153) 6칸 새 전투
}
// 출정은 런마다 매번 새로 노드가 생성돼서(seededRand 아닌 순수 Math.random) 스테이지/탑이랑 다르게
// 등급도 노드 생성 시점에 한 번 굴려서 노드 객체에 그대로 저장해둠(같은 런 안에서는 계속 똑같이 유지)
function expeditionEnemyRarity(stepIndex){
  const weights = enemyRarityWeights(Math.min(1, stepIndex/(EXPEDITION_NODE_COUNT*2)));
  return Array.from({length:GRID_SLOTS}, ()=>({
    rarity: weightedPickSeeded(weights, Math.random()),
    variant: Math.random()<0.5 ? 'a' : 'b'
  }));
}
function enemyRarityAt(node, idx){
  // 구버전 세이브(진행 중이던 출정 런)에는 enemyRarity가 없을 수 있어서 그럴 땐 그냥 "일반"으로 취급(패시브 없음)
  return (node && node.enemyRarity && node.enemyRarity[idx]) || {rarity:'common', variant:'a'};
}

const EXP_TICKET_MAX = 2, EXP_TICKET_INTERVAL_MS = 12*60*60*1000;
const EXP_TICKET_BUY_PRICES = [600]; // 하루 1회만
function expTicketState(){
  if(!state.expTickets) state.expTickets = { count: EXP_TICKET_MAX, lastTick: Date.now(), buyDate: todayStr(), buys: 0 };
  return state.expTickets;
}
function expTicketsRefresh(){
  const t = expTicketState(), now = Date.now();
  if(t.lastTick > now) t.lastTick = now;                 // 시계를 미래로 돌렸다 되돌려도 멈추지 않게
  if(t.count >= EXP_TICKET_MAX){ t.count = EXP_TICKET_MAX; t.lastTick = now; } // 가득 차 있는 동안은 타이머 정지
  else{
    const n = Math.floor((now - t.lastTick) / EXP_TICKET_INTERVAL_MS);
    if(n > 0){
      t.count = Math.min(EXP_TICKET_MAX, t.count + n);
      t.lastTick = t.count >= EXP_TICKET_MAX ? now : t.lastTick + n*EXP_TICKET_INTERVAL_MS;
    }
  }
  if(t.buyDate !== todayStr()){ t.buyDate = todayStr(); t.buys = 0; }
  return t;
}
function expTicketCount(){ return expTicketsRefresh().count; }
function expTicketNextMs(){
  const t = expTicketsRefresh();
  return t.count >= EXP_TICKET_MAX ? 0 : Math.max(0, EXP_TICKET_INTERVAL_MS - (Date.now() - t.lastTick));
}
function expTicketBuyPrice(){ const t = expTicketsRefresh(); return t.buys < EXP_TICKET_BUY_PRICES.length ? EXP_TICKET_BUY_PRICES[t.buys] : null; }
function buyExpTicket(){
  const t = expTicketsRefresh();
  if(t.count >= EXP_TICKET_MAX){ toast('출정권 가득 참'); return false; }
  const price = expTicketBuyPrice();
  if(price===null){ toast('오늘은 더 충전 불가'); return false; }
  if(state.essence < price){ toast('정수 부족 ('+price+' 필요)'); return false; }
  state.essence -= price; t.buys += 1; t.count += 1;
  if(t.count >= EXP_TICKET_MAX) t.lastTick = Date.now();
  save();
  return true;
}
function expTicketTimeText(ms){

function buildExpeditionFight(run, node, isBoss){
  const nodeIndex = expeditionStepIndex(run);
  const per = expeditionSlotPower(nodeIndex) * (isBoss?1.3:1);
  const myUnits = [];
  state.formation.slice(0, GRID_SLOTS).forEach((key, idx)=>{
    if(!key) return;
    const fm = expFatigueMult((run.consecutive[key]||0)+1);
    const u = makeBattleUnit('me', idx, key, unitAtk(key)*fm*run.powerMult, ALLY_HP_MULT);
    const persisted = run.unitHp[key];
    if(persisted){ u.maxHp = Math.min(persisted.maxHp, u.maxHp) || u.maxHp; u.hp = Math.max(0, Math.min(persisted.hp, u.maxHp)); u.alive = u.hp>0; }
    myUnits.push(u);
  });
  const enemyUnits = node.enemyComp.slice(0, GRID_SLOTS).map((el, idx)=>{
    const rv = enemyRarityAt(node, idx), key = el+'_'+rv.rarity+'_'+rv.variant;
    return makeBattleUnit('enemy', idx, key, per*ELEMENT_ATK_MULT[el], ENEMY_HP_MULT);
  });
  const sf = { v:153, mode:'expedition', round:1, phase:'acting', queue:[], queuePos:0, myUnits, enemyUnits,
    log:['전투 시작!'], result:null, fxSeq:0, lastFx:null };
  startRoundQueue(sf);
  return sf;
}
function persistExpeditionWaveState(sf){
  const run = state.expedition; if(!run) return;
  const activeKeys = new Set(sf.myUnits.map(u=>u.key));
  sf.myUnits.forEach(u=>{ run.unitHp[u.key] = { hp: u.hp, maxHp: u.maxHp }; });
  run.roster.forEach(key=>{
    if(!key) return;
    if(activeKeys.has(key)){
      run.consecutive[key] = (run.consecutive[key]||0) + 1;
    }else{
      run.consecutive[key] = 0;
      const cur = run.unitHp[key] || { hp: spiritMaxHpGrid(key), maxHp: spiritMaxHpGrid(key) };
      cur.hp = Math.min(cur.maxHp, cur.hp + Math.round(cur.maxHp*BOSS_REST_HEAL));
      run.unitHp[key] = cur;
    }
  });
}
function checkExpeditionOutcome(sf){
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){
    sf.result = { win:true, rounds: sf.round };
    persistExpeditionWaveState(sf);
    const node = currentExpeditionNode();
    resolveExpeditionBattle(state.expedition, node && node.type==='boss', true);
    return true;
  }
  if(!aliveUnits(sf.myUnits).length){
    sf.result = { win:false, rounds: sf.round };
    persistExpeditionWaveState(sf);
    resolveExpeditionBattle(state.expedition, false, false); // 패배 → 런 종료(진행 보상만 지급, 쌓인 완주 보상은 잃음)
    return true;
  }
  return false;
}
function resolveExpeditionBattle(run, isBoss, won){
  if(won){
    run.totalCleared = (run.totalCleared||0) + 1;
    run.currentIndex += 1;
    run.currentRoom = null;
    if(run.currentIndex >= EXPEDITION_NODE_COUNT){
      finishExpeditionCycle(run);
    }else if(!isBoss){
      run.pendingBuffChoice = pickExpeditionBuffChoices();
    }
    save();
  }else{
    endExpeditionRun(run.currentIndex);
  }
}
// (v124) 사이클 완주: 완주 보상이 "쌓인 보상"에 보류되고, 수령하고 끝낼지 킵하고 계속할지 고르게 함
function finishExpeditionCycle(run){
  const base = expeditionCycleReward();
  if(!run.pot) run.pot = {essence:0, stone:0, equip:0};
  run.pot.essence += Math.round(base.essence*run.rewardMult);
  run.pot.stone += Math.round(base.stone*run.rewardMult);
  run.pot.equip = (run.pot.equip||0) + Math.round(base.equip*run.rewardMult);
  run.pendingKeep = true;
  state.lifetimeExpeditionClears = (state.lifetimeExpeditionClears||0) + 1;
  const prevBest = state.expeditionBestReach||0;
  if(run.totalCleared > prevBest){
    state.expeditionBestReach = run.totalCleared;
    const gain = (Math.min(run.totalCleared,EXPEDITION_NODE_COUNT) - Math.min(prevBest,EXPEDITION_NODE_COUNT))*3;
    toast('<img class="uic" src="assets/ui/ic_trophy.webp" alt=""> 출정 최고 기록 갱신!'+(gain>0?' (+'+gain+'xp)':''));
  }
  checkAchievements();
}
function cashOutExpedition(){
  const run = state.expedition;
  if(!run || !run.pendingKeep) return;

// ===================== 챕터 내 특수 규칙 스테이지 =====================
// 각 챕터마다 스테이지1·보스를 제외한 곳 중 7곳이 무작위로 특수 규칙 스테이지가 됨 — 챕터 안에서 최소 3종 이상의 서로 다른 규칙이 섞이도록 보장
// 규칙은 나(진형)뿐 아니라 적 진형에도 적용되고, 적은 조건을 항상 충족하는 구성으로 나옴(v115). 자원형·정예형은 적에게 적용할 개념이 없어 예외
// (v146) 챕터 10스테이지 기준으로 축소: 특수 스테이지는 챕터당 3~4개(짝수 챕터 4개·홀수 챕터 3개), 이중 규칙·하드코딩 오버라이드는 폐기(6칸 새 전투로 전부 이식)
const SPECIAL_STAGE_TYPES = ['sequence','coverage','chain','resource','squadLimit','diversity','relay','goldenSlot','sealedSlot','field'];
function specialStageCountFor(chapterNum){ return chapterNum%2===0 ? 4 : 3; }
const specialTypeCache = {};
function specialTypeOrder(chapterNum){
  if(specialTypeCache[chapterNum]) return specialTypeCache[chapterNum];
  const arr = SPECIAL_STAGE_TYPES.slice();
  for(let k=arr.length-1; k>0; k--){ const j = Math.floor(seededRand(chapterNum*311.7+k*5.3+2)*(k+1)); const t = arr[k]; arr[k] = arr[j]; arr[j] = t; }
  return (specialTypeCache[chapterNum] = arr.slice(0, specialStageCountFor(chapterNum)));
}
const specialIndicesCache = {};
function specialStageLocalIndices(chapterNum){
  if(specialIndicesCache[chapterNum]) return specialIndicesCache[chapterNum];
  const pool = [];
  for(let li=1; li<CHAPTER_LENGTH-1; li++) pool.push(li); // 로컬 0(스테이지1)과 마지막(보스) 제외
  const seed = chapterNum*211.3 + 1;
  for(let k=pool.length-1; k>0; k--){
    const j = Math.floor(seededRand(seed+k*3.1)*(k+1));
    const tmp=pool[k]; pool[k]=pool[j]; pool[j]=tmp;
  }
  return (specialIndicesCache[chapterNum] = pool.slice(0, specialStageCountFor(chapterNum)).sort((a,b)=>a-b));
}
function isSpecialStage(i){
  if(isBossStage(i)) return false;
  const local = i % CHAPTER_LENGTH;
  if(local===0) return false; // 스테이지1 제외
  const chapterNum = Math.floor(i/CHAPTER_LENGTH)+1;
  return specialStageLocalIndices(chapterNum).includes(local);
}
const SPECIAL_SYM_TYPES = ['sequence','coverage','chain','diversity','relay'];      // 적도 조건을 충족해 배율을 받음
const SPECIAL_AGG_TYPES = SPECIAL_SYM_TYPES.concat(['squadLimit','resource']);       // 진형 전체에 붙는 배율
function specialRules(spec){ return spec.extra ? [spec, spec.extra] : [spec]; } // (v146) extra는 항상 비어있음(이중 규칙 폐기) — 기존 호출부 호환을 위해 함수는 유지
function makeSpecialRule(type, i, chapterNum, salt, slotCount){
  const sd = salt || 0;
  const sc = slotCount || GRID_SLOTS;
  if(type==='sequence'){
    const pattern=[];
    for(let k=0;k<3;k++){ const r=seededRand(i*12.1+k*3.3+1+sd); pattern.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]); }
    return {type, pattern};
  }
  if(type==='coverage'){
    const r1=seededRand(i*19.3+2+sd); const first=ELEMENTS[Math.floor(r1*ELEMENTS.length)];
    let second=first, tries=0;
    while(second===first && tries<10){ const r2=seededRand(i*19.3+2+tries*1.7+1+sd); second=ELEMENTS[Math.floor(r2*ELEMENTS.length)]; tries++; }
    return {type, required:[first,second]};
  }
  if(type==='squadLimit'){
    const k = 2 + Math.floor(seededRand(i*29.1+4+sd)*2); // 2 또는 3
    return {type, k};
  }
  if(type==='goldenSlot'){
    const r = seededRand(i*37.9+6+sd);
    return {type, slot: Math.floor(r*sc)}; // (v154) 슬롯 수를 인자로 받음(6칸 새 전투 / 탑 3~5칸 공용)
  }
  if(type==='sealedSlot'){
    const r = seededRand(i*53.3+8+sd);
    return {type, slot: Math.floor(r*sc)};
  }
  if(type==='field'){
    const up = ELEMENTS[Math.floor(seededRand(i*71.9+3+sd)*ELEMENTS.length)];
    let down = up, t = 0;
    while(down===up && t<10){ down = ELEMENTS[Math.floor(seededRand(i*71.9+3+t*2.3+1+sd)*ELEMENTS.length)]; t++; }
    if(down===up) down = ELEMENTS[(ELEMENTS.indexOf(up)+1)%ELEMENTS.length];
    return {type, up, down};
  }
  return {type}; // chain, resource, diversity, relay는 파라미터 불필요
}
function specialStageSpec(i){
  const chapterNum = Math.floor(i/CHAPTER_LENGTH)+1;
  const rank = specialStageLocalIndices(chapterNum).indexOf(i%CHAPTER_LENGTH);
  const type = rank>=0 ? specialTypeOrder(chapterNum)[rank] : SPECIAL_STAGE_TYPES[Math.floor(seededRand(i*43.7+9)*SPECIAL_STAGE_TYPES.length)];
  return makeSpecialRule(type, i, chapterNum, 0); // (v146) 이중 규칙 오버라이드 폐기 — 스테이지당 규칙 1개
}
function specialRuleLabel(r){
  if(r.type==='sequence') return '📿 순서형 · '+r.pattern.map(elLabel).join(' → ')+' 순서로 채우면 보너스 · 적은 항상 충족';
  if(r.type==='coverage') return '🧩 커버리지형 · '+r.required.map(elLabel).join(' + ')+' 둘 다 있으면 보너스 · 적은 항상 충족';
  if(r.type==='chain') return '🔗 인접형 · 같은 속성을 나란히 두면 쌍마다 보너스 · 최대 3쌍 · 적은 항상 충족';
  if(r.type==='resource') return '💰 자원형 · 강화 안 한 정령 1마리당 +12% · 최대 +60% · 아군만';
  if(r.type==='squadLimit') return '<img class="uic" src="assets/ui/ic_target.webp" alt=""> 정예형 · 정확히 '+r.k+'슬롯만 채우면 ×1.6 · 아군만';
  if(r.type==='diversity') return '🌈 다양성형 · 서로 다른 속성이 많을수록 보너스 · 적은 항상 충족';
  if(r.type==='relay') return '⛓️ 연쇄 상성형 · 슬롯 순서대로 상성 우위가 이어지면 보너스 · 최대 3쌍 · 빛 앞에서는 비겨도 인정 · 적은 항상 충족';
  if(r.type==='sealedSlot') return '<img class="uic" src="assets/ui/ic_lock.webp" alt=""> 봉인 슬롯형 · 슬롯 '+(r.slot+1)+' 공격력 ×0.5 · 적도 같음';
  if(r.type==='field') return '🌦️ 속성 필드형 · '+elLabel(r.up)+' ×1.3 · '+elLabel(r.down)+' ×0.7 · 적도 같음';

let modalScrollStack = [];
function installModalScrollKeeper(){
  const mr = document.getElementById('modalRoot'); if(!mr) return;
  const desc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  const keyOf = m => m ? (((m.querySelector('h3')||{}).textContent)||'').trim() : '';
  Object.defineProperty(mr, 'innerHTML', { configurable: true, get(){ return desc.get.call(this); }, set(v){
    const old = this.querySelector('.modal'), oldTop = old ? old.scrollTop : 0, oldKey = keyOf(old);
    const reset = !!window.__modalScrollReset; window.__modalScrollReset = false;
    desc.set.call(this, v);
    const nw = this.querySelector('.modal'), newKey = keyOf(nw);
    if(!nw){ modalScrollStack = []; return; }          // 완전히 닫힘
    if(reset){ modalScrollStack = []; return; }
    if(old && oldKey && oldKey===newKey){ if(oldTop>0) nw.scrollTop = oldTop; return; } // 같은 창 재렌더
    const at = newKey ? modalScrollStack.map(e=>e.key).lastIndexOf(newKey) : -1;
    if(at >= 0){ const top = modalScrollStack[at].top; modalScrollStack = modalScrollStack.slice(0, at); if(top>0) nw.scrollTop = top; return; } // 하위 창에서 돌아옴
    if(old && oldKey) modalScrollStack.push({ key: oldKey, top: oldTop });                                                                  // 하위 창으로 이동
  }});
}

function buildClashSequence(pairs){
  const stagger = 0.64, dur = 1.1; // 0.5배속 (기존 대비 2배 느리게)
  const advColor = {up:'#5cd65c', even:'#ffd557', down:'#ff5a5a', none:'#8a8a9a'};
  let html = '';
  pairs.forEach((pair, idx)=>{
    const delay = idx*stagger;
    const dmgDelay = delay+dur*0.42;
    html += '<div class="clash-row">'
      + '<div class="clash-p" style="animation: clashLeft '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+(pair.p||'·')+'</div>'
      + '<div class="clash-impact" style="animation: impactFlash 0.6s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">💥</div>'
      + '<div class="clash-e" style="animation: clashRight '+dur+'s ease-in-out; animation-delay: '+delay+'s; animation-fill-mode: both;">'+pair.e+'</div>'
      + '</div>';
    if(typeof pair.dmg==='number'){
      if(typeof pair.edmg==='number'){
        const color = pair.dmg>pair.edmg ? advColor.up : (pair.dmg<pair.edmg ? advColor.down : advColor.even);
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'
          + (pair.crit?'⚡':'') + '아군 '+fmtDmg(pair.dmg)+' <span class="sub" style="font-size:10px;">vs</span> 적 '+fmtDmg(pair.edmg) + '</div>';
      }else{
        const color = advColor[pair.adv] || advColor.none;
        html += '<div class="clash-dmg" style="color:'+color+'; animation: fadeUp 0.5s ease-out; animation-delay: '+dmgDelay+'s; animation-fill-mode: forwards;">'+(pair.crit?'⚡':'')+fmtDmg(pair.dmg)+'</div>';
      }
    }
  });
  const totalMs = Math.round((Math.max(pairs.length-1,0))*stagger*1000 + dur*1000 + 150);
  return {html, totalMs};
}

let achOpen = 0, achSnap = {};
function achOrdered(list, idOf, isReady){
  const key = achOpen+'|'+achieveMode+'|'+achievementCategory;
  if(!achSnap[key]){ achSnap = { [key]: list.filter(isReady).map(idOf).concat(list.filter(x=>!isReady(x)).map(idOf)) }; }
  const order = achSnap[key], pos = x=>{ const i = order.indexOf(idOf(x)); return i<0 ? 1e6 : i; };
  return list.slice().sort((a,b)=>pos(a)-pos(b));
}

  document.querySelectorAll('[data-pk-info]').forEach(el=>el.addEventListener('click', e=>{ e.stopPropagation(); const k = el.dataset.pkInfo; showUnitKitInfo(makeBattleUnit('me', 0, k, unitAtk(k), ALLY_HP_MULT)); }));
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.pick;
      const free = ownedCount(key) - usedCountExcluding(key, slotIdx);
      if(free>0){
        state.formation[slotIdx] = key;
        save(); returnFn();
        return;
      }
      const sourceSlots = [];
      state.formation.forEach((k,idx)=>{ if(idx!==slotIdx && k===key) sourceSlots.push(idx); });
      if(sourceSlots.length<=1){
        if(sourceSlots.length===1) state.formation[sourceSlots[0]] = null;
        state.formation[slotIdx] = key;
        save(); returnFn();
      }else{
        showMoveSourcePicker(key, slotIdx, sourceSlots, returnFn);
      }
    });
  });
  const clearBtn = document.getElementById('clearSlot');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.formation[slotIdx] = null; save(); returnFn();
  });

function slotLabel(idx){

function showMoveSourcePicker(key, targetSlot, sourceSlots, returnFn){

      + '<div style="font-size:22px;">'+spArt(sp)+'</div>'
      + '<div style="flex:1;">'+slotLabel(idx)+'</div>'
      + '</div>';
  });

    '<div class="modal-bg" id="modalBg"><div class="modal" style="position:relative;">'
    + '<button class="close-x" id="modalClose">✕</button><h3>슬롯 선택</h3>' + html + '</div></div>';

function bindModalClose(onClose){

function showEnemyDetailPopup(element, rarity, variant, atk, pw){
  const passive = passiveForERV(element, rarity, variant);
  let html = '<div style="text-align:center;">';
  html += '<div style="width:60px; height:60px; margin:0 auto 8px; border-radius:50%; background:#1b1942; border:3px solid '+ELEMENT_INFO[element].color+'; display:flex; align-items:center; justify-content:center; font-size:30px; overflow:hidden;">'+spArt(SPIRITS[element+'_'+rarity+'_'+variant], 'fill')+'</div>';
  html += '<div style="font-weight:800; font-size:15px;">'+ELEMENT_INFO[element].name+' · '+RARITY_INFO[rarity].name+(rarity!=='common'&&rarity!=='rare'?' ('+(variant==='a'?'A형':'B형')+')':'')+'</div>';
  if(isFinite(pw)) html += '<div class="sub" style="margin-top:4px;"><img class="uic" src="assets/ui/ic_shard.webp" alt=""> 정령력 <b style="color:var(--text);">'+fmtDmg(pw)+'</b></div>';
  html += '<div class="sub" style="margin-top:'+(isFinite(pw)?2:4)+'px;"><img class="uic" src="assets/ui/ic_atk.webp" alt=""> 공격력 <b style="color:var(--text);">'+fmtDmg(atk)+'</b></div>';
  if(passive){
    html += '<div style="margin-top:12px; padding:10px; background:var(--panel); border-radius:10px; text-align:left;">'
      + '<div style="font-weight:700;">'+passive.icon+' '+passive.name+'</div>'
      + '<div class="sub" style="margin-top:2px;">'+passive.desc+'</div>'
      + '</div>';
  }else{
    html += '<div class="sub" style="margin-top:12px;">일반·레어는 특성 없음</div>';
  }
  html += '</div>';
  openInfoOverlay('<img class="uic" src="assets/ui/ic_enemy.webp" alt=""> 적 정보', html);
}
// 모달을 새로 통째로 갈아끼우지 않고 기존 화면 위에 그냥 얹기 때문에, 닫으면 원래 있던 화면(스테이지 준비창, 챕터맵 등)이 그대로 남아있음.
// refreshBody를 주면, 안에서 보상을 받아도 팝업이 닫히지 않고 그 함수로 내용만 다시 그려서 계속 열어둠(뒤쪽 화면 갱신은 onClaim이 담당).
function openInfoOverlay(title, bodyHtml, onClaim, refreshBody){
  const overlay = document.createElement('div');
  overlay.className = 'modal-bg';
  overlay.style.zIndex = '200';
  overlay.innerHTML = '<div class="modal" style="position:relative; max-width:310px;">'
    + '<button class="close-x" id="infoOverlayClose">✕</button>'
    + '<h3 style="text-align:center; margin-top:0;">'+title+'</h3>'
    + '<div id="infoOverlayBody">' + bodyHtml + '</div></div>';
  document.body.appendChild(overlay);
  const closeOverlay = ()=> overlay.remove();
  overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay) closeOverlay(); });
  overlay.querySelector('#infoOverlayClose').addEventListener('click', closeOverlay);
  function bindOverlayClaims(){
    overlay.querySelectorAll('[data-claim-reward]').forEach(btn=>{
      if(btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.addEventListener('click', ()=>{
        if(btn.dataset.claimIds && btn.dataset.claimIds.indexOf(',')>0){
          const r = claimManyPending(btn.dataset.claimIds.split(','));
          if(r.n>0) toastReward({essence:r.essence, stone:r.stone, items:r.items}, uiIc('gift')+' 보상 '+r.n+'개 획득');
        }else if(btn.dataset.claimGroup){
          // (v191) 등급 보상은 어느 칸을 누르든 받을 수 있는 등급을 한 번에 — 알림도 합산해서 1번
          const ids = pendingRewardsFor(btn.dataset.claimGroup).map(r=>r.id);
          const r = claimManyPending(ids);
          if(r.n>0) toastReward({essence:r.essence, stone:r.stone, items:r.items}, '<img class="uic" src="assets/ui/ic_medal.webp" alt=""> 등급 보상 '+r.n+'개 획득');
        }else{
          claimPendingReward(btn.dataset.claimReward);
        }
        sfx('claim');
        if(onClaim) onClaim();
        if(refreshBody){
          document.getElementById('infoOverlayBody').innerHTML = refreshBody();
          bindOverlayClaims();
        }else{
          closeOverlay();
        }
      });
    });
  }
  bindOverlayClaims();
}

  ['stageBest','specialStageBonusClaimed','stageFormations'].forEach(key=>{ const o = s[key]; if(!o || typeof o!=='object') return;
    Object.keys(o).forEach(k=>{ const n = Number(k); if(n>=50 && n<100){ o[String(n+450)] = o[k]; delete o[k]; } }); });
  if(Array.isArray(s.pendingRewards)) s.pendingRewards.forEach(r=>{ if(!r || typeof r.id!=='string') return;
    r.id = r.id.replace(/^(stage|boss)_(\d+)_/, (m,a,b)=> a+'_'+mv(Number(b))+'_').replace(/^ch(\d+)_pct/, (m,c)=> 'ch'+((+c>=6 && +c<=10) ? +c+45 : c)+'_pct'); });

  if(typeof s.dailyStats.date!=='string') s.dailyStats.date = todayStr();
  if(typeof s.questsClaimed.date!=='string') s.questsClaimed.date = todayStr();
  if(!fin(s.hearth.lastCollect) || s.hearth.lastCollect>Date.now()) s.hearth.lastCollect = Date.now(); // 시계를 미래로 돌렸다 되돌려도 화로가 멈추지 않게
  Object.keys(HEARTH_UPGRADES).forEach(k=>{ const v = s.hearthUpgrades[k]; s.hearthUpgrades[k] = fin(v) ? Math.min(HEARTH_UPGRADES[k].maxLv, Math.max(0, Math.floor(v))) : 0; });
  { const ex = s.expedition;
    const roomOk = n=> isPlainObj(n) && ['battle','event','boss','?'].includes(n.type)
      && (n.type!=='battle' && n.type!=='boss' || (Array.isArray(n.enemyComp) && n.enemyComp.length===GRID_SLOTS && n.enemyComp.every(e=>ELEMENTS.includes(e))))
      && (!n.resolvedType || ['event','puzzle'].includes(n.resolvedType));
    if(ex!==null && !(isPlainObj(ex) && fin(ex.currentIndex) && ex.currentIndex>=0 && ex.currentIndex<=EXPEDITION_NODE_COUNT
        && (ex.currentRoom===null || ex.currentRoom===undefined || roomOk(ex.currentRoom))
        && (ex.roomChoices===null || ex.roomChoices===undefined || (Array.isArray(ex.roomChoices) && ex.roomChoices.every(roomOk))))) s.expedition = null; }
  if(s.expedition){ // (v124) 예전 런에는 사이클·킵 정보가 없음 / (v127) 값 형식 전부 검증 / (v164) 방 선택형 구조로 변경
    const e = s.expedition;
    const cleanRoom = n=>{
      if(!n) return n;
      if(n.enemyRarity && !(Array.isArray(n.enemyRarity) && n.enemyRarity.length>=GRID_SLOTS && n.enemyRarity.every(x=> isPlainObj(x) && RARITY_ORDER.includes(x.rarity) && VARIANTS.includes(x.variant)))) delete n.enemyRarity;
      if(n.eventId && !EXPEDITION_EVENTS.some(ev=>ev.id===n.eventId)) delete n.eventId;
      if(n.resolvedType==='puzzle' && !(Array.isArray(n.cardOrder) && n.cardOrder.length===3 && n.cardOrder.every(i=>Number.isInteger(i) && i>=0 && i<PUZZLE_CARD_OUTCOMES.length))) n.cardOrder = [0,1,2];
      return n;
    };
    e.currentRoom = cleanRoom(e.currentRoom||null);
    if(Array.isArray(e.roomChoices)) e.roomChoices = e.roomChoices.map(cleanRoom); else e.roomChoices = null;
    e.currentIndex = Math.floor(e.currentIndex);
    e.cycle = (fin(e.cycle) && e.cycle>=1) ? Math.floor(e.cycle) : 1;
    e.keeps = (fin(e.keeps) && e.keeps>=0) ? Math.min(Math.floor(e.keeps), e.cycle-1) : 0;
    e.totalCleared = (fin(e.totalCleared) && e.totalCleared>=0) ? Math.floor(e.totalCleared) : e.currentIndex;
    if(!(fin(e.powerMult) && e.powerMult>=1)) e.powerMult = 1;
    if(!(fin(e.rewardMult) && e.rewardMult>0)) e.rewardMult = 1;
    e.pendingKeep = e.currentIndex >= EXPEDITION_NODE_COUNT; // 사이클을 끝낸 상태 = 수령/킵 선택 대기
    if(!isPlainObj(e.pot)) e.pot = {essence:0, stone:0, equip:0};
    e.pot.essence = fin(e.pot.essence) ? Math.max(0, Math.round(e.pot.essence)) : 0;
    e.pot.stone = fin(e.pot.stone) ? Math.max(0, Math.round(e.pot.stone)) : 0;
    e.pot.equip = fin(e.pot.equip) ? Math.max(0, Math.round(e.pot.equip)) : 0;
    const buffOk = Array.isArray(e.pendingBuffChoice) && e.pendingBuffChoice.length>0 && e.pendingBuffChoice.every(id=> EXPEDITION_BUFFS.some(b=>b.id===id));
    if(!buffOk || e.pendingKeep) e.pendingBuffChoice = null;
  }
  migrateStageRewardsV179();
  migrateBossPicksV245();
  // (v223) 예전 세이브 보충 지급은 뺌 — 이제 특수 규칙 조건을 충족하고 깨야 보너스를 받음
}

sanitizeState();
// (v122) 앱을 껐다 켜도 하던 화면으로: 마지막 탭 → 진행 중인 보스전(결과 화면 포함) → 열어둔 탑/스테이지 준비창
function resumeLastView(){
  if(!state.skillFight) unmountBattleScreen(); // 세이브가 바뀌어(클라우드 복원 등) 전투가 없으면 전장 화면을 걷어냄
  activeTab = 'home'; // (v170) 앱을 켜면 항상 홈(탐험 모드)부터
  if(state.bossFight) activeTab = 'stage';
  render();
  if(state.skillFight){ activeTab = 'stage'; render(); skillSel.key = null; showSkillStageScreen(); return; } // (v158 버그수정) 보스전도 skillFight로 통일 관리되므로 이 한 줄이 보스 재개까지 다 처리 — 아래 구버전 bossFight 분기는 도달 불가라 제거
  const v = state.openView;
  if(!v) return;
  if(v.t==='stage'){ if(isBossStage(v.idx)) showBossPrepModal(v.idx); else { applyStageFormation(v.idx); showSkillStagePrepModal(v.idx); } }
  else if(v.t==='tower'){ viewingTowerFloor = v.floor || null; showTowerPrepModal(); }
}
installModalScrollKeeper();
resumeLastView();
raidInitNet();
</script>

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
