<style>:root{--sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); box-sizing:border-box; padding-top:var(--sat); padding-bottom:var(--sab);} html{scroll-padding-top:env(safe-area-inset-top,0px);}</style>
<title>아니마룬</title>
<style>
  :root{
    --fire:#ff7557; --water:#57ccff; --wood:#5cd65c; --light:#ffe066; --dark:#9b6bff;
    --common:#b8bcc4; --rare:#5798ff; --epic:#b657ff; --legendary:#ffc857;
    --bg:#17153a; --panel:#221f4d; --panel2:#2b2760; --text:#eceef2; --sub:#9296a6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif; overscroll-behavior:none;}
  #app{max-width:480px; margin:0 auto; min-height:calc(100vh - var(--sat) - var(--sab)); min-height:calc(100dvh - var(--sat) - var(--sab)); display:flex; flex-direction:column; position:relative;}
  header{padding:12px 14px; display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,#1e1e2e 0%,#2a2340 100%); border-bottom:1px solid #3d3a5a; position:sticky; top:0; z-index:20; box-shadow:0 2px 12px #00000055;} /* (v190) 화면 위쪽 고정 영역(z 8)보다 위 — ☰ 메뉴·재화 설명 팝업이 가려지던 문제. 팝업창(z 50)보다는 아래 */
  header .title{font-weight:700; font-size:16px; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  header > div:last-child{flex-shrink:0;}
  @media (max-width:360px){ header .title .tname{display:none;} } /* (v193) 좁은 폰: 제목은 아이콘만 — 오른쪽 버튼이 화면 밖으로 안 밀리게 */
  @media (max-width:350px){ header{padding:10px 8px; gap:4px;} header .title{font-size:14px;} header .essence{padding:5px 7px; font-size:13px;} }
  header .essence{background:linear-gradient(135deg,#332f72,#27235a); padding:6px 10px; border-radius:20px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; border:1px solid #ffffff14; box-shadow:inset 0 1px 0 #ffffff0d;}
  main{flex:1; min-height:0; padding:12px; padding-bottom:80px; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
  /* (v187) 문서 전체가 아니라 헤더 아래 화면 영역만 스크롤 — 헤더는 항상 고정, 화면마다 위쪽(← 홈·제목·탭)은 고정하고 아래만 스크롤 */
  html.lock-scroll #app{height:100%; min-height:0;}
  .scr-top{position:sticky; top:-12px; z-index:8; margin:-12px -12px 8px; padding:12px 12px 8px; background:linear-gradient(180deg, var(--bg) 88%, #17153a00);}
  .scr-top .home-back{margin-bottom:8px;}
  .scr-top > :last-child{margin-bottom:0;}
  main.is-home{padding:0; padding-bottom:0; overflow:hidden;}
  .home{position:relative; height:480px; overflow:hidden; display:flex; flex-direction:column;}
  .home.compact .home-emo{font-size:64px;} .home.compact .home-name{margin-top:6px; font-size:15px;} .home.compact .home-side{top:62px; gap:6px;} .home.compact .home-ic{height:46px;}
  .home-bg{position:absolute; inset:0; width:100%; height:100%; z-index:0; opacity:0; transition:opacity .55s ease;}
  .home-bg.on{opacity:1;}
  .home-car{position:relative; height:var(--car-h, 96px);} /* (v198) 모드 버튼 줄 높이는 fitHome()이 화면 높이에 맞춰 64~96px로 정함 */
  .home-mbtn{position:absolute; top:50%; border-radius:18px; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text);
    transition:left .38s cubic-bezier(.2,.8,.2,1), width .38s cubic-bezier(.2,.8,.2,1), height .38s cubic-bezier(.2,.8,.2,1), transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s, background .38s, box-shadow .38s;}
  .home-mbtn.pos-center{left:50%; width:58%; height:calc(var(--car-h, 96px) - 8px); transform:translate(-50%,-50%); background:linear-gradient(180deg,#52f0ca,#43c4a4); color:#0d2a24; box-shadow:0 6px 0 #0e8a6c, 0 10px 20px #0008; z-index:2;}
  .home-mbtn.pos-left{left:1%; width:19%; height:max(46px, calc(var(--car-h, 96px) * .667)); transform:translate(0,-50%); background:#1a1540ee; border:1px solid #8a74e066; opacity:.92; z-index:1;}
  .home-mbtn.pos-right{left:99%; width:19%; height:max(46px, calc(var(--car-h, 96px) * .667)); transform:translate(-100%,-50%); background:#1a1540ee; border:1px solid #8a74e066; opacity:.92; z-index:1;}
  .home-mbtn.jump{transition:none; opacity:0;}
  .home-mbtn .hm-ico{font-size:20px; line-height:1;} .home-mbtn.pos-center .hm-ico{font-size:24px;}
  .home-mbtn .hm-ico .uic{margin:0 0 1px;} .home-mbtn.pos-center .hm-ico .uic{filter:drop-shadow(0 1px 1px #0006);}
  .home-mbtn .hm-name{font-weight:900; font-size:12px;} .home-mbtn.pos-center .hm-name{font-size:max(17px, calc(var(--car-h, 96px) * .23));}
  .home.car-s .home-mbtn.pos-center .hm-ico{font-size:18px;} .home.car-s .home-mbtn.pos-center .hm-sub{font-size:10px;} .home.car-xs .home-mbtn.pos-center .hm-sub{display:none;}
  .home-mbtn .hm-sub{display:none;} .home-mbtn.pos-center .hm-sub{display:block; font-size:11px; font-weight:800; opacity:.8; max-width:94%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .home-mbtn.pos-center[data-hmode="raid"]{background:linear-gradient(180deg,#ff8a7a,#d84953); color:#2a0508; box-shadow:0 6px 0 #8a1f2a, 0 10px 20px #0008;}
  .home-mbtn.pos-center[data-hmode="expedition"]{background:linear-gradient(180deg,#ffd27a,#e8a34f); color:#2a1805; box-shadow:0 6px 0 #9a5a1a, 0 10px 20px #0008;}
  .home-mbtn.locked.pos-center{filter:saturate(.4) brightness(.85);}
  .home-mbtn.pos-center:active{transform:translate(-50%,-46%);}
  nav button.nav-home .ico{font-size:22px;}
  .home-top{position:relative; z-index:2; padding:12px 12px 0;}
  .home-prof{display:inline-flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; border-radius:14px; background:#0e0b22cc; border:1px solid #8a74e055;}
  .home-ava{width:34px; height:34px; border-radius:10px; background:#2b2360; display:flex; align-items:center; justify-content:center; font-size:20px;}
  .home-side{position:absolute; z-index:3; top:70px; display:flex; flex-direction:column; gap:10px;}
  .home-side.left{left:10px;} .home-side.right{right:10px;}
  .home-ic{position:relative; width:52px; height:56px; border-radius:14px; background:#1a1540dd; border:1px solid #8a74e066; color:var(--text); font-size:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; box-shadow:0 4px 10px #0006;}
  .home-ic small{font-size:10px; font-weight:800; color:#d8ccff;}
  .home-dot{position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%; background:#ff5757; box-shadow:0 0 6px #ff5757;}
  /* (v196) 대표 정령은 홈 배경의 '받침(소환진)' 위에 섬 — 발끝 높이는 fitHome()이 배경 그림(1024×1536, 받침 중심 세로 74.9%) 기준으로 계산해 --hero-foot에 넣음 */
  .home-hero{position:absolute; z-index:2; left:50%; top:var(--hero-foot, 72%); transform:translateX(-50%); width:72%; display:flex; flex-direction:column; align-items:center; text-align:center; cursor:pointer;}
  .home-hero .home-emo{margin-top:-1em;}
  .home-bottom{margin-top:auto;}
  .home-bg[data-img]{background-color:#6a6a9a; background-size:cover; background-repeat:no-repeat; background-position:50% 50%;}
  .home-hero{transition:top .45s ease;} @media (prefers-reduced-motion: reduce){ .home-hero{transition:none;} }
  .home-emo{font-size:clamp(72px, 26vw, 120px); line-height:1; filter:drop-shadow(0 0 22px #b79cffaa); animation:homeFloat 3.2s ease-in-out infinite;}
  @keyframes homeFloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)}}
  .home-name{margin-top:14px; font-size:18px; font-weight:900; text-shadow:0 2px 6px #000a;}
  .home-rar{font-size:12px; font-weight:800; margin-top:2px;}
  .home-name, .home-rar{text-shadow:0 0 3px #000, 0 0 3px #000, 0 1px 2px #000, 0 2px 8px #000c;} /* (v199) 밝은 돌 받침 위에서도 읽히게 */
  .home-bottom{position:relative; z-index:3; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px;}
  .home-modes{display:flex; gap:8px;}
  .home-mode{position:relative; flex:1; padding:9px 4px 8px; border-radius:14px; background:#1a1540ee; border:1px solid #8a74e066; color:var(--text); font-size:22px; display:flex; flex-direction:column; align-items:center; gap:1px;}
  .home-mode b{font-size:13px;} .home-mode small{font-size:10px; color:var(--sub); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .home-mode.locked{opacity:.55;}
  .home-play{position:relative; width:100%; padding:14px 8px; border-radius:18px; border:none; color:#0d2a24; background:linear-gradient(180deg,#52f0ca,#43c4a4); box-shadow:0 6px 0 #0e8a6c, 0 10px 20px #0008; display:flex; flex-direction:column; align-items:center;}
  .home-play span{font-size:22px; font-weight:900;} .home-play small{font-size:12px; font-weight:800; opacity:.8;}
  .home-play:active{transform:translateY(3px); box-shadow:0 3px 0 #0e8a6c, 0 6px 12px #0008;}
  /* ===== (v186) 탐험 지도 ===== */
  .ex-head{display:flex; flex-direction:column; gap:6px; margin-bottom:8px; padding:8px 8px 9px; border-radius:16px; background:linear-gradient(135deg,#221d38,#141233); border:1px solid #ffffff22; box-shadow:0 6px 18px #0006;}
  .ex-arrow{position:relative; flex-shrink:0; width:40px; height:40px; border-radius:12px; border:1px solid #ffffff22; background:#ffffff0d; color:var(--text); font-size:15px;}
  .ex-arrow:disabled{opacity:.3;}
  .ex-adot, .ex-rdot{position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:#ff5757; border:1.5px solid var(--panel);}
  .ex-title{flex:1; min-width:0; text-align:center;}
  .ex-hrow{display:flex; align-items:center; gap:8px;} .ex-hfoot{display:flex; align-items:center; gap:8px; padding:0 2px;}
  .ex-pips{display:flex; gap:4px; flex-shrink:0;} .ex-pip{position:relative; width:10px; height:10px; padding:0; border-radius:50%; border:1.5px solid var(--tc); background:transparent; opacity:.9;}
  .ex-pip.done{background:var(--tc);} .ex-pip.on{transform:scale(1.35); box-shadow:0 0 6px var(--tc); background:#fff;} .ex-pip.lock{opacity:.3;} .ex-pip i{position:absolute; top:-4px; right:-4px; width:6px; height:6px; border-radius:50%; background:#ff5757;}
  .ex-cnt{font-size:11px; font-weight:800; color:var(--sub); white-space:nowrap; display:flex; align-items:center; gap:2px;} .ex-cnt .uic{width:12px; height:12px;}
  .ex-hfoot .ex-bar{flex:1; margin:0;} .ex-hfoot .ex-reward{margin-left:0; flex-shrink:0;}
  .ex-hbadge{display:inline-block; margin-left:4px; padding:1px 6px; border-radius:6px; background:#ff3a5a; color:#fff; font-size:9px; letter-spacing:1px; vertical-align:1px;}
  .ex-ch{font-size:10px; font-weight:900; letter-spacing:2px; color:var(--tc);}
  .ex-name{font-size:19px; font-weight:900; margin-top:1px;}
  .ex-bar{height:6px; border-radius:4px; background:#ffffff14; overflow:hidden; margin:6px 12px 3px;}
  .ex-bar i{display:block; height:100%; background:linear-gradient(90deg,#ffffff66,transparent), var(--tc); box-shadow:0 0 8px var(--tc);}
  .ex-sub{font-size:11px; color:var(--sub); font-weight:700;}
  .ex-map{position:relative; width:100%; height:min(64vh, 560px); min-height:380px; border-radius:22px; overflow:hidden; border:1px solid #ffffff1c; box-shadow:0 10px 26px #0008; animation:exIn .35s ease-out;}
  @keyframes exIn{from{opacity:0; transform:scale(.98)} to{opacity:1; transform:none}}
  .ex-shade{position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(ellipse 80% 70% at 50% 55%, transparent 55%, #0006 100%);}
  .ex-map .bs-parts{z-index:1;}
  .ex-reward{position:relative; margin-left:6px; padding:3px 9px; border-radius:10px; border:1px solid #ffd55788; background:#ffd5571f; color:#ffe7a0; font-size:11px; font-weight:800; vertical-align:middle;}
  .ex-paths{position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none;}
  .ex-road{stroke:#0b0f18; stroke-opacity:.32; stroke-width:11; stroke-linecap:round;}
  .ex-path{stroke:#ffffff; stroke-opacity:.75; stroke-width:4; stroke-dasharray:2 9; stroke-linecap:round;}
  .ex-path.open{stroke-opacity:.95; stroke-dasharray:6 7;}
  .ex-path.done{stroke:var(--tc); stroke-opacity:.95; stroke-width:7; stroke-dasharray:none; filter:drop-shadow(0 0 4px var(--tc));}
  .ex-node{position:absolute; z-index:3; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;}
  .ex-node[data-stage]{cursor:pointer;}
  .ex-disc{position:relative; width:var(--nd, clamp(46px, 14vw, 60px)); height:var(--nd, clamp(46px, 14vw, 60px)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;
    background:radial-gradient(circle at 35% 30%, #3a3a52, #1d1b48); border:3px solid #5a5a72; color:#cfd2e0; box-shadow:0 6px 12px #0009, inset 0 -4px 8px #0006;}
  .ex-node.clear .ex-disc{background:radial-gradient(circle at 35% 30%, #ffffffaa, transparent 60%), var(--tc); border-color:#fff; color:#17153a; box-shadow:0 0 14px var(--tc), 0 6px 12px #0008, inset 0 -4px 8px #0003;}
  .ex-node.open .ex-disc{background:radial-gradient(circle at 35% 30%, #34304e, #16142a); border-color:var(--tc); color:#fff; box-shadow:0 0 0 4px #ffffff22, 0 0 18px var(--tc);}
  .ex-node.next .ex-disc{animation:nodepulse 1.4s ease-in-out infinite;}
  .ex-node.lock .ex-disc{filter:grayscale(.6) brightness(.75);}
  .ex-lock{position:absolute; bottom:-4px; right:-4px; font-size:13px;}
  .ex-node.boss .ex-disc{width:var(--bd, clamp(66px, 20vw, 86px)); height:var(--bd, clamp(66px, 20vw, 86px)); border-color:var(--legendary); border-width:4px; background:radial-gradient(circle at 35% 30%, #5a3a10, #1e1408);}
  .ex-node.boss.clear .ex-disc{background:radial-gradient(circle at 35% 30%, #ffe08a, #e0af4c); box-shadow:0 0 20px var(--legendary);}
  .ex-node.boss.open .ex-disc{box-shadow:0 0 0 5px #ffc85744, 0 0 26px var(--legendary);}
  .ex-bicon{font-size:clamp(32px, 10vw, 44px); line-height:1; filter:drop-shadow(0 2px 3px #0008);}
  .ex-lbl{margin-top:4px; padding:2px 8px; border-radius:9px; background:#0b0f18c8; color:#ffd98a; font-size:10px; font-weight:900; white-space:nowrap;}
  .ex-grade{position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); min-width:22px; padding:0 5px; border-radius:9px; font-size:11px; font-weight:900; text-align:center; line-height:17px; background:#b8bcc4; color:#1d1b48; border:1.5px solid #fff; box-shadow:0 2px 4px #0008;}
  .ex-node.boss .ex-grade{bottom:18px;}
  .ex-grade.gS{background:linear-gradient(135deg,#ffe066,#ffc857);} .ex-grade.gA{background:linear-gradient(135deg,#d6a8ff,#b657ff); color:#fff;} .ex-grade.gB{background:linear-gradient(135deg,#8ec5ff,#5798ff); color:#fff;}
  .ex-sp{position:absolute; top:-8px; right:-8px; font-size:15px; border-radius:50%; background:radial-gradient(circle, #c98aff88 0%, #c98aff00 68%);} /* (v247) 아이폰 사파리에서 drop-shadow가 네모난 보라 판처럼 보여서 둥근 빛으로 바꿈 */
  .ex-dot{position:absolute; top:-3px; left:-3px; width:11px; height:11px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 6px #ff5757;}
  .ex-mode{display:flex; gap:4px; margin-bottom:5px; padding:3px; border-radius:14px; background:#0006;} .ex-mode button{position:relative; flex:1; padding:5px 0; border-radius:11px; border-color:transparent !important; border:1px solid #ffffff1a; background:#1d1b48; color:var(--sub); font-weight:900; font-size:13px;}
  .ex-mode button.on{background:#5b6bff33; border-color:#8a96ff; color:var(--text);} .ex-mode button.hard.on{background:linear-gradient(135deg,#6a1428,#3a1030); border-color:#ff5a6a; color:#ffd0d6; box-shadow:0 0 12px #ff3a5a55;} .ex-mode button.lock{opacity:.55;} .ex-mode .uic{width:14px; height:14px;}
  @media (max-height:700px){ .ex-mode{margin-bottom:3px;} .ex-mode button{padding:2px 0; font-size:11px; border-radius:9px;} }
  .ex-head.hard{background:linear-gradient(160deg,#3a1030,#1d1030) !important; border-color:#ff5a6a66 !important;} .ex-map.hard .ex-shade{background:radial-gradient(ellipse at center, #0000 40%, #5a001a66 100%), #3a001522 !important;}
  .ex-veil{position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:#0b0f18a8; color:#fff; font-weight:800; font-size:14px; backdrop-filter:blur(1.5px);}
  @media (max-height:640px){ .ex-legend{display:none !important;} .ex-head{padding:6px 8px;} .ex-name{font-size:16px;} }
  .ex-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:8px; font-size:11px; font-weight:700; color:var(--sub);}
  .ex-legend span{display:flex; align-items:center; gap:4px;} .ex-legend .lg{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .ex-legend .lg.clear{background:var(--tc);} .ex-legend .lg.open{border:2px solid var(--tc);}
  /* ===== (v181) 친구 · 결투 화면 ===== */
  .fr{display:flex; flex-direction:column; gap:10px;}
  .fr-title{font-size:18px; font-weight:900; margin:2px 0 0;}
  .fr-me{display:flex; align-items:center; gap:10px; padding:12px; border-radius:16px; background:linear-gradient(135deg,#2a2356,#1b1830); border:1px solid #8a74e055; box-shadow:0 6px 18px #0006;}
  .fr-av{flex-shrink:0; width:34px; height:34px; border-radius:11px; background:#2b2360; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .fr-av.big{width:44px; height:44px; font-size:24px; border-radius:14px;}
  .fr-nm{flex:1; min-width:0; display:flex; flex-direction:column;}
  .fr-nm b{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .fr-nm small{font-size:11px; color:var(--sub); margin-top:1px;}
  .fr-code{color:var(--text); letter-spacing:1.5px;}
  .fr-copy{flex-shrink:0; padding:7px 11px; border-radius:10px; border:1px solid #ffffff26; background:#ffffff10; color:var(--text); font-size:12px; font-weight:800;}
  .seg{display:flex; padding:4px; gap:4px; border-radius:14px; background:#141233; border:1px solid #ffffff12;}
  .seg button{flex:1; padding:9px 0; border:none; border-radius:10px; background:none; color:var(--sub); font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:5px;}
  .seg button.on{background:linear-gradient(135deg,#6a7bff,#9a6bff); color:#fff; box-shadow:0 3px 10px #7a5bff55;}
  .seg i{font-style:normal; font-size:10px; min-width:18px; padding:1px 5px; border-radius:9px; background:#ffffff1a;}
  .seg i.hot{background:#ff5757; color:#fff;}
  .fr-cap{font-size:11px; font-weight:800; color:var(--sub); margin:2px 2px -4px;}
  .fr-list{display:flex; flex-direction:column; border-radius:14px; background:#1c1a28; border:1px solid #ffffff10; overflow:hidden;}
  .fr-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid #ffffff0c;}
  .fr-row:first-child{border-top:none;}
  .fr-row.hot{background:#5b6bff1c;}
  .fr-row.dim .fr-nm b{opacity:.7;}
  .fr-row .btn.small{width:auto; padding:7px 12px; flex-shrink:0;}

  /* (v102) 소환 연출: 등급색(--rc)·투명도 변형(--rca/--rcb)·연출 시작 시점(--rev)을 인라인 변수로 받음 */

.sm-flash{position:absolute; inset:-40px; pointer-events:none; background:radial-gradient(circle at 50% 44%, #fff 0%, var(--rc) 34%, transparent 70%); opacity:0; animation:smFlash .75s ease-out var(--rev) forwards;}
.sm-ring{width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; border:3px solid var(--rc); opacity:0; animation:smRing .9s ease-out var(--rev) forwards;}
.sm-ring.r2{border-width:2px; animation-delay:calc(var(--rev) + .16s);}
.sm-rays{width:660px; height:660px; margin:-330px 0 0 -330px; border-radius:50%; background:repeating-conic-gradient(from 0deg, var(--rca) 0deg 7deg, transparent 7deg 20deg); -webkit-mask-image:radial-gradient(circle, #000 10%, transparent 68%); mask-image:radial-gradient(circle, #000 10%, transparent 68%); opacity:0; animation:smFade .6s ease-out var(--rev) forwards, smSpin 16s linear var(--rev) infinite;}
.sm-rays.r2{transform:scale(.72); animation:smFade .6s ease-out calc(var(--rev) + .1s) forwards, smSpinRev 11s linear var(--rev) infinite;}

.sm-stars{font-size:20px; letter-spacing:3px; color:var(--rc); text-shadow:0 0 10px var(--rca); min-height:26px;}

  /* (v207) 글꼴 — 주아(Jua, OFL 무료 글꼴)를 자주 쓰는 한글만 추려 넣음(assets/fonts). 제목·버튼·숫자에만 쓰고 긴 설명 글은 기기 기본 글꼴 */

  .fr-title, .du-hero .fr-title, .sm-name, .sm-rarity, .sm-title, .rd-name, .ex-lbl, .ex-node b, .bu-plate, .bs-banner, .species-tile .name, .rarity-tag,

  /* ===================== (v206) UI 테마 — 새 그림(굵은 외곽선 · 셀 명암 · 남색 밤하늘 · 금빛)에 맞춘 공통 모양 =====================
     색·버튼·패널만 바꾸고 배치는 그대로. 글 안에 직접 쓴 색(인라인 style)은 건드리지 않음 */
  :root{ --bg:#15143a; --panel:#221f4d; --panel2:#2b2760; --text:#f1efff; --sub:#a7a3cf;
    --line:#2a2160; /* (v214) 부드러운 느낌으로 — 거의 검정이던 외곽선을 깊은 보라로 */ --gold:#ffd35a; --gold2:#f0b652; --violet:#8f6bff; --violet2:#6b4ce0; }
  html,body{background:#15143a;}
  body{background:radial-gradient(120% 60% at 50% -10%, #3a2c7a 0%, #1c1a48 45%, #121130 100%) fixed #15143a;}

  nav button.active .ico{filter:drop-shadow(0 0 8px #ffd35a88); transform:translateY(-3px) scale(1.08);}
  /* 패널: 진한 외곽선 + 위쪽 하이라이트 + 안쪽 은은한 테두리 */
  .card, .modal{background:linear-gradient(180deg,#2a2660 0%,#1f1c4b 100%); border:2px solid var(--line); box-shadow:inset 0 0 0 1px #8f7cff33, inset 0 2px 0 #ffffff14, 0 4px 0 #0000004d, 0 8px 18px #0006;}

  /* 버튼: 두툼한 입체(아래 그림자) + 외곽선 — 홈의 '탐험' 버튼과 같은 결 */

// 그렇게 하면 스테이지 난이도 곡선과 별개로 적 전투력이 등급 뽑기 운에 따라 최대 35배까지 요동쳐서
// 기존에 맞춰둔 난이도 곡선이 무의미해짐. 그래서 적의 전투력은 지금처럼 스테이지/층 진행도로만 스케일하고,
// 등급은 패시브 발동 여부(공격력 +8~35%, 크리티컬 확률 등)만 결정함.
function enemyRarityWeights(progress){
  const p = Math.max(0, Math.min(1, progress));
  return [
    {r:'common', w: Math.max(1, 90-55*p)},
    {r:'rare', w: 9+30*p},
    {r:'epic', w: 1+18*p},
    {r:'legendary', w: 6*p},
    {r:'mythic', w: 1*p}
  ];
}
function weightedPickSeeded(list, r){
  const total = list.reduce((s,x)=>s+x.w,0);
  let x = r*total;
  for(const item of list){ if(x<item.w) return item.r; x -= item.w; }
  return list[list.length-1].r;
}
function enemyRarityComp(seedBase, progress){
  const weights = enemyRarityWeights(progress);
  const arr = [];
  for(let j=0;j<5;j++){
    const rarityRoll = seededRand(seedBase*173.31 + j*29.7 + 3);
    const variantRoll = seededRand(seedBase*211.7 + j*17.9 + 5);
    arr.push({ rarity: weightedPickSeeded(weights, rarityRoll), variant: variantRoll<0.5?'a':'b' });
  }
  return arr;
}
function enemyRarityCompForStage(i){ return enemyRarityComp(i, stageEff(i)/99); } // 하드는 노말 N+5 수준의 적 등급
function enemyRarityCompForTower(floor){ return enemyRarityComp(floor+5000, Math.min(1, floor/50)); }
function baseEnemyComposition(i){
  const arr = [];
  for(let j=0;j<5;j++){
    const r = seededRand(i*97.13 + j*13.37 + 1);
    arr.push(ELEMENTS[Math.floor(r*ELEMENTS.length)]);
  }
  return arr;
}
// (v115) 특수 스테이지의 적은 규칙 조건을 항상 충족하는 구성으로 나옴 — 슬롯이 3~5개 어느 쪽이든 앞쪽 슬롯부터 충족되게 배치
// (v116) 규칙이 둘인 스테이지도 둘 다 충족하는 구성. 속성 필드가 있으면 적은 유리한 속성 3칸에 불리한 속성은 없음(커버리지와 같이 나오면 필수 속성 때문에 예외)
function stageEnemyComposition(i){
  const arr = baseEnemyComposition(i);
  if(!isSpecialStage(i)) return arr;
  const rules = specialRules(specialStageSpec(i));
  const has = (t)=> rules.find(x=>x.type===t);
  const r = (k)=> seededRand(i*61.7 + k*7.9 + 11);
  const locked = new Set();
  if(has('chain') && has('coverage')){
    const cov = has('coverage');
    for(let k=0; k<4; k++) arr[k] = cov.required[0];
    arr[4] = cov.required[1];
    for(let k=0; k<5; k++) locked.add(k);
  }else{
    rules.forEach(rule=>{
      if(rule.type==='sequence'){
        rule.pattern.forEach((el,k)=>{ arr[k] = el; });
      }else if(rule.type==='coverage'){
        const pos = [0,1,2];
        for(let k=2; k>0; k--){ const j = Math.floor(r(k)*(k+1)); const t = pos[k]; pos[k] = pos[j]; pos[j] = t; }
        arr[pos[0]] = rule.required[0]; arr[pos[1]] = rule.required[1];
        locked.add(pos[0]); locked.add(pos[1]);
      }else if(rule.type==='chain'){
        const el = ELEMENTS[Math.floor(r(1)*ELEMENTS.length)];
        for(let k=0; k<4; k++) arr[k] = el;
      }else if(rule.type==='diversity'){
        const els = ELEMENTS.slice();
        for(let k=els.length-1; k>0; k--){ const j = Math.floor(r(k+10)*(k+1)); const t = els[k]; els[k] = els[j]; els[j] = t; }
        for(let k=0; k<5; k++) arr[k] = els[k];
      }else if(rule.type==='relay'){
        const cyc = ['fire','wood','water']; // 화염→숲결→물결→화염 순환
        const st = Math.floor(r(1)*3);
        for(let k=0; k<5; k++) arr[k] = cyc[(st+k)%3];
      }
    });
  }
  const f = has('field');
  if(f){
    const free = [0,1,2,3,4].filter(k=>!locked.has(k));
    for(let k=free.length-1; k>0; k--){ const j = Math.floor(r(k+20)*(k+1)); const t = free[k]; free[k] = free[j]; free[j] = t; }
    const others = ELEMENTS.filter(e=>e!==f.down);
    free.forEach((k,n)=>{
      if(n<3) arr[k] = f.up;
      else if(arr[k]===f.down) arr[k] = others[Math.floor(r(k+30)*others.length)];
    });
  }

}
// 챕터 내에서 전반부(로컬 0~9)는 완만하고, 후반부(로컬 10~19, 보스 포함)부터 확실히 어려워지도록 설계.

const CHAPTER_ENEMY_START = [10, 48, 187.5, 231.25, 506.25]; // 노말 챕터 1~5 (챕터를 늘리면 여기 뒤에 이어 붙임)

function gridNeighbors(idx, shape, width){

// 룬석: 레이드 승리 보상 → 레이드 상점에서 룬 뽑기·고대 룬 교환·룬 승급석·파편·소환권 구입(주간 구매 한도로 경제 보호)
const RAID_TICKET_MAX = 3, RAID_TICKET_INTERVAL_MS = 8*60*60*1000;
const RAID_GEMS = { easy:2, normal:4, hard:7, extreme:12 };
function raidTicketState(){ if(!state.raidTickets || typeof state.raidTickets!=='object') state.raidTickets = { count: RAID_TICKET_MAX, lastTick: Date.now() }; return state.raidTickets; }
function raidTicketsRefresh(){
  const t = raidTicketState(), now = Date.now();
  if(t.lastTick > now) t.lastTick = now;
  if(t.count >= RAID_TICKET_MAX){ t.count = RAID_TICKET_MAX; t.lastTick = now; }
  else{ const n = Math.floor((now - t.lastTick)/RAID_TICKET_INTERVAL_MS); if(n>0){ t.count = Math.min(RAID_TICKET_MAX, t.count+n); t.lastTick = t.count>=RAID_TICKET_MAX ? now : t.lastTick + n*RAID_TICKET_INTERVAL_MS; } }
  return t;
}
function raidTicketCount(){ return raidTicketsRefresh().count; }
function raidTicketNextText(){ const t = raidTicketsRefresh(); if(t.count>=RAID_TICKET_MAX) return '가득'; const ms = Math.max(0, RAID_TICKET_INTERVAL_MS - (Date.now()-t.lastTick)); const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000); return h+'시간 '+m+'분 후 +1'; }
function raidUseTicket(code){ // 같은 방에서는 한 번만 씀(새로고침해도 다시 안 씀)
  if(state.raidTicketFor===code) return !!state.raidTicketHad;
  const t = raidTicketsRefresh(), had = t.count>0;
  if(had){ if(t.count>=RAID_TICKET_MAX) t.lastTick = Date.now(); t.count -= 1; }
  state.raidTicketFor = code; state.raidTicketHad = had; save();
  return had;
}

function raidShopBought(id){ const b = state.raidShopBuys; return (b && b.week===raidWeekKey() && b.n && b.n[id]) || 0; }
function rollShopRune(){
  const wb = raidWeekBoss(), bossP = 0.03 + (state.runePity||0);
  if(Math.random() < bossP && BOSS_RUNES[wb.id]){ state.runePity = 0; return { id: BOSS_RUNES[wb.id].id, tier:'boss' }; }
  state.runePity = Math.min(0.15, (state.runePity||0) + RUNE_PITY_STEP);
  const tier = Math.random() < 0.12 ? 'legend' : 'rare';
  const ids = Object.keys(RUNE_BASE).filter(id=>RUNE_BASE[id].vals[tier]!==undefined);
  return { id: ids[Math.floor(Math.random()*ids.length)], tier };
}
function raidShopMax(it){ // 지금 살 수 있는 최대 개수 (룬석·주간 한도·룬 보관함)
  let m = Math.floor((state.raidGems||0)/it.price);
  if(it.limit) m = Math.min(m, it.limit - raidShopBought(it.id));
  if(it.id==='draw' || it.id==='boss') m = Math.min(m, RUNE_INV_MAX - (state.runeInv||[]).length);
  return Math.max(0, Math.min(99, m));
}
function raidShopBuy(id, n){
  const it = RAID_SHOP.find(x=>x.id===id); if(!it) return;
  n = Math.max(1, Math.floor(n||1));
  if((state.raidGems||0) < it.price*n){ toast(uiIc('runestone')+' 룬석 부족'); return; }
  if(it.limit && raidShopBought(id)+n > it.limit){ toast('이번 주 구매 한도 도달'); return; }
  if((id==='draw' || id==='boss') && (state.runeInv||[]).length+n > RUNE_INV_MAX){ toast('룬 보관함 가득 참'); return; }
  state.raidGems -= it.price*n;
  if(!state.raidShopBuys || state.raidShopBuys.week!==raidWeekKey()) state.raidShopBuys = { week: raidWeekKey(), n:{} };
  state.raidShopBuys.n[id] = (state.raidShopBuys.n[id]||0) + n;
  if(id==='draw' || id==='boss'){
    const wb = raidWeekBoss(), got = [];
    for(let i=0;i<n;i++) got.push(id==='boss' ? { id: BOSS_RUNES[wb.id].id, tier:'boss' } : rollShopRune());
    state.runeInv = state.runeInv || []; state.runeInv.push(...got); save();
    if(n===1){ showRuneReveal(got[0], uiIc('runestone'), showRaidShop, '룬 보관함으로'); return; }
    const cnt = t=> got.filter(r=>r.tier===t).length;
    toast('🎲 룬 '+n+'개 → 보관함 · 고대 '+cnt('boss')+' · 전설 '+cnt('legend')+' · 희귀 '+cnt('rare'), 3500); showRaidShop(); return;
  }
  if(id==='upgrade') state.runeUpStones = (state.runeUpStones||0) + n;
  else if(id==='shards') state.shards = (state.shards||0) + 10*n;
  else if(id==='essence') state.essence += 500*n;
  else if(id==='stone') state.enhanceStone = (state.enhanceStone||0) + 30*n;
  else grantItems({ [id]: n });
  save(); toast(it.icon+' '+it.name+(n>1?' ×'+n:'')+' 구입'); showRaidShop();
}

function runeUpgrade(key){
  const r = spiritRune(key); if(!r || r.tier==='boss' || r.tier==='legend') return;
  if((state.runeUpStones||0) < 1){ toast('룬 승급석 없음 (레이드 상점)'); return; }
  const next = r.tier==='common' ? 'rare' : 'legend';
  if(RUNE_BASE[r.id].vals[next]===undefined) return;
  state.runeUpStones -= 1; state.runes[key] = { id: r.id, tier: next }; save();
  showRuneReveal(state.runes[key], '⬆️', ()=>showManageModal(key), SPIRITS[key].name+'의 룬 승급');

function unitCP(u){ return (u.alive===false) ? 0 : Math.sqrt(Math.max(0, u.atk*(u.specialMult||1)) * Math.max(0, u.hp)) * (1 + 0.1*u.g); }
function teamCP(list){ return Math.round((list||[]).reduce((a,u)=>a+unitCP(u),0)); }
function spiritCP(key){ return Math.round(unitCP(makeBattleUnit('me', 0, key, unitAtk(key), ALLY_HP_MULT))); }
function cpVerdict(my, en){ const r = my/Math.max(1,en); if(r>=1.15) return {t:'여유', c:'#5cd65c'}; if(r>=0.95) return {t:'우세', c:'#a8e063'}; if(r>=0.8) return {t:'접전', c:'#ffd557'}; return {t:'열세', c:'#ff5a5a'}; }
function fmtCP(n){ return Math.round(n).toLocaleString('ko-KR'); }
function cpBarHtml(my, en, enLabel, note){

function cdLbl(u, act){ const c = unitCd(u, act), b = act==='s1' ? kitOf(u).s1.cd : kitOf(u).s2.cd; return c<b ? '<b style="color:#ffd557;">'+c+'</b>' : ''+c; }
function unitCd(u, act){ const k = kitOf(u), base = act==='s1' ? k.s1.cd : k.s2.cd, aw = u.aw||0; return Math.max(1, base - ((act==='s1' ? aw>=2 : aw>=4) ? 1 : 0)); }
function makeBattleUnit(side, idx, key, atk, hpMult, specialMult, armorOverride, runeOverride, awOverride){
  const sp = SPIRITS[key], g0 = gradeOf(sp.rarity);
  // (v225) 각성: ★1 패시브 · ★3 스킬2가 등급과 상관없이 열림 · ★5 스킬 효과 한 등급 위. 레이드·결투 상대는 보내온 값(awOverride)
  const aw = Number.isFinite(awOverride) ? Math.max(0, Math.min(AWAKEN_MAX, Math.floor(awOverride))) : (side==='me' ? awakenLevel(key) : 0);
  const g = Math.min(4, g0 + (aw>=5 ? 1 : 0));
  // (v168 버그수정) 6칸 전투에서 방어구(체력 +%)가 적용되지 않던 문제 — 내 정령은 방어구 배율을 체력에 곱함(레이드 팀원은 보내온 값 사용)
  const armor = Number.isFinite(armorOverride) ? armorOverride : (side==='me' ? armorMult(key) : 1);
  const maxHp = Math.max(1, Math.round(atk*hpMult*armor)); // (v146) specialMult는 공격력에만 적용, 체력에는 반영 안 함
  const u = { side, idx, key, element: sp.element, line: sp.element+'_'+sp.variant, g, aw, pg: (g0>=1 || aw>=1) ? Math.max(1, g) : 0, s2on: g0>=2 || aw>=3, atk, hp: maxHp, maxHp,
    cd1: 0, cd2: 0, alive: true, st: {}, reviveUsed: false, reviveGiven: false, specialMult: specialMult||1 }; // (v162) 스킬2 시작 쿨타임 2턴 제거 — 등급만 되면 바로 사용 가능
  if(side==='me') applyRuneOnBuild(u, runeOverride!==undefined ? runeOverride : spiritRune(key)); // (v170) 룬
  else if(runeOverride) applyRuneOnBuild(u, runeOverride); // (v173) 결투: 상대 정령의 룬
  return u;
}

  const els0 = [a[0],a[1],a[2],a[3],a[4],b[0]], rv0 = [ra[0],ra[1],ra[2],ra[3],ra[4],rb[0]];
  // (v169) 역할대로 고정 배치: 돌격·탱커·처형 계열은 전열, 치유·빙결·화상·독·보호막·가속·저주 계열은 후열.

  const els = [null,null,null,null,null,null], rv = rv0.slice();

const ENEMY_FRONT_LINES = ['fire_a','wood_a','dark_a']; // 전열에 서는 계열(돌격·탱커·흡혈처형)
// (v146) 특수 규칙 이식: 황금/봉인 슬롯·속성 필드 = 그 자리 공격력 배율, 순서·커버리지·인접·다양성·연쇄(+정예·자원)는 조건 충족 쪽 팀 전체 배율.

function buildSkillStageFight(i){
  const grid = enemyGridForStage(i), per = enemySlotPower(i);

  const myElements = state.formation.slice(0, GRID_SLOTS).map(k=>k && SPIRITS[k] ? SPIRITS[k].element : null);
  const enemyElements = grid.els;
  const myUnits = [];
  state.formation.slice(0, GRID_SLOTS).forEach((key, idx)=>{
    if(key && SPIRITS[key]){
      const m = specialUnitMult(spec, idx, SPIRITS[key].element, myElements, true);
      myUnits.push(makeBattleUnit('me', idx, key, unitAtk(key), ALLY_HP_MULT, m));
    }
  });
  const enemyUnits = [];
  grid.els.forEach((el, idx)=>{
    if(!el) return;
    const rv = grid.rv[idx], key = el+'_'+rv.rarity+'_'+rv.variant;
    const m = specialUnitMult(spec, idx, el, enemyElements, false);
    enemyUnits.push(makeBattleUnit('enemy', idx, key, per*ELEMENT_ATK_MULT[el], ENEMY_HP_MULT, m));
  });
  const sf = { v:147, stageIdx: i, round: 1, phase: 'acting', queue: [], queuePos: 0, myUnits, enemyUnits,

}
function startSkillStageFight(i){

function skillGradeForRounds(r){ if(r<=3) return 'S'; if(r===4) return 'A'; if(r<=6) return 'B'; return 'C'; }
function sideUnits(sf, side){ return side==='me' ? sf.myUnits : sf.enemyUnits; }
function foeOf(side){ return side==='me' ? 'enemy' : 'me'; }
function unitAt(sf, side, idx){ return sideUnits(sf, side).find(u=>u.idx===idx); }
function aliveUnits(list){ return list.filter(u=>u.alive); }
function frontFirst(list, width){ const a = aliveUnits(list), f = a.filter(u=>isFrontRow(u.idx, width)); return f.length ? f : a; }
function validEnemyTargets(sf){

  if(taunt.length) return taunt.map(u=>u.idx);

}
function skillUnitName(side, u){ return (side==='enemy' ? '적 ' : '')+(u.dispName || SPIRITS[u.key].name); }
function skillTargetable(sf, side, idx){
  const u = unitAt(sf, side, idx);

}
function effSpeed(u){ const s = u.st; return speedForElementRarity(u.element, SPIRITS[u.key].rarity) + runeSpeed(u) + (s.haste?s.haste.v:0) - (s.slow?s.slow.v:0) - (s.chill||0); }
function pushLog(sf, line){ sf.log = (sf.log||[]).concat(line).slice(-5); }
function setFx(sf, fx){ sf.fxSeq = (sf.fxSeq||0) + 1; fx.id = sf.fxSeq; sf.lastFx = fx; }

// ---------- 피해·회복 ----------
function atkBonus(sf, a, d){
  let b = 0; const s = a.st;
  if(s.buff) b += s.buff.v;
  if(s.empower) b += s.empower;
  if(a.line==='fire_a' && unitPG(a)>=1 && a.hp/a.maxHp<=0.5) b += [0,.15,.20,.25,.30][unitPG(a)];
  if((s.shield||0)>0){ let best = 0; aliveUnits(sideUnits(sf, a.side)).forEach(u=>{ if(u.line==='light_a' && unitPG(u)>=1) best = Math.max(best, [0,.08,.10,.12,.15][unitPG(u)]); }); b += best; }
  if(a.line==='dark_a' && unitPG(a)>=1) b += (1 - d.hp/d.maxHp)*100*[0,.003,.004,.005,.006][unitPG(a)];
  return b;
}
function dmgReduction(sf, d){
  let r = 0;
  if(d.line==='wood_a' && unitPG(d)>=1) r += [0,.08,.10,.12,.15][unitPG(d)];
  if(d.st && d.st.guard) r += d.st.guard.v; // (v192) 굳건함(숲결 탱커 뿌리 내리기)
  r += runeDr(d);
  { const w = sideWidth(sf, d.side); if(!isFrontRow(d.idx, w)){ const f = unitAt(sf, d.side, d.idx-w); if(f && f.alive && f.line==='wood_a' && f.g>=4) r += 0.2; } }
  return r;
}
function killUnit(sf, u){
  if(!u.alive) return; // 이미 쓰러진 유닛을 다시 처리하지 않음
  u.hp = 0; u.alive = false;
  if(u.isWard) groggyWardBroken(sf); // (v179) 결계석 파괴 → 보스 그로기 게이지
  const poisoned = u.st.poison ? u.st.poison : null;
  u.st = {};
  // 화염-a 레전더리↑: 자기 부활(신화는 부활하며 폭발)
  if(u.line==='fire_a' && u.g>=3 && !u.reviveUsed){
    u.reviveUsed = true; u.alive = true; u.hp = Math.round(u.maxHp*0.3);
    pushLog(sf, SPIRITS[u.key].name+' 부활!');
    if(u.g>=4) aliveUnits(sideUnits(sf, foeOf(u.side))).forEach(e=>dealDamage(sf, u, e, 0.8, {noCrit:true}));
    return;
  }
  // 빛-a 신화: 같은 편 쓰러진 아군 1회 부활
  const angel = aliveUnits(sideUnits(sf, u.side)).find(x=>x.line==='light_a' && x.g>=4 && !x.reviveGiven);
  if(angel){ angel.reviveGiven = true; u.alive = true; u.hp = Math.round(u.maxHp*0.5); pushLog(sf, SPIRITS[angel.key].name+'이(가) '+SPIRITS[u.key].name+' 부활'); return; }
  // 숲결-b 패시브: 독 걸린 채 쓰러지면 옆 칸으로 독 전파
  if(poisoned && poisoned.srcG>=1 && Math.random() < [0,.5,.65,.8,1][poisoned.srcG]){
    const nb = gridNeighbors(u.idx, 'row').map(i=>unitAt(sf, u.side, i)).filter(x=>x && x.alive);
    if(nb.length){ const t = nb[Math.floor(Math.random()*nb.length)]; if(!t.st.ward) t.st.poison = {r:3, pct:poisoned.pct, srcG:poisoned.srcG}; else t.st.ward--; }
  }
}
function dealDamage(sf, a, d, mult, opts){
  opts = opts || {};
  if(!d.alive) return null;
  let v = a.atk * mult * (a.specialMult||1) * typeMult(a.element, d.element) * (1 + atkBonus(sf, a, d)) * runeDmgMult(a, d);
  if(sf.mode==='boss'){
    const adj = bossDefenseAdjust(sf, a, d, v);
    if(adj.blocked) return { total:0, crit:false, blocked:true };
    if(adj.healBoss>0){ d.hp = Math.min(d.maxHp, d.hp + adj.healBoss); groggyHit(sf, a, d, mult, false, 0); return { total:0, crit:false, healed:adj.healBoss }; }
    v = adj.v;
  }
  const s = d.st;
  v *= 1 + (s.curse ? s.curse.v : 0) + (s.web ? s.web.v : 0);
  v *= Math.max(0.1, 1 - dmgReduction(sf, d));
  if(d.groggy) v *= GROGGY_DMG_MULT; // (v179) 그로기: 받는 피해 2배
  let critCh = BASE_CRIT + runeCrit(a);
  if(a.line==='dark_b' && unitPG(a)>=1 && s.curse) critCh += [0,.10,.15,.20,.25][unitPG(a)];
  const crit = !opts.noCrit && Math.random() < critCh;
  if(crit) v *= CRIT_MULT;
  const total = Math.max(0, Math.round(v));
  let rest = total;
  const shieldBefore = s.shield||0;
  if(s.shield>0){ const ab = Math.min(s.shield, rest); s.shield -= ab; rest -= ab; if(s.shield<=0) delete s.shield; }
  d.hp = Math.max(0, d.hp - rest);
  runeOnHit(sf, a, d, total);
  if(s.reflect && total>0 && a.alive && a!==d){ const rd = Math.round(total*s.reflect.v); a.hp = Math.max(0, a.hp - rd); if(a.hp<=0) killUnit(sf, a); }
  const groggy = (d.isBoss && d.hp>0) ? groggyHit(sf, a, d, mult, crit, shieldBefore) : false;
  if(d.hp<=0) killUnit(sf, d);
  return { total, crit, groggy };
}
function healAmount(target, amt){
  const p = target.st.poison;

}
// ---------- 행동 문맥(스킬 run에 넘기는 도구) ----------
function makeActCtx(sf, a, tSide, tIdx){
  const C = { sf, a, g:a.g, tSide, t: unitAt(sf, tSide, tIdx), hits: [] };
  C.P = arr=>arr[a.g];
  C.side = s=>aliveUnits(sideUnits(sf, s));
  C.around = shape=>gridNeighbors(C.t.idx, shape, sideWidth(sf, tSide)).map(i=>unitAt(sf, tSide, i)).filter(u=>u && u.alive);
  C.hit = (u, mult)=>{
    if(!u || !u.alive) return null;
    const r = dealDamage(sf, a, u, mult);
    if(!r) return null;
    C.hits.push({ side:u.side, idx:u.idx, kind:'dmg', amount:r.total, crit:r.crit, eff:typeMult(a.element, u.element) });
    if(r.groggy) C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:'<img class="uic" src="assets/ui/ic_groggy.webp" alt="">그로기!' });
    if(a.line==='water_b' && unitPG(a)>=1 && u.alive){ const v = [0,5,6,8,10][unitPG(a)]; u.st.chill = Math.min(v*3, (u.st.chill||0) + v); }
    return r;
  };
  C.heal = (u, amt)=>{ if(!u || !u.alive) return; const before = u.hp; u.hp = Math.min(u.maxHp, u.hp + healAmount(u, amt)); C.hits.push({ side:u.side, idx:u.idx, kind:'heal', amount:u.hp-before }); };
  C.shield = (u, amt)=>{ if(!u || !u.alive) return; const v = Math.round(amt); u.st.shield = (u.st.shield||0) + v; u.st.shieldR = 2; C.hits.push({ side:u.side, idx:u.idx, kind:'shield', amount:v }); }; // (v173) 보호막은 2라운드 유지
  C.neg = (u, fn, label)=>{ if(!u || !u.alive) return false; if(u.st.ward>0){ u.st.ward--; if(!u.st.ward) delete u.st.ward; C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:'<img class="uic" src="assets/ui/ic_guard.webp" alt="">막음' }); return false; } fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); return true; };
  C.pos = (u, fn, label)=>{ if(!u || !u.alive) return; fn(u.st); C.hits.push({ side:u.side, idx:u.idx, kind:'status', text:label }); };
  C.burn = (u, n)=>{ if(a.line==='fire_b' && aw5(a)) n += 1; const cap = (a.line==='fire_b' && a.g>=4) ? 8 : 5; C.neg(u, st=>{ st.burnCap = Math.max(cap, st.burnCap||5); st.burn = Math.min(st.burnCap, (st.burn||0)+n); st.burnDmg = Math.max(st.burnDmg||0, Math.round(a.atk*0.15)); }, '🔥화상'); };
  C.poison = (u, pct)=>{ C.neg(u, st=>{ st.poison = { r:(a.line==='wood_b' && aw5(a)) ? 4 : 3, pct, srcG:a.g }; }, '☠독'); };
  C.cleanse = (u, n)=>{ let k = 0; ['freeze','bind','poison','burn','curse','web','slow','chill'].forEach(key=>{ if(k<n && u.st[key]){ delete u.st[key]; if(key==='burn'){ delete u.st.burnDmg; delete u.st.burnCap; } k++; } }); };

  C.actNext = u=>{
    if(!u.alive) return;
    const q = sf.queue;
    for(let p=q.length-1; p>sf.queuePos; p--) if(q[p].side===u.side && q[p].idx===u.idx) q.splice(p, 1);
    q.splice(sf.queuePos+1, 0, { side:u.side, idx:u.idx, speed:effSpeed(u) });
  };
  return C;
}
// 실제 행동 실행(내 정령·적 공통). act: basic | s1 | s2
function performAction(sf, a, act, tSide, tIdx){
  const C = makeActCtx(sf, a, tSide, tIdx);
  if(!C.t) return C;
  const name = SPIRITS[a.key].name;
  if(act==='basic'){
    C.hit(C.t, 1);
    if(a.line==='fire_b' && unitPG(a)>=1 && C.t.alive && Math.random() < [0,.3,.4,.5,.6][unitPG(a)]) C.burn(C.t, 1);
    pushLog(sf, (a.side==='enemy'?'적 ':'')+name+' 공격 → '+skillUnitName(tSide, C.t));
  }else{
    const sk = unitSkill(a, act);
    if(act==='s2'){ const sg = unitSG(a); C.g = sg; C.P = arr=>arr[sg]; } // (v225) 각성으로 연 스킬2는 에픽 수치부터
    sk.run(C);
    if(act==='s1') a.cd1 = C.resetCd1 ? 0 : unitCd(a, 's1'); else a.cd2 = unitCd(a, 's2');
    pushLog(sf, (a.side==='enemy'?'적 ':'')+name+' '+sk.name+' → '+skillUnitName(tSide, C.t));
  }
  if(a.st.empower) delete a.st.empower;
  setFx(sf, { kind:'act', actorSide:a.side, actorIdx:a.idx, hits:C.hits });
  sf.actSeq = (sf.actSeq||0) + 1; // (v165) 레이드 동기화용 행동 번호
  return C;
}

function raidWeekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; } // 이번 주 월요일 0시
function raidWeekKey(){ const d = raidWeekStart(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function raidBossUnlocked(i){ if(i<=0) return true; const prev = RAID_BOSSES[i-1]; const pr = state.raidProgress && state.raidProgress[prev.id]; return !!(pr && pr.length); }
function raidWeekBoss(){ // (v173) 이름은 그대로 두고 '지금 선택한 레이드 보스'를 돌려줌 — 모든 보스를 순서대로 해금하는 방식
  const i = RAID_BOSSES.findIndex(x=>x.id===state.raidBossSel);
  return (i>=0 && raidBossUnlocked(i)) ? RAID_BOSSES[i] : RAID_BOSSES[0];
}
function raidMarkClear(sf){ if(!sf || !sf.result || !sf.result.win || sf.result.surrender) return; state.raidProgress = state.raidProgress || {}; const l = state.raidProgress[sf.raidBossId] || []; if(!l.includes(sf.raidDiff)){ state.raidProgress[sf.raidBossId] = l.concat(sf.raidDiff); save(); } }
function raidBossHpMult(){ return BOSS_HP_MULT * 7; } // 8마리가 같이 때리는 만큼 오래 버티게(초기값)

let raidNet = { db:null, user:null, room:null, uid:null, ready:false, failed:false, canWrite:null,
  code:null, role:null, doc:null, unsubs:[], roomH:null, partnerOnline:null, partnerOffSince:0, names:{},
  myPicks:[null,null,null,null], selSlot:0, battleSeq:0, lastBattleSeq:-1, syncQueued:false, pendingSeq:0,
  starting:false, tick:null, rewardText:'', busy:false };
let raidWriteChain = Promise.resolve();

function raidMine(idx){ if(state.skillFight && state.skillFight.mode==='duel') return true; return (raidNet.role==='guest' ? P2_SLOTS : P1_SLOTS).includes(idx); }
function isDuelRoom(){ return !!(raidNet.doc && raidNet.doc.kind==='duel'); }
// (v174) 실시간 결투: 방장 화면 기준 방장=아군(me)·손님=적(enemy). 손님 화면에는 좌우를 뒤집어서 자기 편이 왼쪽에 보이게 함
function duelMirror(sf0, name){
  const sf = JSON.parse(JSON.stringify(sf0)), flip = x=> x==='me' ? 'enemy' : (x==='enemy' ? 'me' : x);
  const m = sf.myUnits; sf.myUnits = sf.enemyUnits; sf.enemyUnits = m;
  sf.myUnits.forEach(u=>u.side='me'); sf.enemyUnits.forEach(u=>u.side='enemy');
  (sf.queue||[]).forEach(q=>{ q.side = flip(q.side); });
  if(sf.lastFx){ if(sf.lastFx.actorSide) sf.lastFx.actorSide = flip(sf.lastFx.actorSide); (sf.lastFx.hits||[]).forEach(h=>{ h.side = flip(h.side); }); }
  if(sf.result) sf.result = Object.assign({}, sf.result, { win: !sf.result.win });
  sf.duelName = name; sf.mirrored = true;
  return sf;
}
function raidIsNet(){ return raidNet.role==='host' || raidNet.role==='guest'; }
function raidPartnerUid(){ const d = raidNet.doc; if(!d) return null; return raidNet.role==='host' ? d.guest : d.host; }
function raidPartnerGone(){
  if(raidNet.role==='solo') return true;
  if(!raidNet.roomH) return false; // 연결 여부를 알 수 없으면 대행하지 않음
  return raidNet.partnerOnline===false && raidNet.partnerOffSince>0 && Date.now()-raidNet.partnerOffSince >= RAID_OFFLINE_GRACE_MS;
}
function raidRef(){ return raidNet.db.doc('raids/'+raidNet.code); }
function raidActRef(){ return raidNet.db.doc('raidActs/'+raidNet.code); }
function raidNameOf(id){
  if(!id) return '팀원';
  if(raidNet.names[id]!==undefined) return raidNet.names[id] || '팀원';
  raidNet.names[id] = '';
  if(raidNet.user) raidNet.user.profiles([id]).then(ps=>{ const p = ps && ps[id]; raidNet.names[id] = (p && p.name) || ''; raidRefreshScreen(); if(typeof friendRefresh==='function') friendRefresh(); }).catch(()=>{});
  return '팀원';
}
function raidNetError(e){
  const code = e && e.code;
  if(code==='invalid_argument') toast('저장 권한 없음 — 이 게임 링크에 편집 권한 초대 필요');
  else if(code==='quota_exceeded') toast('서버 저장 공간 가득 참');
  else toast('연결 오류 — 잠시 후 다시 시도');
}
function raidUpdate(patch){
  const ref = raidRef();
  raidWriteChain = raidWriteChain.then(()=>ref.update(patch)).then(()=>raidNudge()).catch(raidNetError);
  return raidWriteChain;
}
function raidNudge(){ if(raidNet.roomH) raidNet.roomH.emit('nudge', {c:raidNet.code}).catch(()=>{}); }
function raidCleanPicks(arr){
  const out = [];
  for(let i=0;i<4;i++){
    const p = (arr && typeof arr==='object') ? arr[i] : null;
    out.push(p && typeof p==='object' && typeof p.key==='string' && SPIRITS[p.key] && Number.isFinite(p.atk) ? { key:p.key, atk: Math.max(1, Math.min(1e7, p.atk)), arm: Number.isFinite(p.arm) ? Math.max(1, Math.min(10, p.arm)) : 1, rune: runeValid(p.rune) ? { id:p.rune.id, tier:p.rune.tier } : null, aw: Number.isFinite(p.aw) ? Math.max(0, Math.min(AWAKEN_MAX, Math.floor(p.aw))) : 0 } : null);
  }
  return out;
}
function raidCleanDoc(d){
  if(!d || typeof d!=='object' || typeof d.host!=='string') return null;
  return { code: String(d.code||''), host: d.host, guest: typeof d.guest==='string' ? d.guest : null,
    status: ['lobby','pick','battle','done','closed'].includes(d.status) ? d.status : 'closed',
    bossId: raidBossById(d.bossId) ? d.bossId : RAID_BOSSES[0].id, diff: raidDiffById(d.diff).id, kind: d.kind==='duel' ? 'duel' : 'raid',
    duelPicks: (d.duelPicks && typeof d.duelPicks==='object') ? d.duelPicks : {},
    picks: (d.picks && typeof d.picks==='object') ? d.picks : {}, ready: (d.ready && typeof d.ready==='object') ? d.ready : {},
    battleJson: typeof d.battleJson==='string' ? d.battleJson : null, battleSeq: Number.isFinite(d.battleSeq) ? d.battleSeq : 0,
    createdAt: Number.isFinite(d.createdAt) ? d.createdAt : 0,
    surrender: (d.surrender && typeof d.surrender==='object') ? d.surrender : {} };
}
function raidParseBattle(json){
  try{
    const sf = JSON.parse(json);
    const uOk = u => u && typeof u==='object' && SPIRITS[u.key] && LINE_KITS[u.line] && Number.isFinite(u.hp) && Number.isFinite(u.maxHp) && u.maxHp>0 && Number.isFinite(u.atk) && u.st && typeof u.st==='object' && Number.isInteger(u.idx);
    if(!sf || (sf.mode!=='raid' && sf.mode!=='duel') || !Array.isArray(sf.myUnits) || !Array.isArray(sf.enemyUnits) || !sf.myUnits.every(uOk) || !sf.enemyUnits.every(uOk) || !Array.isArray(sf.queue) || !Number.isFinite(sf.queuePos)) return null;
    return sf;
  }catch(e){ return null; }
}

// ---------- 전투 구성 ----------
function buildRaidFight(hostPicks, guestPicks, bossId, diffId){
  const myUnits = [];
  const add = (arr, slots, owner)=> raidCleanPicks(arr).forEach((p,i)=>{ if(p){ const u = makeBattleUnit('me', slots[i], p.key, p.atk, ALLY_HP_MULT, 1, p.arm, p.rune||null, p.aw||0); u.owner = owner; myUnits.push(u); } });
  add(hostPicks, P1_SLOTS, 'host'); add(guestPicks, P2_SLOTS, 'guest');
  const info = raidBossById(bossId) || raidWeekBoss();
  const diff = raidDiffById(diffId);
  const per = bossWaveNormalPower(RAID_BOSS_STAGE) * BOSS_POWER_MULT * diff.atk;
  const boss = makeBattleUnit('enemy', 1, info.element+'_legendary_a', per*ELEMENT_ATK_MULT[info.element], raidBossHpMult()*diff.hp/diff.atk);
  boss.isBoss = true; boss.dispName = info.name; boss.bossIcon = info.icon; ensureGroggy(boss);
  const sf = { v:168, mode:'raid', stageIdx: RAID_BOSS_STAGE, raidBossId: info.id, raidDiff: diff.id, round:1, phase:'acting', queue:[], queuePos:0, myUnits, enemyUnits:[boss],
    log:['레이드 시작!'], result:null, fxSeq:0, lastFx:null, actSeq:0 };
  startRoundQueue(sf);
  return sf;
}
function applyRaidGimmicks(sf){
  const boss = sf.enemyUnits.find(u=>u.isBoss && u.alive); if(!boss) return;
  const info = raidBossById(sf.raidBossId); if(!info) return;
  const r = sf.round;
  info.gimmicks.forEach(g=>{
    const allies = aliveUnits(sf.myUnits); if(!allies.length) return;
    if(g.id==='blizzard' && r%3===0){ allies.forEach(u=>{ dealDamage(sf, boss, u, 0.5, {noCrit:true}); if(u.alive) u.st.slow = {v:15, r:2}; }); pushLog(sf, info.icon+' 눈보라!'); }
    else if((g.id==='iceShell' || g.id==='bark') && !sf.raidShellUsed && boss.hp/boss.maxHp < 0.5){ sf.raidShellUsed = true; boss.st.shield = (boss.st.shield||0) + Math.round(boss.maxHp*0.2); pushLog(sf, info.icon+' '+g.name+'!'); }
    else if(g.id==='brand'){ const t = allies.reduce((x,y)=> y.hp>x.hp ? y : x); t.st.burnCap = Math.max(t.st.burnCap||5, 5); t.st.burn = Math.min(t.st.burnCap, (t.st.burn||0)+3); t.st.burnDmg = Math.max(t.st.burnDmg||0, Math.round(boss.atk*0.15)); pushLog(sf, info.icon+' 낙인 → '+skillUnitName('me', t)); }
    else if(g.id==='rage' && r%4===0){ boss.atk = Math.round(boss.atk*1.25); pushLog(sf, info.icon+' 격노! 공격력 상승'); }
    else if(g.id==='gaze'){ const t = allies.reduce((x,y)=> y.atk>x.atk ? y : x); t.st.curse = {v:0.25, r:2}; pushLog(sf, info.icon+' 응시 → '+skillUnitName('me', t)); }
    else if(g.id==='pulse' && r%3===0){ allies.forEach(u=>dealDamage(sf, boss, u, 0.6, {noCrit:true})); pushLog(sf, info.icon+' 파동!'); }
    else if(g.id==='regrowth'){ boss.hp = Math.min(boss.maxHp, boss.hp + Math.round(boss.maxHp*0.025)); }
    else if(g.id==='verdict' && r%3===0){ const t = allies.reduce((x,y)=> y.hp/y.maxHp < x.hp/x.maxHp ? y : x); dealDamage(sf, boss, t, 2, {noCrit:true}); pushLog(sf, info.icon+' 판결 → '+skillUnitName('me', t)); }
    else if(g.id==='halo'){ ['burn','burnDmg','burnCap','poison','curse','slow','chill','web','bind','freeze'].forEach(k=>{ delete boss.st[k]; }); }
  });
}
function checkRaidOutcome(sf){
  if(sf.result) return true;
  if(!aliveUnits(sf.enemyUnits).length){ sf.result = { win:true, rounds:sf.round }; raidMarkClear(sf); raidGrantReward(sf); return true; }
  if(!aliveUnits(sf.myUnits).length){ sf.result = { win:false, rounds:sf.round }; raidGrantReward(sf); return true; }
  return false;
}
function raidGrantReward(sf){
  if(sf && sf.mode==='duel') return;
  const rcode = (sf && typeof sf.alone==='string') ? sf.alone : raidNet.code; // (v225) 혼자 도전은 전투에 적힌 코드로 보상(새로고침해도 한 번만)
  if(!sf || !sf.result || !rcode || (!sf.alone && !raidIsNet())) return;
  state.raidRewarded = Array.isArray(state.raidRewarded) ? state.raidRewarded : [];
  if(state.raidRewarded.includes(rcode)) return;
  state.raidRewarded = state.raidRewarded.concat(rcode).slice(-30);
  if(!raidUseTicket(rcode)){ raidNet.rewardText = '<img class="uic" src="assets/ui/ic_pass.webp" alt=""> 입장권이 없어 이번 판은 보상 없음'; save(); return; }
  if(sf.result.win){
    const dd = raidDiffById(sf.raidDiff), wk = raidWeekKey();
    if(!state.raidWeekDone || state.raidWeekDone.week!==wk) state.raidWeekDone = { week: wk, diffs: [] };
    const first = !state.raidWeekDone.diffs.includes(dd.id);
    state.enhanceStone = (state.enhanceStone||0) + dd.stone;
    const gems = RAID_GEMS[dd.id] || 0; state.raidGems = (state.raidGems||0) + gems; // (v172) 룬석 = 레이드 상점 재화
    if(first){ grantItems(dd.weekly); state.raidWeekDone.diffs.push(dd.id); if(dd.id!=='easy') state.raidWeekCleared = wk; }
    const itemTxt = it=> Object.keys(it).map(k=>({summon:'<img class="uic" src="assets/ui/ic_tk_summon.webp" alt=""> 소환권',rare:'<img class="uic" src="assets/ui/ic_tk_rare.webp" alt=""> 레어 확정권',epic:'<img class="uic" src="assets/ui/ic_pass.webp" alt=""> 에픽 확정권',equip:'<img class="uic" src="assets/ui/ic_tk_equip.webp" alt=""> 장비 소환권'}[k]||k)+' +'+it[k]).join(' · ');
    raidNet.rewardText = '<b style="font-size:15px; color:#ff9ab0;"><img class="uic" src="assets/ui/ic_runestone.webp" alt="룬석"> 고대 룬석 +'+gems+'</b><br>['+dd.name+'] <img class="uic" src="assets/ui/ic_stone.webp" alt="강화석"> 강화석 +'+dd.stone+(first ? '<br>'+itemTxt(dd.weekly)+' (이번 주 '+dd.name+' 첫 승리)' : '');
    raidNet.gotStones = true;
    // (v171) 하드부터 보스 속성 장비 드롭(레전더리 먼저 굴리고, 안 나오면 에픽) — 보스가 두른 속성의 무기·방어구가 떨어진다는 설정
    if(dd.gear){
      const bossInfo = raidBossById(sf.raidBossId), x = Math.random();
      const rar = x < dd.gear.legendary ? 'legendary' : (x < dd.gear.legendary + dd.gear.epic ? 'epic' : null);
      if(rar && bossInfo){
        const gk = equipKey(EQUIP_SLOTS[Math.floor(Math.random()*EQUIP_SLOTS.length)], bossInfo.element, rar);
        addEquip(gk); save();
        const gi = equipInfo(gk);
        raidNet.rewardText += '<br><b style="color:'+RARITY_INFO[rar].color+';">'+(rar==='legendary'?'✨ ':'')+gi.icon+' '+gi.name+' ('+RARITY_INFO[rar].name+') 획득!</b>';
      }
    }
  }else{
    state.enhanceStone = (state.enhanceStone||0) + 30;
    raidNet.rewardText = '<img class="uic" src="assets/ui/ic_stone.webp" alt="강화석"> 강화석 +30 (참가 보상)';
  }
  save();
}
function raidResultOverlayHtml(sf){
  const r = sf.result;
  let h = '<div class="bs-result"><div class="bs-rcard '+(r.win?'win':'lose')+'">';
  h += r.win ? '<div class="bs-ricon"><img class="uic" src="assets/ui/ic_trophy.webp" alt=""></div><div class="bs-rtitle">레이드 승리!</div>' : (r.surrender ? '<div class="bs-ricon">🏳️</div><div class="bs-rtitle">레이드 포기</div>' : '<div class="bs-ricon"><img class="uic" src="assets/ui/ic_skull.webp" alt=""></div><div class="bs-rtitle">패배</div>');
  h += '<div class="bs-rsub">'+r.rounds+'라운드'+(sf.alone?' · 혼자 도전':(raidNet.role==='solo'?' · 연습(보상 없음)':''))+'</div>';
  if(raidNet.rewardText) h += '<div class="bs-rrew"><div>'+raidNet.rewardText+'</div></div>';
  h += '<div class="bs-rbtns">'+(r.win && raidNet.gotStones ? '<button class="btn" id="raidOpenStonesBtn" style="background:linear-gradient(180deg,#ff8ab0,#c0416b);"><img class="uic" src="assets/ui/ic_runestone.webp" alt="룬석"> 레이드 상점</button>' : '')+'<button class="btn'+(r.win && raidNet.gotStones?' secondary':'')+'" id="skillResultCloseBtn">확인</button></div></div></div>';
  return h;
}

// ---------- 전투 동기화 ----------
function afterFightMutation(){
  const sf = state.skillFight;
  if(sf && (sf.mode==='raid' || (sf.mode==='duel' && raidIsNet())) && raidNet.role==='host') raidHostSync();
}
function raidHostSync(){
  if(raidNet.role!=='host' || !raidNet.code || !raidNet.db || raidNet.syncQueued) return;
  raidNet.syncQueued = true;
  raidWriteChain = raidWriteChain.then(async ()=>{
    raidNet.syncQueued = false;
    const sf = state.skillFight; if(!sf || (sf.mode!=='raid' && sf.mode!=='duel') || !raidNet.code) return;
    raidNet.battleSeq += 1;
    const patch = { battleJson: JSON.stringify(sf), battleSeq: raidNet.battleSeq };
    if(sf.result) patch.status = 'done';
    await raidRef().update(patch);
    raidNudge();
  }).catch(e=>{ raidNet.syncQueued = false; raidNetError(e); });
}
function raidHostApplyRemote(a){
  const sf = state.skillFight;
  if(raidNet.role!=='host' || !sf || (sf.mode!=='raid' && sf.mode!=='duel') || sf.result || !a || typeof a!=='object') return;
  if(a.by!==raidPartnerUid() || a.seq!==(sf.actSeq||0)+1) return;
  const duel = sf.mode==='duel', gSide = duel ? 'enemy' : 'me';
  if(settleQueue(sf)!==gSide) return;
  const cur = sf.queue[sf.queuePos];
  if((!duel && !P2_SLOTS.includes(cur.idx)) || cur.idx!==a.idx) return;
  const u = unitAt(sf, gSide, cur.idx); if(!u || !u.alive) return;
  if(!['basic','s1','s2'].includes(a.act) || !skillAvailable(u, a.act)) return;
  let tSide = duel ? (a.tSide==='me' ? 'enemy' : (a.tSide==='enemy' ? 'me' : a.tSide)) : a.tSide, tIdx = a.tIdx; // 손님 화면은 좌우가 뒤집혀 있음
  const gSk = unitSkill(u, a.act), gHarm = !gSk || gSk.kind==='harm';
  const tauntT = (tSide===foeOf(gSide) && gHarm) ? aliveUnits(sideUnits(sf, tSide)).filter(x=>x.st.taunt) : []; // (v216) 결투에서 친구가 공격할 때도 내 편 도발을 따름
  if(!['me','enemy'].includes(tSide) || !Number.isInteger(tIdx) || !skillTargetable(sf, tSide, tIdx) || (tauntT.length && !tauntT.some(x=>x.idx===tIdx))){ const c = aiChooseAction(sf, u); if(!c) return; tSide = c.side; tIdx = c.idx; }
  clearTimeout(skillPumpTimer); skillPumpTimer = null;
  performAction(sf, u, a.act, tSide, tIdx);
  sf.queuePos++;
  checkSkillStageOutcome(sf);
  save();
  showSkillStageScreen();
  afterFightMutation();
}
function raidGuestSubmit(act, tSide, tIdx){
  const sf = state.skillFight; if(!sf || sf.result || raidNet.role!=='guest') return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos]; if(!raidMine(cur.idx)) return;
  const seq = (sf.actSeq||0) + 1;
  if(raidNet.pendingSeq===seq) return;
  raidNet.pendingSeq = seq;
  raidNet.db.doc('raidActs/'+raidNet.code).set({ seq, by: raidNet.uid, idx: cur.idx, act, tSide, tIdx, round: sf.round })
    .then(()=>raidNudge())
    .catch(e=>{ raidNet.pendingSeq = 0; raidNetError(e); showSkillStageScreen(); });
  skillSel.key = null;
  showSkillStageScreen();
}
function raidGuestPump(sf){
  if(sf.result || raidNet.pendingSeq > (sf.actSeq||0)) return;
  if(settleQueue(sf)!=='me') return;
  const cur = sf.queue[sf.queuePos];
  if(!raidMine(cur.idx) || !state.skillAuto) return;
  const key = (sf.actSeq||0)+1;
  skillPumpTimer = setTimeout(()=>{
    skillPumpTimer = null;
    const s = state.skillFight; if(!s || s.mode!=='raid' || (s.actSeq||0)+1!==key || settleQueue(s)!=='me') return;
    const u = unitAt(s, 'me', s.queue[s.queuePos].idx); if(!u || !raidMine(u.idx)) return;
    const c = aiChooseAction(s, u); if(c) raidGuestSubmit(c.act, c.side, c.idx);
  }, SKILL_ENEMY_STEP_MS*skillSpeedMult());
}

// ---------- 방 문서 처리 ----------
function raidOnDoc(snap){
  if(!raidNet.code) return;
  if(!snap || !snap.exists){
    const sf = state.skillFight;
    if(sf && sf.mode==='raid' && sf.result) return; // 결과 화면 보는 중엔 방이 지워져도 그대로 둠
    raidLocalCleanup(); toast('방이 닫힘'); render(); return;
  }
  const d = raidCleanDoc(snap.data()); if(!d) return;
  raidNet.doc = d;
  if(raidNet.role==='guest' && d.guest!==raidNet.uid){ raidLocalCleanup(); toast('방에서 나감'); render(); return; }
  if(d.status==='closed'){ const sf = state.skillFight; if(sf && sf.mode==='raid' && sf.result) return; raidLocalCleanup(); state.skillFight = null; unmountBattleScreen(); save(); toast('레이드 해산'); render(); return; }
  raidNameOf(raidPartnerUid());
  if(raidNet.role==='host' && raidNet.lastGuest && !d.guest && (d.status==='lobby')) toast('팀원이 나감');
  raidNet.lastGuest = d.guest;
  if(d.status==='lobby'){ raidNet.picksInit = false; showRaidLobbyModal(); return; }
  if(d.status==='pick'){
    if(raidNet.role==='host' && d.guest && d.ready[d.host] && d.ready[d.guest] && !raidNet.starting) raidHostStartBattle(d);
    else if(!raidNet.starting) showRaidPickModal();
    return;
  }
  if(!d.battleJson) return;
  { // (v169) 포기 투표: 둘 다 동의하면 방장이 패배 처리
    const sig = JSON.stringify(d.surrender||{});
    const both = d.guest && d.surrender[d.host]===true && d.surrender[d.guest]===true;
    if(raidNet.role==='host' && d.kind==='duel' && (d.surrender[d.host]===true || (d.guest && d.surrender[d.guest]===true)) && state.skillFight && state.skillFight.mode==='duel' && !state.skillFight.result){
      const sf = state.skillFight; clearTimeout(skillPumpTimer); skillPumpTimer = null;
      sf.result = { win: d.surrender[d.host]!==true, rounds: sf.round, forfeit:true }; save(); showSkillStageScreen(); afterFightMutation();
    }
    if(raidNet.role==='host' && both && state.skillFight && state.skillFight.mode==='raid' && !state.skillFight.result){
      const sf = state.skillFight; clearTimeout(skillPumpTimer); skillPumpTimer = null;
      sf.result = { win:false, rounds: sf.round, surrender:true }; pushLog(sf, '🏳️ 레이드를 포기했다');
      raidNet.rewardText = '🏳️ 포기 — 보상 없음';
      save(); showSkillStageScreen(); afterFightMutation();
    }
    if(sig!==raidNet.surSig){ raidNet.surSig = sig; if(document.getElementById('battleScreen') && state.skillFight && state.skillFight.mode==='raid') showSkillStageScreen(); }
  }
  if(raidNet.role==='guest'){
    if(d.battleSeq===raidNet.lastBattleSeq) return;
    const sf0 = raidParseBattle(d.battleJson); if(!sf0) return;
    const sf = sf0.mode==='duel' ? duelMirror(sf0, raidNameOf(d.host)) : sf0;
    const first = !state.skillFight || state.skillFight.mode!==sf.mode;
    raidNet.lastBattleSeq = d.battleSeq;
    clearTimeout(skillPumpTimer); skillPumpTimer = null;
    state.skillFight = sf;
    if(raidNet.pendingSeq && (sf.actSeq||0) >= raidNet.pendingSeq) raidNet.pendingSeq = 0;
    if(sf.mode==='duel'){ if(first){ skillSel.key = null; skillIntroPending = true; activeTab = 'home'; closeModal(); render(); } }
    else{
      if(sf.result && sf.result.surrender){ raidNet.rewardText = '🏳️ 포기 — 보상 없음'; state.raidRewarded = (state.raidRewarded||[]).concat(raidNet.code).slice(-30); }
      else if(sf.result){ raidMarkClear(sf); raidGrantReward(sf); }
      if(first){ raidUseTicket(raidNet.code); skillSel.key = null; skillIntroPending = true; activeTab = 'raid'; render(); }
    }
    showSkillStageScreen();
  }else if(!state.skillFight || (state.skillFight.mode!=='raid' && state.skillFight.mode!=='duel')){ // 방장이 새로고침한 뒤 이어하기
    const sf = raidParseBattle(d.battleJson); if(!sf) return;
    raidNet.battleSeq = d.battleSeq;
    state.skillFight = sf; skillSel.key = null; activeTab = 'raid'; render();
    showSkillStageScreen();
  }
}
function raidOnActDoc(snap){ if(raidNet.role==='host' && snap && snap.exists) raidHostApplyRemote(snap.data()); }
async function raidAttach(code, role){
  raidNet.code = code; raidNet.role = role; raidNet.doc = null; raidNet.battleSeq = 0; raidNet.lastBattleSeq = -1;
  raidNet.pendingSeq = 0; raidNet.starting = false; raidNet.rewardText = ''; raidNet.gotStones = false; raidNet.partnerOnline = null; raidNet.partnerOffSince = 0;
  raidNet.myPicks = [null,null,null,null]; raidNet.selSlot = 0; raidNet.picksInit = false;
  state.raidSession = { code, role }; save();
  raidNet.unsubs.push(raidRef().onSnapshot(raidOnDoc, e=>raidNetError(e)));
  if(role==='host') raidNet.unsubs.push(raidActRef().onSnapshot(raidOnActDoc, ()=>{}));
  if(raidNet.room){
    try{
      const h = await raidNet.room.join('raid-'+code.toLowerCase());
      if(raidNet.code!==code){ h.leave().catch(()=>{}); return; }
      raidNet.roomH = h;
      h.presence({ uid: raidNet.uid, role }).catch(()=>{});
      raidNet.unsubs.push(h.onPeers(ch=>{
        const pid = raidPartnerUid();
        const on = !!pid && ch.peers.some(p=>!p.isMe && (p.by===pid || (p.presence && p.presence.uid===pid)));
        if(on!==raidNet.partnerOnline){
          raidNet.partnerOnline = on; raidNet.partnerOffSince = on ? 0 : Date.now();
          raidRefreshScreen();
        }
      }, ()=>{}));
      raidNet.unsubs.push(h.on('nudge', m=>{
        if(m.sameTab) return;
        if(raidNet.role==='host') raidActRef().get().then(raidOnActDoc).catch(()=>{});
        else raidRef().get().then(raidOnDoc).catch(()=>{});
      }, ()=>{}));
    }catch(e){ raidNet.roomH = null; }
  }
  clearInterval(raidNet.tick);
  raidNet.tick = setInterval(()=>{ // 끊김 판정 시간이 지나면 해산 버튼·AI 대행이 켜지도록 화면만 다시 그림(쓰기 없음)
    if(!raidNet.code || raidNet.partnerOnline!==false) return;
    if(Date.now()-raidNet.partnerOffSince >= RAID_OFFLINE_GRACE_MS && !raidNet.graceShown){ raidNet.graceShown = true; raidRefreshScreen(); }
  }, 3000);
}
function raidLocalCleanup(){
  raidNet.unsubs.forEach(f=>{ try{ f(); }catch(e){} }); raidNet.unsubs = [];
  if(raidNet.roomH){ raidNet.roomH.leave().catch(()=>{}); raidNet.roomH = null; }
  clearInterval(raidNet.tick); raidNet.tick = null; raidNet.graceShown = false;
  const wasModal = raidNet.code && document.getElementById('raidModal');
  raidNet.code = null; raidNet.role = null; raidNet.doc = null; raidNet.pendingSeq = 0; raidNet.starting = false;
  state.raidSession = null; save();
  if(wasModal) closeModal();
}
function raidRefreshScreen(){
  if(!raidNet.code || !raidNet.doc) return;

  if(s==='lobby' && document.getElementById('raidModal')) showRaidLobbyModal();
  else if(s==='pick' && document.getElementById('raidModal')) showRaidPickModal();

function raidNewCode(){ let c = ''; for(let i=0;i<6;i++) c += RAID_CODE_CHARS[Math.floor(Math.random()*RAID_CODE_CHARS.length)]; return c; }
async function raidCreateRoom(kind){
  kind = (kind==='duel') ? 'duel' : 'raid';
  if(!raidNet.ready || raidNet.busy) return false;
  if(kind==='duel' && !duelPayload(myDuelDeck()).some(Boolean)){ toast('먼저 결투 덱을 정하기'); return false; }
  raidNet.busy = true; render();
  try{
    let code = null;
    for(let t=0; t<5 && !code; t++){
      const c = raidNewCode(), ref = raidNet.db.doc('raids/'+c);
      const lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1000 }); // 짧게 — 만들자마자 들어오는 친구를 막지 않도록
      if(!lease.acquired) continue;
      const snap = await ref.get();
      const old = snap.exists ? raidCleanDoc(snap.data()) : null;
      if(old && old.status!=='closed' && Date.now()-old.createdAt < 24*3600000) continue; // 아직 쓰이는 코드
      await ref.set({ code:c, kind, host: raidNet.uid, guest: null, status:'lobby', bossId: raidWeekBoss().id, diff: raidDiffById(state.raidDiff).id, weekKey: raidWeekKey(), duelPicks: kind==='duel' ? { [raidNet.uid]: duelPayload(myDuelDeck()) } : {},
        picks:{}, ready:{}, battleJson:null, battleSeq:0, createdAt: Date.now() });
      code = c;
    }
    if(!code){ toast('방 만들기 실패 — 다시 시도'); return; }
    await raidAttach(code, 'host');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}
async function raidJoinRoom(input){
  if(!raidNet.ready || raidNet.busy) return;
  const code = String(input||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){ toast('방 코드는 6자리'); return; }
  raidNet.busy = true; render();
  try{
    const ref = raidNet.db.doc('raids/'+code);
    let lease = null;
    for(let t=0; t<6; t++){ // 방장이 방을 막 만든 직후거나 다른 사람이 입장 처리 중이면 잠깐 기다렸다 재시도
      lease = await ref.acquire({ holder: raidNet.uid, ttlMs: 1500 });
      if(lease.acquired) break;
      await new Promise(r=>setTimeout(r, 400));
    }
    if(!lease || !lease.acquired){ toast('다른 사람이 입장 중 — 잠시 후 다시 시도'); return; }
    const snap = await ref.get();
    const d = snap.exists ? raidCleanDoc(snap.data()) : null;
    if(!d || d.status==='closed' || d.status==='done'){ toast('없는 방'); return; }
    if(d.host===raidNet.uid){ await raidAttach(code, 'host'); return; }
    if(d.guest && d.guest!==raidNet.uid){ toast('방이 꽉 참 (2/2)'); return; }
    if(d.status!=='lobby' && d.guest!==raidNet.uid){ toast('이미 시작된 방'); return; }
    if(d.kind==='duel' && !duelPayload(myDuelDeck()).some(Boolean)){ toast('먼저 결투 덱을 정하기 (친구 창)'); return; }
    if(d.guest!==raidNet.uid) await ref.update(Object.assign({ guest: raidNet.uid, ready: { [raidNet.uid]: false } }, d.kind==='duel' ? { duelPicks: { [raidNet.uid]: duelPayload(myDuelDeck()) } } : {}));
    await raidAttach(code, 'guest');
  }catch(e){ raidNetError(e); }
  finally{ raidNet.busy = false; render(); }
}

// ===================== (v168) 친구 — Firebase(깃헙 버전)에서만 동작 =====================
// players/<uid> = {name, code} · friendCodes/<8자리> = uid · friends/<나>/<친구> = true(내 목록은 나만 수정)
// friendReqs/<받는사람>/<보낸사람> = 친구 요청 · invites/<받는사람>/<보낸사람> = 레이드 초대 · 접속 표시는 'online' 방 presence
let friendNet = { on:false, code:null, name:'', friends:{}, reqs:{}, invites:{}, online:new Set(), unsubs:[], roomH:null, busy:false, reps:{}, watch:{}, repSent:null, seen:{} };
function friendsAvailable(){ return raidNet.ready && raidNet.backend==='firebase'; }
function friendCleanCode(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8); }
async function friendInit(){
  if(!friendsAvailable() || friendNet.on) return;
  const db = raidNet.db, uid = raidNet.uid;
  const me = await db.doc('players/'+uid).get();
  const d = (me.exists && me.data() && typeof me.data()==='object') ? me.data() : {};
  let pendName = ''; try{ pendName = cleanName(localStorage.getItem(NAME_PENDING_KEY)); }catch(e){}
  const name = pendName || ((typeof d.name==='string' && d.name.trim()) ? d.name.slice(0,12) : '소환사-'+uid.slice(0,4));
  let code = (typeof d.code==='string' && /^[A-Z0-9]{8}$/.test(d.code)) ? d.code : null;
  if(!code){
    for(let t=0; t<6 && !code; t++){
      const c = (raidNewCode()+raidNewCode()).slice(0,8), r = db.doc('friendCodes/'+c);
      const s = await r.get(); if(s.exists) continue;
      try{ await r.set(uid); code = c; }catch(e){}
    }
  }
  // (v225) 통째로 set 하면 같은 곳에 저장된 결투 덱(players/<나>/duel)까지 지워져서 칸별로 저장
  await db.doc('players/'+uid+'/name').set(name); await db.doc('players/'+uid+'/code').set(code||'');
  friendNet.code = code; friendNet.on = true; friendSetName(name);
  if(pendName){ try{ localStorage.removeItem(NAME_PENDING_KEY); }catch(e){} }
  const obj = s=> (s && s.exists && s.data() && typeof s.data()==='object') ? s.data() : {};
  mailInit();
  friendNet.unsubs.push(db.doc('friends/'+uid).onSnapshot(s=>{ friendNet.friends = obj(s); friendWatchSync(); friendRefresh(); }, ()=>{}));
  friendPushRep(); friendSeenPing(true);
  friendNet.unsubs.push(db.doc('friendReqs/'+uid).onSnapshot(s=>{ friendNet.reqs = obj(s); friendHandleReplies(); friendRefresh(); }, ()=>{}));
  friendNet.unsubs.push(db.doc('invites/'+uid).onSnapshot(s=>{
    const v = obj(s), prev = friendNet.invites; friendNet.invites = v;
    Object.keys(v).forEach(k=>{ const iv = v[k]; if(!iv || typeof iv!=='object') return;
      if(iv.kind==='decline'){ raidInviteDeclined(k, iv); return; } // (v239) 내가 보낸 초대를 상대가 거절
      if((!prev[k] || prev[k].code!==iv.code) && Date.now()-(iv.t||0) < 10*60000) inviteNotice(k, iv); });
    friendRefresh();
  }, ()=>{}));
  if(raidNet.room){
    try{
      const h = await raidNet.room.join('online'); friendNet.roomH = h;
      h.presence({ uid }).catch(()=>{});
      friendNet.unsubs.push(h.onPeers(ch=>{ friendNet.online = new Set(ch.peers.map(p=>p.by)); friendRefresh(); }, ()=>{}));
    }catch(e){}
  }
  friendRefresh();
}
// (v225) 친구 이름·대표 정령을 실시간으로 받음 — 예전엔 이름을 한 번 받아 캐시해서, 친구가 이름을 바꿔도 앱을 다시 켜야 보였음
function friendWatchSync(){
  const want = new Set(friendList());
  Object.keys(friendNet.watch).forEach(id=>{ if(!want.has(id)){ friendNet.watch[id].forEach(u=>{ try{ u(); }catch(e){} }); delete friendNet.watch[id]; delete friendNet.reps[id]; } });
  want.forEach(id=>{
    if(friendNet.watch[id]) return;
    const db = raidNet.db, val = s=> (s && s.exists) ? s.data() : null;
    friendNet.watch[id] = [
      db.doc('players/'+id+'/name').onSnapshot(s=>{ const v = val(s); if(typeof v==='string' && v.trim()){ const n = v.slice(0,12); if(raidNet.names[id]!==n){ raidNet.names[id] = n; friendRefresh(); } } }, ()=>{}),
      db.doc('players/'+id+'/rep').onSnapshot(s=>{ const v = val(s), k = (typeof v==='string' && SPIRITS[v]) ? v : null; if(friendNet.reps[id]!==k){ friendNet.reps[id] = k; friendRefresh(); } }, ()=>{}),
      db.doc('players/'+id+'/seen').onSnapshot(s=>{ const v = val(s); friendNet.seen[id] = Number.isFinite(v) ? v : 0; friendRefresh(); }, ()=>{}) // (v254) 마지막 접속 시각
    ];
  });
}

function fbFromArrays(v){ // RTDB는 배열의 빈칸(null)을 지우고 숫자 키 객체로 돌려주기도 함 → 숫자 키만 있는 객체는 배열로 되돌림
  if(Array.isArray(v)) return v.map(fbFromArrays);
  if(v && typeof v==='object'){
    const ks = Object.keys(v);
    if(ks.length && ks.every(k=>/^\d+$/.test(k))){ const arr = []; ks.forEach(k=>{ arr[+k] = fbFromArrays(v[k]); }); for(let i=0;i<arr.length;i++) if(arr[i]===undefined) arr[i] = null; return arr; }
    const o = {}; ks.forEach(k=>{ o[k] = fbFromArrays(v[k]); }); return o;
  }
  return v;
}
function fbFlatten(obj, prefix, out){ // 중첩 객체는 경로별로 풀어서 병합(배열·값은 통째로 교체) — 기존 db.update의 병합 방식과 같게
  Object.keys(obj).forEach(k=>{
    const v = obj[k], p = prefix ? prefix+'/'+k : k;
    if(v && typeof v==='object' && !Array.isArray(v) && Object.keys(v).length) fbFlatten(v, p, out);
    else out[p] = (v===undefined) ? null : v;
  });
  return out;
}
function makeFirebaseNet(fb){

    const r = fb.ref(fb.rtdb, path);
    return { id: path.split('/').pop(), path,
      get: ()=> fb.get(r).then(mkSnap),
      set: data=> fb.set(r, JSON.parse(JSON.stringify(data))),
      update: async patch=>{
        const s = await fb.get(r);
        if(!s.exists()){ const e = new Error('missing'); e.code = 'invalid_argument'; throw e; }
        return fb.update(r, fbFlatten(JSON.parse(JSON.stringify(patch)), '', {}));
      },
      delete: ()=> fb.remove(r),
      onSnapshot: (next, onErr)=> fb.onValue(r, s=>next(mkSnap(s)), e=>{ if(onErr) onErr(e); }),
      acquire: async ({holder, ttlMs})=>{
        const lr = fb.ref(fb.rtdb, 'locks/'+lockKey(path));
        const res = await fb.runTransaction(lr, cur=>{
          const now = Date.now();
          if(cur && cur.exp > now && cur.holder !== holder) return; // 다른 사람이 잡고 있음 → 중단
          return { holder, exp: now + (ttlMs||30000) };
        });
        return { acquired: !!res.committed, holder };
      } };
  };
  const db = { doc, collection: p=>({ doc: id=>doc(p+'/'+id) }) };
  const user = { id: async()=> fb.uid, can: async()=> true, isOwner: async()=> false,
    profiles: async ids=>{ const o = {}; await Promise.all([].concat(ids).map(async id=>{ try{ const s = await fb.get(fb.ref(fb.rtdb, 'players/'+id+'/name')); o[id] = { name: s.exists() ? String(s.val()).slice(0,20) : '소환사-'+id.slice(0,4) }; }catch(e){ o[id] = { name:'소환사-'+id.slice(0,4) }; } })); return o; } };
  const room = { join: async name=>{
    const base = 'presence/'+name.replace(/[^a-z0-9_-]/gi,'_'), me = fb.ref(fb.rtdb, base+'/'+fb.uid);
    await fb.onDisconnect(me).remove(); // 앱을 닫거나 연결이 끊기면 서버가 알아서 접속 표시를 지움
    let pres = { uid: fb.uid };
    await fb.set(me, pres);
    const unsubs = [];
    // (v173 버그수정) 앱을 잠깐 나갔다 오면 연결이 끊기며 접속 표시가 지워지는데 다시 켜지 않던 문제 — 연결될 때마다 다시 등록
